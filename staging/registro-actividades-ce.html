    styles:{fontSize:7},headStyles:{fillColor:[17,30,96]},
  });
  doc.save(`agenda_semanal_directores_${dayKey()}.pdf`);
}

/* Calendario mensual interactivo: un número por día con la cantidad de actividades agendadas;
   en rojo los días que tienen al menos una que amerita suspender clases. Al hacer clic en un día
   con datos, se abre el detalle (DiaAgendaModal). */
function MiniCalendarioAgenda({filas,onDiaClick}){
  const hoy=dayKey();
  const [mesRef,setMesRef]=useState(()=>{const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d;});
  const anio=mesRef.getFullYear(), mes=mesRef.getMonth();
  const primerDiaSemana=(new Date(anio,mes,1).getDay()+6)%7; // lunes=0
  const diasEnMes=new Date(anio,mes+1,0).getDate();
  const porDia={};
  filas.forEach(f=>{
    if(!f.fecha) return;
    if(!porDia[f.fecha]) porDia[f.fecha]={total:0,suspende:0};
    porDia[f.fecha].total++;
    if(f.afectaClases==="Sí") porDia[f.fecha].suspende++;
  });
  const celdas=[];
  for(let i=0;i<primerDiaSemana;i++) celdas.push(null);
  for(let d=1;d<=diasEnMes;d++) celdas.push(d);
  const nombreMes=mesRef.toLocaleDateString("es-SV",{month:"long",year:"numeric"});
  const irA=delta=>setMesRef(m=>{const n=new Date(m);n.setMonth(n.getMonth()+delta);return n;});

  return (<div className="card card-pad" style={{maxWidth:520,margin:"0 auto"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
      <button className="btn btn-ghost btn-sm" onClick={()=>irA(-1)}>← Anterior</button>
      <div className="section-title" style={{margin:0,textTransform:"capitalize",fontSize:14}}>{nombreMes}</div>
      <button className="btn btn-ghost btn-sm" onClick={()=>irA(1)}>Siguiente →</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,fontSize:10,color:"var(--text-dim)",marginBottom:3,textAlign:"center",fontWeight:700}}>
      {["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d=><div key={d}>{d}</div>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
      {celdas.map((d,i)=>{
        if(d==null) return <div key={i}/>;
        const fecha=`${anio}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const info=porDia[fecha];
        const esHoy=fecha===hoy;
        return (
          <button key={i} disabled={!info} onClick={()=>info&&onDiaClick(fecha)}
            title={info?`${info.total} actividad(es)${info.suspende?`, ${info.suspende} con suspensión`:""}`:""}
            style={{height:34,borderRadius:7,border:esHoy?"2px solid var(--navy-2)":"1px solid var(--border)",
              background:info?(info.suspende>0?"var(--danger-bg)":"var(--success-bg)"):"var(--surface-2)",
              cursor:info?"pointer":"default",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:0,gap:0,lineHeight:1}}>
            <span style={{fontSize:10.5,fontWeight:esHoy?800:500,color:esHoy?"var(--navy-2)":"inherit"}}>{d}</span>
            {info && <span style={{fontSize:10,fontWeight:800,color:info.suspende>0?"var(--danger)":"var(--success)"}}>{info.total}</span>}
          </button>
        );
      })}
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:8,fontSize:10.5,color:"var(--text-dim)"}}>
      <span><span style={{display:"inline-block",width:8,height:8,borderRadius:2,background:"var(--danger-bg)",border:"1px solid var(--danger)",marginRight:4}}/>Con suspensión</span>
      <span><span style={{display:"inline-block",width:8,height:8,borderRadius:2,background:"var(--success-bg)",border:"1px solid var(--success)",marginRight:4}}/>Sin suspensión</span>
    </div>
  </div>);
}
/* Detalle emergente de un día del calendario: prioriza (arriba) las actividades que amerarán
   suspensión de clases, mostrando código y departamento de cada Centro Educativo. */
function DiaAgendaModal({fecha,filas,onClose}){
  const delDia=filas.filter(f=>f.fecha===fecha)
    .sort((a,b)=>(a.afectaClases==="Sí"?0:1)-(b.afectaClases==="Sí"?0:1) || a.codigo.localeCompare(b.codigo));
  const suspenden=delDia.filter(f=>f.afectaClases==="Sí").length;
  return (<Modal title={`Actividades del ${fecha}`} onClose={onClose} wide foot={<button className="btn btn-primary" onClick={onClose}>Cerrar</button>}>
    <div className="row" style={{gap:8,marginBottom:10}}>
      <span className="tag">{delDia.length} actividad(es)</span>
      <span className="tag" style={{color:"var(--danger)"}}>{suspenden} con suspensión de clases</span>
    </div>
    {delDia.length===0 ? <div className="empty">No hay actividades registradas este día.</div> :
    <div className="tbl-wrap scroll-y" style={{maxHeight:460}}><table>
      <thead><tr><th>Código</th><th>Departamento</th><th>Centro Educativo</th><th>Municipio</th><th>Tipo de actividad</th><th>¿Suspende clases?</th></tr></thead>
      <tbody>{delDia.map(f=>(
        <tr key={f.key} style={f.afectaClases==="Sí"?{background:"var(--danger-bg)"}:null}>
          <td className="mono">{f.codigo}</td>
          <td>{f.departamento}</td>
          <td>{f.nombre}</td>
          <td>{f.municipio}</td>
          <td>{f.tipoActividad}{f.bloque&&<div className="mini" style={{color:"var(--text-dim)"}}>{f.bloque}</div>}</td>
          <td><Pill kind={f.afectaClases==="Sí"?"p-danger":"p-success"}>{f.afectaClases==="Sí"?`Sí${f.tipoAfectacion?` · ${f.tipoAfectacion}`:""}`:"No"}</Pill></td>
        </tr>))}
      </tbody>
    </table></div>}
  </Modal>);
}

function AgendaDirectores({ctx}){
  const {campaigns,records,schools,session,notify}=ctx;
  const can=CAN[session.rol];
  const puedeEditar=can.agendaDirectoresEditar;
  const hoy=dayKey();

  const todasLasFilas=useMemo(()=>filasAgendaDirectores(campaigns,records,schools),[campaigns,records,schools]);
  const ordenEs=(a,b)=>a.localeCompare(b,"es",{sensitivity:"base"});
  const deptos=[...new Set(todasLasFilas.map(f=>f.departamento).filter(Boolean))].sort(ordenEs);
  const municipios=[...new Set(todasLasFilas.map(f=>f.municipio).filter(Boolean))].sort(ordenEs);
  const distritos=[...new Set(todasLasFilas.map(f=>f.distrito).filter(Boolean))].sort(ordenEs);

  const [soloHoy,setSoloHoy]=useState(true);
  const [fDesde,setFDesde]=useState("");
  const [fHasta,setFHasta]=useState("");
  const [fCodigo,setFCodigo]=useState("");
  const [fDepto,setFDepto]=useState("");
  const [fMuni,setFMuni]=useState("");
  const [fDistrito,setFDistrito]=useState("");
  const [fSuspende,setFSuspende]=useState("todos"); // todos | si | no
  const [active,setActive]=useState(null); // {s,r,camp} para editar
  const [diaModal,setDiaModal]=useState(null); // fecha (YYYY-MM-DD) del día que se está viendo en el calendario

  // igual que "filtradas" pero sin los filtros de fecha — es lo que alimenta el calendario mensual
  const filasParaCalendario=useMemo(()=>todasLasFilas.filter(f=>{
    if(fCodigo && !f.codigo.toLowerCase().includes(fCodigo.trim().toLowerCase())) return false;
    if(fDepto && f.departamento!==fDepto) return false;
    if(fMuni && f.municipio!==fMuni) return false;
    if(fDistrito && f.distrito!==fDistrito) return false;
    if(fSuspende==="si" && f.afectaClases!=="Sí") return false;
    if(fSuspende==="no" && f.afectaClases==="Sí") return false;
    return true;
  }),[todasLasFilas,fCodigo,fDepto,fMuni,fDistrito,fSuspende]);

  const hayRangoFecha = !!(fDesde || fHasta);
  const filtradas=useMemo(()=>todasLasFilas.filter(f=>{
    if(!hayRangoFecha && soloHoy && f.fecha!==hoy) return false;
    if(fDesde && (!f.fecha || f.fecha<fDesde)) return false;
    if(fHasta && (!f.fecha || f.fecha>fHasta)) return false;
    if(fCodigo && !f.codigo.toLowerCase().includes(fCodigo.trim().toLowerCase())) return false;
    if(fDepto && f.departamento!==fDepto) return false;
    if(fMuni && f.municipio!==fMuni) return false;
    if(fDistrito && f.distrito!==fDistrito) return false;
    if(fSuspende==="si" && f.afectaClases!=="Sí") return false;
    if(fSuspende==="no" && f.afectaClases==="Sí") return false;
    return true;
  }).sort((a,b)=>(a.afectaClases==="Sí"?0:1)-(b.afectaClases==="Sí"?0:1) || (a.fecha||"").localeCompare(b.fecha||"")),
  [todasLasFilas,soloHoy,hayRangoFecha,fDesde,fHasta,fCodigo,fDepto,fMuni,fDistrito,fSuspende]);

  const suspendenHoy=filtradas.filter(f=>f.afectaClases==="Sí").length;
  const limpiarFiltros=()=>{ setSoloHoy(false); setFDesde("");setFHasta("");setFCodigo("");setFDepto("");setFMuni("");setFDistrito("");setFSuspende("todos"); };

  const abrirEdicion=f=>{
    const camp=campaigns.find(c=>c.id===f.campaignId);
    const s=schools.find(x=>x.codigo===f.codigo)||{codigo:f.codigo,nombre:f.nombre,departamento:f.departamento,municipio:f.municipio,distrito:f.distrito,telefonos:[]};
    const r=records.find(x=>x.id===f.recordId);
    if(camp&&r) setActive({s,r,camp});
  };

  return (<div className="grid">
    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <div className="grow"><div className="section-title" style={{margin:0}}>Agenda semanal directores</div><small className="muted">Actividades registradas en campañas con la etiqueta «{ETIQUETA_AGENDA_DIRECTORES}».</small></div>
      <button className="btn btn-ghost btn-sm" onClick={()=>exportarCargaSDP(filtradas)}>⬇ Carga SDP</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>exportarAgendaDirectoresExcel(filtradas)}>⬇ Excel</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>exportarAgendaDirectoresPDF(filtradas)}>⬇ PDF</button>
    </div>

    <MiniCalendarioAgenda filas={filasParaCalendario} onDiaClick={setDiaModal}/>

    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))"}}>
      <Stat k="Actividades (con filtros)" v={filtradas.length} c="var(--navy-2)"/>
      <Stat k="Requieren suspender clases" v={suspendenHoy} c="var(--danger)"/>
      <Stat k="Centros con agenda" v={new Set(todasLasFilas.map(f=>f.codigo)).size} c="var(--info)"/>
    </div>

    <div className="card card-pad">
      <div className="row" style={{gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
        <label className="checkline" style={{border:"1px solid var(--border)",borderRadius:8,padding:"8px 10px",opacity:hayRangoFecha?0.5:1}}>
          <input type="checkbox" checked={soloHoy} disabled={hayRangoFecha} onChange={e=>setSoloHoy(e.target.checked)}/><span>Solo hoy ({hoy})</span>
        </label>
        <div className="field" style={{margin:0}}><label>Desde</label><input className="input" type="date" value={fDesde} onChange={e=>setFDesde(e.target.value)}/></div>
        <div className="field" style={{margin:0}}><label>Hasta</label><input className="input" type="date" value={fHasta} onChange={e=>setFHasta(e.target.value)}/></div>
        <div className="field" style={{margin:0}}><label>Código de centro</label><input className="input" style={{width:140}} placeholder="Ej. 10123" value={fCodigo} onChange={e=>setFCodigo(e.target.value)}/></div>
        <div className="field" style={{margin:0}}><label>Departamento</label><select className="input" value={fDepto} onChange={e=>setFDepto(e.target.value)}><option value="">Todos</option>{deptos.map(d=><option key={d}>{d}</option>)}</select></div>
        <div className="field" style={{margin:0}}><label>Municipio</label><select className="input" value={fMuni} onChange={e=>setFMuni(e.target.value)}><option value="">Todos</option>{municipios.map(d=><option key={d}>{d}</option>)}</select></div>
        <div className="field" style={{margin:0}}><label>Distrito</label><select className="input" value={fDistrito} onChange={e=>setFDistrito(e.target.value)}><option value="">Todos</option>{distritos.map(d=><option key={d}>{d}</option>)}</select></div>
        <div className="field" style={{margin:0}}><label>¿Suspende clases?</label><div className="seg">{[["todos","Todos"],["si","Sí"],["no","No"]].map(([k,t])=><button key={k} className={fSuspende===k?"on":""} onClick={()=>setFSuspende(k)}>{t}</button>)}</div></div>
        <button className="btn btn-ghost btn-sm" onClick={limpiarFiltros}>Limpiar filtros</button>
      </div>
      {hayRangoFecha && <small className="muted" style={{display:"block",marginTop:8}}>Mostrando {fDesde?`desde ${fDesde}`:"desde el inicio"} {fHasta?`hasta ${fHasta}`:"sin fecha límite"} — deja ambos campos vacíos para volver a "Solo hoy".</small>}
    </div>

    <div className="card card-pad">
      {filtradas.length===0
        ? <div className="empty">No hay actividades que coincidan con los filtros{!hayRangoFecha&&soloHoy?" para el día de hoy":""}.</div>
        : <div className="tbl-wrap scroll-y" style={{maxHeight:560}}><table>
            <thead><tr><th>Código</th><th>Centro Educativo</th><th>Depto.</th><th>Municipio</th><th>Distrito</th><th>Fecha</th><th>Hora</th><th>Tipo de actividad</th><th>¿Suspende clases?</th><th>Involucrados</th><th>Participantes</th>{puedeEditar&&<th></th>}</tr></thead>
            <tbody>{filtradas.map(f=>(
              <tr key={f.key} style={f.afectaClases==="Sí"?{background:"var(--danger-bg)"}:null}>
                <td className="mono">{f.codigo}</td>
                <td>{f.nombre}</td>
                <td>{f.departamento}</td>
                <td>{f.municipio}</td>
                <td>{f.distrito}</td>
                <td className="mono">{f.fecha}</td>
                <td className="mono">{f.hora||"—"}</td>
                <td>{f.tipoActividad}{f.bloque&&<div className="mini" style={{color:"var(--text-dim)"}}>{f.bloque}</div>}</td>
                <td><Pill kind={f.afectaClases==="Sí"?"p-danger":"p-success"}>{f.afectaClases==="Sí"?`Sí${f.tipoAfectacion?` · ${f.tipoAfectacion}`:""}`:"No"}</Pill></td>
                <td>{f.involucrados||"—"}</td>
                <td>{f.participantes||"—"}</td>
                {puedeEditar&&<td><button className="btn btn-ghost btn-sm" onClick={()=>abrirEdicion(f)}>Ver / editar</button></td>}
              </tr>))}
            </tbody>
          </table></div>}
    </div>
    {active && <CallPanel ctx={ctx} camp={active.camp} school={active.s} rec={active.r} onClose={()=>setActive(null)}/>}
    {diaModal && <DiaAgendaModal fecha={diaModal} filas={filasParaCalendario} onClose={()=>setDiaModal(null)}/>}
  </div>);
}

/* ============================ ALERTAS (Team leader / Supervisor / Administrador) ============================ */
function AlertasErrores({ctx}){
  const {alertas,marcarAlertaRevisada,marcarTodasAlertasRevisadas}=ctx;
  const [soloPendientes,setSoloPendientes]=useState(true);
  const lista=(soloPendientes?alertas.filter(a=>!a.revisado):alertas).slice().sort((a,b)=>b.creadoEn-a.creadoEn);
  const pendientes=alertas.filter(a=>!a.revisado).length;

  return (<div className="grid">
    <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div className="grow"><div className="section-title" style={{margin:0}}>Alertas de errores</div>
          <small className="muted">Cuando a un Agente (u otro usuario) le falla un guardado, aparece aquí con el detalle, para que puedan darle seguimiento.</small></div>
        <span className="tag">{pendientes} sin revisar</span>
        <label className="checkline" style={{border:"none",padding:0,gap:8}}><input type="checkbox" checked={soloPendientes} onChange={e=>setSoloPendientes(e.target.checked)}/><small className="muted">Solo sin revisar</small></label>
        {pendientes>0 && <button className="btn btn-ghost btn-sm" onClick={marcarTodasAlertasRevisadas}>Marcar todas como revisadas</button>}
      </div>
    </div>

    {lista.length===0 && <div className="card card-pad"><div className="empty"><div className="big">✅</div>{soloPendientes?"No hay alertas pendientes de revisar.":"No se ha registrado ninguna alerta todavía."}</div></div>}

    {lista.length>0 && <div className="card card-pad">
      <div className="tbl-wrap scroll-y" style={{maxHeight:520}}><table>
        <thead><tr><th>Agente</th><th>Rol</th><th>Error</th><th>Cuándo</th><th>Estado</th><th></th></tr></thead>
        <tbody>{lista.map(a=>(
          <tr key={a.id}>
            <td><b>{a.usuarioNombre}</b></td>
            <td>{a.usuarioRol}</td>
            <td style={{maxWidth:340}}>{a.mensaje}{a.detalle&&<div className="mini" style={{color:"var(--text-dim)"}}>{a.detalle}</div>}</td>
            <td className="mono" style={{whiteSpace:"nowrap"}}>{new Date(a.creadoEn).toLocaleString("es-SV")}</td>
            <td><Pill kind={a.revisado?"p-success":"p-danger"}>{a.revisado?"Revisado":"Sin revisar"}</Pill></td>
            <td>{!a.revisado && <button className="btn btn-ghost btn-sm" onClick={()=>marcarAlertaRevisada(a.id)}>Marcar revisado</button>}</td>
          </tr>))}
        </tbody>
      </table></div>
    </div>}
  </div>);
}

/* ============================ ADMINISTRACIÓN DE USUARIOS ============================ */
function Administracion({ctx}){
  const {users,patchUser,session,notify}=ctx;
  const can=CAN[session.rol];
  const [crear,setCrear]=useState(false);
  const [crearMasivo,setCrearMasivo]=useState(false);
  const pend=users.filter(u=>u.estado==="pendiente");
  const resto=users.filter(u=>u.estado!=="pendiente");
  const approve=u=>{patchUser(u.id,{estado:"activo",...(u.rol==="Agente"?{skill:u.skill||"Outbound",turno:u.turno||CURRENT_SHIFT,disponible:u.disponible!==false,habilitadoFueraTurno:!!u.habilitadoFueraTurno,habilitadoLlamadas:u.habilitadoLlamadas!==false,opStatus:u.opStatus||"Activo",statusSince:null,loginSince:null}:{})});registrarAccion(session.id,"aprobar_usuario",`${session.nombre} aprobó a ${u.nombre} (${u.rol})`);notify("Usuario aprobado");};
  const reject=u=>{patchUser(u.id,{estado:"inactivo"});registrarAccion(session.id,"rechazar_usuario",`${session.nombre} rechazó la solicitud de ${u.nombre}`);notify("Solicitud rechazada","info");};
  const setRol=(u,rol)=>{patchUser(u.id,{rol});registrarAccion(session.id,"cambiar_rol",`${session.nombre} cambió el rol de ${u.nombre}: ${u.rol} → ${rol}`);};
  const baja=u=>{patchUser(u.id,{estado:"inactivo"});registrarAccion(session.id,"baja_usuario",`${session.nombre} dio de baja a ${u.nombre}`);notify("Usuario dado de baja","info");};
  const reactivar=u=>{patchUser(u.id,{estado:"activo"});registrarAccion(session.id,"reactivar_usuario",`${session.nombre} reactivó a ${u.nombre}`);notify("Usuario reactivado");};

  return (<div className="grid">
    <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
      {can.crearUsuario && <button className="btn btn-ghost btn-sm" onClick={()=>setCrearMasivo(true)}>⬆ Creación masiva</button>}
      {can.crearUsuario && <button className="btn btn-primary btn-sm" onClick={()=>setCrear(true)}>＋ Crear usuario</button>}
    </div>
    <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Solicitudes de acceso pendientes ({pend.length})</div>
      {pend.length===0?<div className="empty" style={{padding:18}}>No hay solicitudes por aprobar.</div>:
      <div className="tbl-wrap"><table>
        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol solicitado</th><th></th></tr></thead>
        <tbody>{pend.map(u=>(
          <tr key={u.id}><td><b>{u.nombre}</b></td><td className="mono">{u.email}</td><td><Pill kind="p-warn">{u.rol}</Pill></td>
          <td style={{whiteSpace:"nowrap"}}>
            <button className="btn btn-accent btn-sm" onClick={()=>approve(u)}>Aprobar</button>
            <button className="btn btn-ghost btn-sm" style={{marginLeft:6}} onClick={()=>reject(u)}>Rechazar</button>
          </td></tr>))}
        </tbody></table></div>}
    </div>

    <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Usuarios del sistema ({resto.length})</div>
      <div className="tbl-wrap"><table>
        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
        <tbody>{resto.map(u=>{const yo=u.id===session.id;return(
          <tr key={u.id}>
            <td><b>{u.nombre}</b>{yo&&<span className="tag" style={{marginLeft:6}}>tú</span>}</td>
            <td className="mono">{u.email}</td>
            <td><select className="input" style={{width:"auto"}} value={u.rol} disabled={yo} onChange={e=>setRol(u,e.target.value)}>{ROLES.map(r=><option key={r}>{r}</option>)}</select></td>
            <td><Pill kind={u.estado==="activo"?"p-success":"p-neutral"}>{u.estado}</Pill></td>
            <td style={{whiteSpace:"nowrap"}}>{u.estado==="activo"
              ? <button className="btn btn-ghost btn-sm" disabled={yo} style={{color:yo?null:"var(--danger)"}} onClick={()=>baja(u)}>Dar de baja</button>
              : <button className="btn btn-ghost btn-sm" onClick={()=>reactivar(u)}>Reactivar</button>}</td>
          </tr>);})}
        </tbody></table></div>
    </div>
    {crear && <CrearUsuarioModal ctx={ctx} onClose={()=>setCrear(false)}/>}
    {crearMasivo && <CrearUsuariosMasivoModal ctx={ctx} onClose={()=>setCrearMasivo(false)}/>}
  </div>);
}

/* ============================ LOGS DE USUARIOS (Administrador) ============================ */
function LogsUsuarios({ctx}){
  const {users,notify}=ctx;
  const [filas,setFilas]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [usuarioSel,setUsuarioSel]=useState("todos");
  const [desde,setDesde]=useState("");
  const [hasta,setHasta]=useState("");
  const [busqueda,setBusqueda]=useState("");

  const cargar=async()=>{
    if(!supabase) return setCargando(false);
    setCargando(true);
    const data=await fetchBitacora();
    setFilas(data);
    setCargando(false);
  };
  useEffect(()=>{ cargar(); },[]);

  const nombreDe=id=>(users.find(u=>u.id===id)||{}).nombre||"—";
  const filtradas=filas.filter(f=>{
    if(usuarioSel!=="todos" && f.usuarioId!==usuarioSel) return false;
    if(desde && f.cuando < new Date(desde+"T00:00:00").getTime()) return false;
    if(hasta && f.cuando > new Date(hasta+"T23:59:59").getTime()) return false;
    if(busqueda.trim()){
      const q=busqueda.trim().toLowerCase();
      const texto=(nombreDe(f.usuarioId)+" "+(ACCION_LABEL[f.accion]||f.accion)+" "+(f.detalle||"")).toLowerCase();
      if(!texto.includes(q)) return false;
    }
    return true;
  });
  const LIMITE_VISTA=400;
  const visibles=filtradas.slice(0,LIMITE_VISTA);

  return (<div className="grid">
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <div className="grow"><div className="section-title" style={{margin:0}}>Logs de usuarios</div><small className="muted">Historial de inicios/cierres de sesión y acciones importantes realizadas en la herramienta.</small></div>
      <button className="btn btn-ghost btn-sm" onClick={cargar} disabled={cargando}>{cargando?"Cargando…":"⟳ Actualizar"}</button>
    </div>

    <div className="card card-pad">
      <div className="row" style={{gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div className="field" style={{margin:0}}><label>Usuario</label>
          <select className="input" value={usuarioSel} onChange={e=>setUsuarioSel(e.target.value)}>
            <option value="todos">Todos</option>
            {[...users].sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).map(u=><option key={u.id} value={u.id}>{u.nombre}</option>)}
          </select>
        </div>
        <div className="field" style={{margin:0}}><label>Desde</label><input className="input" type="date" value={desde} onChange={e=>setDesde(e.target.value)}/></div>
        <div className="field" style={{margin:0}}><label>Hasta</label><input className="input" type="date" value={hasta} onChange={e=>setHasta(e.target.value)}/></div>
        <div className="field grow" style={{margin:0}}><label>Buscar</label><input className="input" placeholder="Buscar por texto..." value={busqueda} onChange={e=>setBusqueda(e.target.value)}/></div>
      </div>
    </div>

    <div className="card card-pad">
      {cargando ? <div className="empty" style={{padding:20}}>Cargando bitácora…</div>
      : filtradas.length===0 ? <div className="empty" style={{padding:20}}>No hay registros que coincidan con el filtro.</div>
      : <>
        <div className="tbl-wrap scroll-y"><table>
          <thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead>
          <tbody>{visibles.map(f=>(
            <tr key={f.id}>
              <td className="mono" style={{whiteSpace:"nowrap"}}>{new Date(f.cuando).toLocaleString("es-SV")}</td>
              <td><b>{nombreDe(f.usuarioId)}</b></td>
              <td><span className="tag">{ACCION_LABEL[f.accion]||f.accion}</span></td>
              <td style={{color:"var(--text-dim)"}}>{f.detalle||"—"}</td>
            </tr>
          ))}</tbody>
        </table></div>
        <small className="muted" style={{display:"block",marginTop:8}}>
          Mostrando {visibles.length} de {filtradas.length} registro(s) que coinciden con el filtro
          {filtradas.length>LIMITE_VISTA?` (limitado a los ${LIMITE_VISTA} más recientes; afina el filtro para ver menos resultados a la vez)`:""}.
        </small>
      </>}
    </div>
  </div>);
}

/* ============================ SALUD DEL SISTEMA (Administrador) ============================ */
function SaludSistema({ctx}){
  const {users,campaigns,schools,notify}=ctx;
  const [salud,setSalud]=useState(null);
  const [actividad,setActividad]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [ultimaActualizacion,setUltimaActualizacion]=useState(null);
  const [autoRefresh,setAutoRefresh]=useState(true);

  const actualizar=async()=>{
    if(!supabase) return setCargando(false);
    setCargando(true);
    const [s,b]=await Promise.all([medirSaludSistema(),fetchBitacora()]);
    setSalud(s);
    setActividad(b.slice(0,10));
    setUltimaActualizacion(Date.now());
    setCargando(false);
  };
  useEffect(()=>{ actualizar(); },[]);
  useEffect(()=>{
    if(!autoRefresh) return;
    const id=setInterval(actualizar,30000);
    return ()=>clearInterval(id);
  },[autoRefresh]);

  const nombreDe=id=>(users.find(u=>u.id===id)||{}).nombre||"—";
  const usuariosConSesion=users.filter(u=>u.loginSince).length;
  const campanasEnCurso=campaigns.filter(c=>c.estado==="En curso").length;

  const antiguedadSync=salud&&salud.ultimaSincronizacionCentros?Date.now()-salud.ultimaSincronizacionCentros:null;
  const nivelSync=antiguedadSync==null?"danger":antiguedadSync<26*3600*1000?"success":antiguedadSync<48*3600*1000?"warn":"danger";
  const nivelConexion=!salud?"warn":salud.conexionOk?"success":"danger";

  const Tarjeta=({titulo,valor,meta,nivel})=>(
    <div className="card card-pad" style={{borderLeft:`4px solid var(--${nivel==="success"?"success":nivel==="warn"?"warn":"danger"})`}}>
      <div style={{fontSize:11.5,color:"var(--text-dim)",textTransform:"uppercase",letterSpacing:".03em"}}>{titulo}</div>
      <div style={{fontSize:22,fontWeight:800,marginTop:4}}>{valor}</div>
      {meta&&<div style={{fontSize:12,color:"var(--text-dim)",marginTop:2}}>{meta}</div>}
    </div>
  );

  return (<div className="grid">
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <div className="grow">
        <div className="section-title" style={{margin:0}}>Salud del sistema</div>
        <small className="muted">{ultimaActualizacion?`Actualizado hace un momento (${new Date(ultimaActualizacion).toLocaleTimeString("es-SV")})`:"Cargando…"}</small>
      </div>
      <label className="checkline" style={{border:"none",padding:0,gap:6}}>
        <input type="checkbox" checked={autoRefresh} onChange={e=>setAutoRefresh(e.target.checked)}/>
        <small>Actualizar cada 30s</small>
      </label>
      <button className="btn btn-ghost btn-sm" onClick={actualizar} disabled={cargando}>{cargando?"Actualizando…":"⟳ Actualizar ahora"}</button>
    </div>

    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))"}}>
      <Tarjeta titulo="Conexión a Supabase" valor={!salud?"—":salud.conexionOk?"Conectado":"Sin conexión"} meta={salud&&salud.latenciaMs!=null?`${salud.latenciaMs} ms de latencia`:null} nivel={nivelConexion}/>
      <Tarjeta titulo="Sincronización de centros" valor={salud&&salud.ultimaSincronizacionCentros?new Date(salud.ultimaSincronizacionCentros).toLocaleString("es-SV"):"Sin datos"} meta={antiguedadSync!=null?`hace ${Math.round(antiguedadSync/3600000)} h`:null} nivel={nivelSync}/>
      <Tarjeta titulo="Usuarios con sesión activa" valor={usuariosConSesion} meta={`de ${users.length} cuentas totales`} nivel="success"/>
      <Tarjeta titulo="Campañas en curso" valor={campanasEnCurso} nivel="success"/>
      <Tarjeta titulo="Centros escolares en catálogo" valor={schools.length} nivel="success"/>
    </div>

    <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Actividad reciente</div>
      {actividad.length===0 ? <div className="empty" style={{padding:14}}>Sin actividad registrada todavía.</div>
      : <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {actividad.map(f=>(
            <div key={f.id} style={{display:"flex",gap:10,fontSize:13,alignItems:"baseline"}}>
              <span className="mono" style={{color:"var(--text-faint)",flexShrink:0}}>{new Date(f.cuando).toLocaleTimeString("es-SV")}</span>
              <span><b>{nombreDe(f.usuarioId)}</b> — {(ACCION_LABEL[f.accion]||f.accion).toLowerCase()}{f.detalle?`: ${f.detalle}`:""}</span>
            </div>
          ))}
        </div>}
      <small className="muted" style={{display:"block",marginTop:10}}>Para ver el historial completo con filtros, ve a «Logs de usuarios».</small>
    </div>
  </div>);
}

/* ---- Crear usuario directamente (Administrador) ---- */
function CrearUsuarioModal({ctx,onClose}){
  const {users,setUsers,session,notify}=ctx;
  const [nombre,setNombre]=useState("");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [rol,setRol]=useState("Agente");
  const [err,setErr]=useState(null);
  const [loading,setLoading]=useState(false);
  const crear=async()=>{
    if(!nombre.trim()||!email.trim()||!pass.trim()) return setErr("Completa todos los campos.");
    if(!passwordValida(pass)) return setErr("La contraseña temporal no cumple los requisitos mínimos (ver la lista debajo del campo).");
    if(users.some(u=>u.email.toLowerCase()===email.trim().toLowerCase())) return setErr("Ya existe un usuario con ese correo.");
    if(!supabase) return setErr("Falta configurar la conexión a Supabase.");
    setLoading(true);setErr(null);
    const {data:{session:sesionActual}}=await supabase.auth.getSession();
    try{
      const res=await fetch(EDGE_FUNCTION_CREAR_USUARIO,{
        method:"POST",
        headers:{"Content-Type":"application/json",Authorization:`Bearer ${sesionActual.access_token}`},
        body:JSON.stringify({nombre:nombre.trim(),email:email.trim(),password:pass,rol}),
      });
      const out=await res.json();
      setLoading(false);
      if(!res.ok||out.error) return setErr(out.error||"No se pudo crear el usuario.");
      const nuevoPerfil={
        id:out.id, nombre:nombre.trim(), email:email.trim(), rol, estado:"activo", debeCambiarPassword:true,
        ...(rol==="Agente"?{skill:"Outbound",turno:CURRENT_SHIFT,disponible:true,habilitadoFueraTurno:false,habilitadoLlamadas:true,opStatus:"Activo",statusSince:null,loginSince:null}:{}),
      };
      setUsers(p=>[...p,nuevoPerfil]);
      registrarAccion(session.id,"crear_usuario_admin",`${session.nombre} creó la cuenta de ${nombre.trim()} (${rol})`);
      notify(`Usuario creado: ${nombre.trim()} (${rol})`);onClose();
    }catch(e){
      setLoading(false);
      setErr("No se pudo contactar la función de creación de usuarios. ¿Ya la desplegaste en Supabase?");
    }
  };
  return (<Modal title="Crear usuario" onClose={onClose} foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-accent" disabled={loading} onClick={crear}>{loading?"Creando…":"Crear usuario"}</button></>}>
    <div className="field"><label>Nombre completo</label><input className="input" value={nombre} onChange={e=>setNombre(e.target.value)}/></div>
    <div className="field"><label>Correo institucional</label><input className="input" value={email} onChange={e=>setEmail(e.target.value)} placeholder="usuario@edu.gob.sv"/></div>
    <div className="field"><label>Contraseña temporal</label><PasswordInput value={pass} onChange={e=>setPass(e.target.value)}/>
      <PasswordChecklist value={pass}/>
    </div>
    <div className="field"><label>Rol</label><select className="input" value={rol} onChange={e=>setRol(e.target.value)}>{ROLES.map(r=><option key={r}>{r}</option>)}</select></div>
    <small className="muted">El usuario queda activo de inmediato, sin pasar por aprobación. Deberá cambiar esta contraseña temporal al iniciar sesión por primera vez.</small>
    {err&&<div className="alert alert-err" style={{marginTop:10}}>{err}</div>}
  </Modal>);
}

/* ---- Creación masiva de usuarios desde archivo (Administrador) ---- */
function CrearUsuariosMasivoModal({ctx,onClose}){
  const {users,setUsers,session,notify}=ctx;
  const [fase,setFase]=useState("subir"); // subir | revisar | creando | reporte
  const [filas,setFilas]=useState([]);
  const [upInfo,setUpInfo]=useState(null);
  const [progreso,setProgreso]=useState(0);
  const [reporte,setReporte]=useState([]);

  const onFile=file=>{
    if(!file)return;
    setUpInfo({nombre:file.name,cargando:true});
    parseUsuariosFile(file,(err,res)=>{
      if(err){setFilas([]);setUpInfo({nombre:file.name,error:err.message});return;}
      setFilas(res.filas);setUpInfo({nombre:file.name,total:res.total,hoja:res.hoja});setFase("revisar");
    });
  };

  const ESTADO_LABEL={ok:"Se creará",invalido:"No válido",duplicado_archivo:"Repetido en archivo",ya_existe:"Ya existe una cuenta"};
  const ESTADO_PILL={ok:"p-success",invalido:"p-danger",duplicado_archivo:"p-warn",ya_existe:"p-neutral"};

  const emailsExistentes=new Set(users.map(u=>(u.email||"").toLowerCase()));
  const vistos=new Set();
  const analizadas=filas.map(f=>{
    const emailNorm=f.email.toLowerCase();
    const rol=matchRol(f.rolTexto);
    const turno=rol==="Agente"?(matchTurno(f.turnoTexto)||CURRENT_SHIFT):null;
    let estado="ok",motivo=null;
    if(!f.nombre||!f.email){estado="invalido";motivo="Falta nombre o correo.";}
    else if(!rol){estado="invalido";motivo=`Rol «${f.rolTexto||"—"}» no reconocido.`;}
    else if(vistos.has(emailNorm)){estado="duplicado_archivo";motivo="Este correo aparece más de una vez en el archivo.";}
    else if(emailsExistentes.has(emailNorm)){estado="ya_existe";motivo="Ya existe un usuario con ese correo.";}
    if(estado==="ok")vistos.add(emailNorm);
    return {...f,rol,turno,estado,motivo};
  });
  const aCrear=analizadas.filter(f=>f.estado==="ok");

  const crearTodos=async()=>{
    if(!supabase)return notify("Falta configurar la conexión a Supabase.","err");
    setFase("creando");setProgreso(0);
    const {data:{session:sesionActual}}=await supabase.auth.getSession();
    const salida=[];
    for(let i=0;i<aCrear.length;i++){
      const f=aCrear[i];
      const pass=generarPasswordTemporal();
      try{
        const res=await fetch(EDGE_FUNCTION_CREAR_USUARIO,{
          method:"POST",
          headers:{"Content-Type":"application/json",Authorization:`Bearer ${sesionActual.access_token}`},
          body:JSON.stringify({nombre:f.nombre,email:f.email,password:pass,rol:f.rol}),
        });
        const data=await res.json();
        if(!res.ok||data.error) salida.push({...f,password:pass,estado:"Error",motivo:data.error||"No se pudo crear."});
        else {
          if(f.rol==="Agente") await updateProfile(data.id,{skill:"Outbound",turno:f.turno});
          salida.push({...f,password:pass,estado:"Creado",motivo:null,id:data.id});
        }
      }catch(e){
        salida.push({...f,password:pass,estado:"Error",motivo:"No se pudo contactar la función de creación de usuarios."});
      }
      setProgreso(i+1);
    }
    const creados=salida.filter(o=>o.estado==="Creado");
    if(creados.length){
      setUsers(p=>[...p,...creados.map(c=>({
        id:c.id,nombre:c.nombre,email:c.email,rol:c.rol,estado:"activo",debeCambiarPassword:true,
        ...(c.rol==="Agente"?{skill:"Outbound",turno:c.turno,disponible:true,habilitadoFueraTurno:false,habilitadoLlamadas:true,opStatus:"Activo",statusSince:null,loginSince:null}:{}),
      }))]);
      creados.forEach(c=>registrarAccion(session.id,"crear_usuario_admin",`${session.nombre} creó la cuenta de ${c.nombre} (${c.rol}) — creación masiva`));
    }
    setReporte(salida);setFase("reporte");
    notify(`Creación masiva: ${creados.length} de ${aCrear.length} usuario(s) creados.`);
  };

  const descargarReporte=()=>{
    if(typeof XLSX==="undefined")return;
    const filasExcel=reporte.map(r=>({Nombre:r.nombre,Correo:r.email,Rol:r.rol,Turno:r.turno||"","Contraseña temporal":r.estado==="Creado"?r.password:"",Estado:r.estado,Detalle:r.motivo||""}));
    const ws=XLSX.utils.json_to_sheet(filasExcel);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Usuarios creados");
    XLSX.writeFile(wb,`usuarios_creados_${dayKey()}.xlsx`);
  };

  const foot = fase==="revisar"
    ? <><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-accent" disabled={!aCrear.length} onClick={crearTodos}>Crear {aCrear.length} usuario(s)</button></>
    : fase==="reporte"
    ? <><button className="btn btn-ghost" onClick={descargarReporte}>⬇ Descargar reporte</button><button className="btn btn-primary" onClick={onClose}>Cerrar</button></>
    : <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>;

  return (<Modal title="Creación masiva de usuarios" onClose={onClose} wide foot={foot}>
    {fase==="subir" && <div style={{margin:"4px 0"}}>
      <div style={{border:"1.5px dashed var(--border-strong)",borderRadius:12,padding:18,background:"var(--surface-2)",textAlign:"center"}}>
        <div style={{fontSize:26,opacity:.6}}>📄</div>
        <p style={{margin:"6px 0 12px",color:"var(--text-dim)"}}>Carga un archivo <b>CSV</b> o <b>Excel</b> con los usuarios a crear.</p>
        <label className="btn btn-primary btn-sm" style={{display:"inline-flex",cursor:"pointer"}}>Seleccionar archivo<input type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}} onChange={e=>onFile(e.target.files[0])}/></label>
        <button className="btn btn-ghost btn-sm" style={{marginLeft:8}} onClick={downloadTemplateUsuarios}>⬇ Descargar plantilla</button>
      </div>
      <small className="muted" style={{display:"block",marginTop:8}}>Columnas reconocidas: <b>Nombre</b>, <b>Correo</b>, <b>Rol</b> (Administrador, Team leader, Supervisor o Agente) y, opcional, <b>Turno</b> (AM o PM — solo aplica a Agentes; si se omite o no es válido, se usa el turno actual). Cada usuario queda activo de inmediato, con una contraseña temporal aleatoria que deberá cambiar en su primer ingreso.</small>
      {upInfo&&upInfo.error&&<div className="alert alert-err" style={{marginTop:10}}>No se pudo procesar «{upInfo.nombre}»: {upInfo.error}</div>}
    </div>}

    {fase==="revisar" && <div>
      <div className="row" style={{gap:8,marginBottom:10}}>
        <span className="tag">{aCrear.length} se crearán</span>
        <span className="tag">{analizadas.length-aCrear.length} omitidos</span>
      </div>
      <div className="tbl-wrap scroll-y" style={{maxHeight:360}}><table>
        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Turno</th><th>Estado</th></tr></thead>
        <tbody>{analizadas.map((f,i)=>(
          <tr key={i}>
            <td>{f.nombre||"—"}</td><td className="mono">{f.email||"—"}</td><td>{f.rol||f.rolTexto||"—"}</td>
            <td>{f.turno||"—"}</td>
            <td><Pill kind={ESTADO_PILL[f.estado]}>{ESTADO_LABEL[f.estado]}</Pill>{f.motivo&&<div className="mini" style={{color:"var(--text-dim)"}}>{f.motivo}</div>}</td>
          </tr>))}
        </tbody>
      </table></div>
    </div>}

    {fase==="creando" && <div style={{padding:36,textAlign:"center"}}>
      <div style={{fontSize:26}}>⏳</div>
      <p style={{marginTop:8}}>Creando usuarios… {progreso} de {aCrear.length}</p>
    </div>}

    {fase==="reporte" && <div>
      <div className={"alert "+(reporte.some(r=>r.estado==="Error")?"alert-info":"alert-ok")} style={{marginBottom:10}}>{reporte.filter(r=>r.estado==="Creado").length} de {reporte.length} usuario(s) creados correctamente.</div>
      <small className="muted" style={{display:"block",marginBottom:8}}>Descarga el reporte para obtener las contraseñas temporales y compártelas de forma segura con cada persona — no quedan visibles después de cerrar esta ventana.</small>
      <div className="tbl-wrap scroll-y" style={{maxHeight:360}}><table>
        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Turno</th><th>Contraseña temporal</th><th>Estado</th></tr></thead>
        <tbody>{reporte.map((r,i)=>(
          <tr key={i}>
            <td>{r.nombre}</td><td className="mono">{r.email}</td><td>{r.rol}</td>
            <td>{r.turno||"—"}</td>
            <td className="mono">{r.estado==="Creado"?r.password:"—"}</td>
            <td><Pill kind={r.estado==="Creado"?"p-success":"p-danger"}>{r.estado}</Pill>{r.motivo&&<div className="mini">{r.motivo}</div>}</td>
          </tr>))}
        </tbody>
      </table></div>
    </div>}
  </Modal>);
}
