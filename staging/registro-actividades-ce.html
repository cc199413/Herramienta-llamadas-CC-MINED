      cerrando=true;
      if(supabase) await supabase.auth.signOut();
      registrarAccion(session.id,"logout_forzado",`${session.nombre}: ${motivo}`);
      setSessionExpiredMsg(motivo);
      setSession(null);
    };
    const intervalo=setInterval(()=>{
      if(cerrando) return;
      const ahoraMs=Date.now();
      const limiteMin=sesionTimeouts[session.rol];
      const minutosInactivo=(ahoraMs-ultimaActividadRef.current)/60000;
      if(limiteMin && minutosInactivo>=limiteMin){
        forzarLogout(`Tu sesión se cerró automáticamente después de ${limiteMin} minutos sin actividad.`);
        return;
      }
      if(session.rol==="Agente" && (session.turno==="AM"||session.turno==="PM")){
        const finTurno=new Date(); finTurno.setHours(session.turno==="AM"?14:22,0,0,0);
        if(ahoraMs>=finTurno.getTime()+10*60000){
          forzarLogout("Tu sesión se cerró automáticamente: han pasado 10 minutos desde el fin de tu turno.");
        }
      } else if(session.rol==="Agente" && session.turno==="Apoyo"){
        const corte=new Date(); corte.setHours(23,15,0,0);
        if(ahoraMs>=corte.getTime()){
          forzarLogout("Tu sesión se cerró automáticamente: cierre diario del turno «Apoyo» (11:15 p.m.).");
        }
      }
    },30000);
    return ()=>clearInterval(intervalo);
  },[session,sesionTimeouts]);

  // mantiene _sesionActualParaAlertas sincronizado para que avisarErrorGuardado() sepa quién tuvo el error
  useEffect(()=>{ _sesionActualParaAlertas=session; },[session]);

  // alertas de errores en tiempo real (Realtime), solo para roles con supervisión (Team leader/Supervisor/Administrador)
  // + un sondeo cada 5 min como respaldo, por si la conexión de Realtime se cae momentáneamente.
  // Antes, CADA evento de Realtime volvía a traer la tabla "alertas_errores" completa — con varios
  // supervisores conectados, una ráfaga de alertas (ej. una falla masiva) multiplicaba esa recarga
  // completa una vez por cada alerta × cada supervisor conectado. Ahora se aplica cada cambio
  // puntual directo al estado local (agregar/actualizar/quitar esa fila), agrupando ráfagas cercanas
  // en una sola actualización — sin volver a pedir la tabla completa por cada evento.
  useEffect(()=>{
    if(!session || !CAN[session.rol].alertas || !supabase) return;
    let cancelado=false;
    const cargar=async()=>{
      const filas=await fetchAlertasErrores();
      if(!cancelado) setAlertas(filas);
    };
    cargar();
    const id=setInterval(cargar,900000); // 15 min — respaldo por si Realtime se cae; ya no es la vía principal de refresco
    const aplicarCola=()=>{
      const cambios=colaCambiosAlertasRef.current; colaCambiosAlertasRef.current=[]; flushCambiosAlertasRef.current=null;
      setAlertas(prev=>{
        let out=prev;
        cambios.forEach(({eventType,new:nuevo,old:viejo})=>{
          if(eventType==="DELETE"){ out=out.filter(a=>a.id!==(viejo&&viejo.id)); return; }
          const fila={id:nuevo.id, usuarioId:nuevo.usuario_id, usuarioNombre:nuevo.usuario_nombre, usuarioRol:nuevo.usuario_rol,
            mensaje:nuevo.mensaje, detalle:nuevo.detalle, revisado:!!nuevo.revisado, revisadoPor:nuevo.revisado_por||null,
            revisadoEn:nuevo.revisado_en?new Date(nuevo.revisado_en).getTime():null,
            creadoEn:nuevo.creado_en?new Date(nuevo.creado_en).getTime():Date.now()};
          out = out.some(a=>a.id===fila.id) ? out.map(a=>a.id===fila.id?fila:a) : [fila,...out];
        });
        return out;
      });
    };
    let canal=null;
    if(supabase.channel){
      canal=supabase.channel("alertas_errores_watch_"+session.id)
        .on("postgres_changes",{event:"*",schema:"public",table:"alertas_errores"},payload=>{
          colaCambiosAlertasRef.current.push(payload);
          if(!flushCambiosAlertasRef.current) flushCambiosAlertasRef.current=setTimeout(aplicarCola,250);
        })
        .subscribe();
    }
    return ()=>{cancelado=true;clearInterval(id); if(canal) supabase.removeChannel(canal); if(flushCambiosAlertasRef.current) clearTimeout(flushCambiosAlertasRef.current);};
  },[session&&session.id,session&&session.rol]);

  // mantiene campañas/registros sincronizados mientras la sesión sigue abierta. Es indispensable para
  // Agentes: la Bandeja solo les muestra los centros donde ELLOS son el dueño actual (registros.agente_id).
  // Si alguien más los reasigna a otro agente mientras la sesión sigue abierta, sin este refresco la
  // pantalla seguiría mostrando el centro como "suyo" y, al intentar registrar la llamada, la base de
  // datos rechazaría el guardado (correctamente) porque ya no le pertenece — pareciendo un error, cuando
  // en realidad solo hacía falta refrescar. Con esto, su Bandeja se corrige sola en segundos.
  //
  // V1.35: cada evento de Realtime en "registros" aplica solo la fila puntual que cambió (en vez de
  // volver a traer campanas + campana_agentes + registros COMPLETOS, que fue la causa más probable
  // del pico de egress del 17-ago-2026).
  //
  // V1.36 (mentalidad austera — sin presupuesto para subir de plan, hay que ser eficientes con lo que
  // hay): antes, "campanas" y "campana_agentes" NO tenían Realtime — cualquier campaña nueva, cambio de
  // título/pausa, o agente agregado/quitado de una campaña solo se enteraba vía el sondeo de respaldo
  // completo. Ahora esas dos tablas TAMBIÉN se sincronizan por Realtime con el mismo patrón de fusión
  // puntual, así que el sondeo de respaldo deja de ser la vía principal para prácticamente nada, y baja
  // de cada 3 min a cada 15 min — reduciendo su costo de egress en el estado estable a una fracción,
  // sin que se note ninguna diferencia de frescura de datos para el usuario.
  useEffect(()=>{
    if(!session || !supabase) return;
    let cancelado=false;
    const refrescar=async()=>{
      const {campaigns:camps,records:regs}=await fetchCampaignsAndRecords();
      if(cancelado) return;
      setCampaigns(camps);
      setRecords(regs);
    };
    // NO se llama refrescar() de inmediato aquí: cargarDatosDeSesion() ya trae campanas/registros al
    // iniciar sesión (una sola vez). Llamarlo también aquí duplicaba la descarga completa de "registros"
    // en cada login — confirmado en logs reales de Supabase el 21-ago-2026 (las mismas 4 páginas de
    // registros pedidas dos veces, con menos de un segundo de diferencia). Este efecto solo necesita el
    // sondeo de respaldo periódico + la suscripción de Realtime, no una carga propia al montar.
    const id=setInterval(refrescar,900000); // 15 min — respaldo por si Realtime se cae; ya no es la vía principal de refresco

    const aplicarColaRegistros=()=>{
      const cambios=colaCambiosRegistrosRef.current; colaCambiosRegistrosRef.current=[]; flushCambiosRegistrosRef.current=null;
      const porCampana={}; // campana_id -> {codigo: agente_id|null} — para actualizar assign/schoolCodes en un solo paso
      const eliminados=new Set();
      const nuevosOActualizados=[];
      cambios.forEach(({eventType,new:nuevo,old:viejo})=>{
        if(eventType==="DELETE"){ if(viejo&&viejo.id) eliminados.add(viejo.id); return; }
        const rec=dbRegistroToRecord(nuevo);
        nuevosOActualizados.push(rec);
        if(!porCampana[rec.campaignId]) porCampana[rec.campaignId]={};
        porCampana[rec.campaignId][rec.codigo]=rec.agentId||null;
      });
      if(nuevosOActualizados.length||eliminados.size){
        setRecords(prev=>{
          let out=eliminados.size?prev.filter(r=>!eliminados.has(r.id)):prev;
          nuevosOActualizados.forEach(rec=>{
            out = out.some(r=>r.id===rec.id) ? out.map(r=>r.id===rec.id?rec:r) : [...out,rec];
          });
          return out;
        });
      }
      if(Object.keys(porCampana).length){
        setCampaigns(prevCamps=>prevCamps.map(c=>{
          const cambiosCamp=porCampana[c.id];
          if(!cambiosCamp) return c;
          const assign={...c.assign}; const schoolCodes=[...c.schoolCodes];
          Object.keys(cambiosCamp).forEach(codigo=>{
            if(cambiosCamp[codigo]) assign[codigo]=cambiosCamp[codigo]; else delete assign[codigo];
            if(!schoolCodes.includes(codigo)) schoolCodes.push(codigo);
          });
          return {...c,assign,schoolCodes};
        }));
      }
    };

    // "campanas": campaña nueva, o cambio de título/objetivo/fechas/estado/pausada/etiqueta/preguntas.
    // Para una campaña que ya existe en el estado local, se conservan agentIds/schoolCodes/assign
    // (esos se arman a partir de registros/campana_agentes, no de esta tabla). Para una campaña
    // recién creada que aún no llegó al estado local, se agrega con esos 3 campos vacíos — se llenan
    // solos en segundos, con los eventos de "registros"/"campana_agentes" de su propia creación.
    const aplicarColaCampanas=()=>{
      const cambios=colaCambiosCampanasRef.current; colaCambiosCampanasRef.current=[]; flushCambiosCampanasRef.current=null;
      const eliminados=new Set(); const nuevosOActualizados=[];
      cambios.forEach(({eventType,new:nuevo,old:viejo})=>{
        if(eventType==="DELETE"){ if(viejo&&viejo.id) eliminados.add(viejo.id); return; }
        nuevosOActualizados.push(nuevo);
      });
      if(!nuevosOActualizados.length && !eliminados.size) return;
      setCampaigns(prev=>{
        let out=eliminados.size?prev.filter(c=>!eliminados.has(c.id)):prev;
        nuevosOActualizados.forEach(c=>{
          const existente=out.find(x=>x.id===c.id);
          const base={
            id:c.id, titulo:c.titulo, objetivo:c.objetivo, fechaDesde:c.fecha_desde, fechaHasta:c.fecha_hasta,
            maxIntentos:c.max_intentos, preguntas:c.preguntas||[], estado:c.estado, pausada:!!c.pausada, etiqueta:c.etiqueta||null,
            cierreAutomatico:c.cierre_automatico!==false,
            asignacionInicial:c.asignacion_inicial||{}, borradorEstado:c.borrador_estado||null, creadoPor:c.creado_por||null,
            actualizadoEn:c.actualizado_en?new Date(c.actualizado_en).getTime():null,
            agentIds:existente?existente.agentIds:[], schoolCodes:existente?existente.schoolCodes:[], assign:existente?existente.assign:{},
          };
          out = existente ? out.map(x=>x.id===c.id?base:x) : [...out,base];
        });
        return out;
      });
    };

    // "campana_agentes": solo INSERT/DELETE (es una tabla de relación, sus filas no se actualizan).
    const aplicarColaCampAgentes=()=>{
      const cambios=colaCambiosCampAgentesRef.current; colaCambiosCampAgentesRef.current=[]; flushCambiosCampAgentesRef.current=null;
      if(!cambios.length) return;
      setCampaigns(prev=>prev.map(c=>{
        let agentIds=c.agentIds;
        cambios.forEach(({eventType,new:nuevo,old:viejo})=>{
          if(eventType==="INSERT" && nuevo && nuevo.campana_id===c.id){
            if(!agentIds.includes(nuevo.agente_id)) agentIds=[...agentIds,nuevo.agente_id];
          } else if(eventType==="DELETE" && viejo && viejo.campana_id===c.id){
            agentIds=agentIds.filter(a=>a!==viejo.agente_id);
          }
        });
        return agentIds===c.agentIds ? c : {...c,agentIds};
      }));
    };

    let canal=null;
    if(supabase.channel){
      canal=supabase.channel("sync_watch_"+session.id)
        .on("postgres_changes",{event:"*",schema:"public",table:"registros"},payload=>{
          colaCambiosRegistrosRef.current.push(payload);
          if(!flushCambiosRegistrosRef.current) flushCambiosRegistrosRef.current=setTimeout(aplicarColaRegistros,250);
        })
        .on("postgres_changes",{event:"*",schema:"public",table:"campanas"},payload=>{
          colaCambiosCampanasRef.current.push(payload);
          if(!flushCambiosCampanasRef.current) flushCambiosCampanasRef.current=setTimeout(aplicarColaCampanas,250);
        })
        .on("postgres_changes",{event:"*",schema:"public",table:"campana_agentes"},payload=>{
          colaCambiosCampAgentesRef.current.push(payload);
          if(!flushCambiosCampAgentesRef.current) flushCambiosCampAgentesRef.current=setTimeout(aplicarColaCampAgentes,250);
        })
        .subscribe();
    }
    return ()=>{
      cancelado=true; clearInterval(id); if(canal) supabase.removeChannel(canal);
      if(flushCambiosRegistrosRef.current) clearTimeout(flushCambiosRegistrosRef.current);
      if(flushCambiosCampanasRef.current) clearTimeout(flushCambiosCampanasRef.current);
      if(flushCambiosCampAgentesRef.current) clearTimeout(flushCambiosCampAgentesRef.current);
    };
  },[session&&session.id]);

  const marcarAlertaRevisada=async id=>{
    setAlertas(p=>p.map(a=>a.id===id?{...a,revisado:true,revisadoPor:session.id,revisadoEn:Date.now()}:a));
    if(supabase) await marcarAlertaRevisadaDB(id,session.id);
  };
  const marcarTodasAlertasRevisadas=async()=>{
    setAlertas(p=>p.map(a=>a.revisado?a:{...a,revisado:true,revisadoPor:session.id,revisadoEn:Date.now()}));
    if(supabase) await marcarTodasAlertasRevisadasDB(session.id);
  };

  // reflejar cambios de la sesión en la lista de usuarios (estatus, skill, etc.) — optimista en memoria + persistido en Supabase
  const patchUser=(id,patch)=>{
    setUsers(p=>p.map(u=>u.id===id?{...u,...patch}:u));
    if(session&&session.id===id) setSession(s=>({...s,...patch}));
    if(supabase) updateProfile(id,patch);
  };
  const bumpDaily=(agentId,date,field,deltaSec)=>{
    bumpDailyLog(setDailyLog,agentId,date,field,deltaSec);
    if(supabase) bumpTiempoDiario(agentId,date,field,deltaSec);
  };
  const toggleAuxiliar=k=>{
    const nuevo={...auxHabilitados,[k]:auxHabilitados[k]===false};
    setAuxHabilitados(nuevo);
    const cambio={porId:session?session.id:null,cuando:Date.now()};
    setAuxUltimoCambio(cambio);
    if(supabase) updateConfiguracion("auxiliares_habilitados",nuevo,session?session.id:null).then(exito=>{
      if(exito&&session) registrarAccion(session.id,"toggle_auxiliar",`${session.nombre} ${nuevo[k]?"habilitó":"deshabilitó"} el auxiliar «${k}»`);
    });
    else if(session) registrarAccion(session.id,"toggle_auxiliar",`${session.nombre} ${nuevo[k]?"habilitó":"deshabilitó"} el auxiliar «${k}»`);
  };
  const actualizarSesionTimeouts=nuevo=>{
    setSesionTimeouts(nuevo);
    if(supabase) updateConfiguracion("sesion_timeouts_min",nuevo,session?session.id:null).then(exito=>{
      if(exito&&session) registrarAccion(session.id,"config_sesion_timeouts",`${session.nombre} actualizó los tiempos de cierre de sesión por inactividad`);
    });
    else if(session) registrarAccion(session.id,"config_sesion_timeouts",`${session.nombre} actualizó los tiempos de cierre de sesión por inactividad`);
  };
  const toggleTurnoApoyo=()=>{
    const nuevo=!turnoApoyoHabilitado;
    setTurnoApoyoHabilitado(nuevo);
    if(supabase) updateConfiguracion("turno_apoyo_habilitado",{activo:nuevo},session?session.id:null).then(exito=>{
      if(exito&&session) registrarAccion(session.id,"toggle_turno_apoyo",`${session.nombre} ${nuevo?"habilitó":"deshabilitó"} el turno «Apoyo»`);
    });
    else if(session) registrarAccion(session.id,"toggle_turno_apoyo",`${session.nombre} ${nuevo?"habilitó":"deshabilitó"} el turno «Apoyo»`);
  };
  const agregarEtiqueta=nueva=>{
    const limpia=(nueva||"").trim();
    if(!limpia || etiquetas.some(e=>e.toLowerCase()===limpia.toLowerCase())) return;
    const nuevas=[...etiquetas,limpia];
    setEtiquetas(nuevas);
    if(supabase) updateConfiguracion("etiquetas_campana",{lista:nuevas},session?session.id:null).then(exito=>{
      if(exito&&session) registrarAccion(session.id,"agregar_etiqueta",`${session.nombre} agregó la etiqueta «${limpia}» para campañas`);
    });
    else if(session) registrarAccion(session.id,"agregar_etiqueta",`${session.nombre} agregó la etiqueta «${limpia}» para campañas`);
  };

  const ctx={theme,setTheme,users,setUsers,patchUser,schools,setSchools,campaigns,setCampaigns,records,setRecords,session,setSession,view,setView,filtro,setFiltro,pausa,setPausa,notify,dailyLog,setDailyLog,bumpDaily,limites,setLimites,auxHabilitados,setAuxHabilitados,auxUltimoCambio,toggleAuxiliar,recoveryUserId,setRecoveryUserId,cargarDatosDeSesion,cargandoDatos,sesionTimeouts,actualizarSesionTimeouts,turnoApoyoHabilitado,toggleTurnoApoyo,sessionExpiredMsg,setSessionExpiredMsg,alertas,marcarAlertaRevisada,marcarTodasAlertasRevisadas,etiquetas,agregarEtiqueta};
  const contenido = cargandoSesion
    ? <div className="login-wrap-glow"><div className="login-glow-card" style={{textAlign:"center"}}><div className="crest-mini"><img className="mark" src={LOGO_GOES_DATAURI} alt="Gobierno de El Salvador"/></div><p className="sub">Cargando…</p></div></div>
    : recoveryUserId ? <CambiarPassword ctx={ctx} modo="recuperacion"/>
    : !session ? <Login ctx={ctx}/>
    : session.debeCambiarPassword ? <CambiarPassword ctx={ctx} modo="primerIngreso"/>
    : <Shell ctx={ctx} toast={toast}/>;
  return <><StagingBanner/>{contenido}</>;
};

/* ============================ LOGIN ============================ */
function Login({ctx}){
  const {setSession,setView,cargarDatosDeSesion,notify,sessionExpiredMsg,setSessionExpiredMsg}=ctx;
  const [mode,setMode]=useState("login"); // login | reg | olvide
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [msg,setMsg]=useState(()=>sessionExpiredMsg?{k:"info",t:sessionExpiredMsg}:null);
  useEffect(()=>{ if(sessionExpiredMsg) setSessionExpiredMsg(null); },[]); // se muestra una sola vez
  const [loading,setLoading]=useState(false);
  const [rn,setRn]=useState(""),[re,setRe]=useState(""),[rp,setRp]=useState(""),[rr,setRr]=useState("Agente");
  const [fpEmail,setFpEmail]=useState("");
  const firstView=u=>(CAN[u.rol].bandeja&&u.skill!=="SDP")?"bandeja":(CAN[u.rol].campanas?"campanas":(CAN[u.rol].consulta?"consulta":"agendaDirectores"));

  const login=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    setMsg(null);setLoading(true);
    const {data,error}=await supabase.auth.signInWithPassword({email:email.trim(),password:pass});
    if(error){ setLoading(false); return setMsg({k:"err",t:mapAuthError(error)}); }
    const {data:perfil,error:perr}=await supabase.from("profiles").select("*").eq("id",data.user.id).single();
    if(perr||!perfil){ setLoading(false); await supabase.auth.signOut(); return setMsg({k:"err",t:"No se encontró tu perfil. Contacta al Administrador."}); }
    if(perfil.estado==="pendiente"){ setLoading(false); await supabase.auth.signOut(); return setMsg({k:"info",t:"Tu cuenta está pendiente de aprobación por un Administrador o Supervisor."}); }
    if(perfil.estado==="inactivo"){ setLoading(false); await supabase.auth.signOut(); return setMsg({k:"err",t:"Tu cuenta fue dada de baja. Contacta al Administrador."}); }
    const u={...dbProfileToUser(perfil),email:data.user.email,loginSince:Date.now()};
    const ms=Date.now(),hoy=dayKey();
    registrarAccion(u.id,"login",`${u.nombre} (${u.rol}) inició sesión`); // no bloqueante
    updateProfile(u.id,{loginSince:u.loginSince}); // no bloqueante
    registrarPrimerLoginDB(u.id,hoy,ms); // no bloqueante
    setLoading(false);
    console.log(`[LOGIN] ${u.nombre} (${u.rol}) · ${hoy} ${new Date(ms).toLocaleTimeString("es-SV")} — primer login del día registrado si no existía uno previo.`);
    setSession(u);setView(firstView(u));
    cargarDatosDeSesion(u); // no bloqueante: se entra a la app de inmediato y cada módulo llena sus datos en segundo plano
  };

  const register=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    if(!rn||!re||!rp)return setMsg({k:"err",t:"Completa todos los campos."});
    if(!passwordValida(rp))return setMsg({k:"err",t:"La contraseña no cumple los requisitos mínimos (ver la lista debajo del campo)."});
    setLoading(true);
    const {data,error}=await supabase.auth.signUp({email:re.trim(),password:rp,options:{data:{nombre:rn,rol:rr}}});
    setLoading(false);
    if(error) return setMsg({k:"err",t:mapAuthError(error)});
    if(data&&data.user) registrarAccion(data.user.id,"solicitar_acceso",`${rn} solicitó acceso como ${rr}`);
    setMsg({k:"ok",t:"Solicitud enviada. Un Administrador o Supervisor debe aprobar tu acceso."});setMode("login");setEmail(re.trim());setPass("");
  };

  const olvide=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    if(!fpEmail)return setMsg({k:"err",t:"Escribe tu correo institucional."});
    setLoading(true);
    const {data:verif,error:errVerif}=await supabase.functions.invoke("verificar-correo",{body:{email:fpEmail.trim()}});
    if(errVerif){ setLoading(false); return setMsg({k:"err",t:"No se pudo verificar el correo. Intenta de nuevo."}); }
    if(!verif||!verif.existe){ setLoading(false); return setMsg({k:"err",t:"El correo electrónico indicado no está vinculado a ningún usuario"}); }
    const {error}=await supabase.auth.resetPasswordForEmail(fpEmail.trim(),{redirectTo:window.location.href.split("#")[0].split("?")[0]});
    setLoading(false);
    if(error) return setMsg({k:"err",t:mapAuthError(error)});
    setMsg({k:"ok",t:"Te enviamos un enlace a tu correo para crear una nueva contraseña. Revisa tu bandeja de entrada (y spam)."});
  };

  return (<div className="login-wrap-glow">
    <div className="login-glow-card">
      <div className="crest-mini">
        <img className="mark" src={LOGO_GOES_DATAURI} alt="Gobierno de El Salvador"/>
        <small>ATENCIÓN AL USUARIO MINED · EL SALVADOR</small>
      </div>
      <h1>Plataforma para gestión de llamadas</h1>
      {mode==="login"&&<>
        <h2>Iniciar sesión</h2><p className="sub">Ingresa con tu correo institucional.</p>
        {msg&&<div className={"alert alert-"+(msg.k==="err"?"err":msg.k==="ok"?"ok":"info")}>{msg.t}</div>}
        <div className="field"><label>Correo</label><input className="input" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="usuario@edu.gob.sv"/></div>
        <div className="field"><label>Contraseña</label><PasswordInput value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="••••••"/></div>

/* ---- pantalla de cambio de contraseña (primer ingreso obligatorio, o tras "recuperar contraseña") ---- */
function CambiarPassword({ctx,modo}){
  const {session,setSession,recoveryUserId,setRecoveryUserId,notify}=ctx;
  const [p1,setP1]=useState("");
  const [p2,setP2]=useState("");
  const [msg,setMsg]=useState(null);
  const [loading,setLoading]=useState(false);

  const guardar=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    if(!passwordValida(p1)) return setMsg({k:"err",t:"La contraseña no cumple los requisitos mínimos."});
    if(p1!==p2) return setMsg({k:"err",t:"Las dos contraseñas no coinciden."});
    setLoading(true);
    const {data,error}=await supabase.auth.updateUser({password:p1});
    if(!error && data && data.user){
      await supabase.from("profiles").update({debe_cambiar_password:false}).eq("id",data.user.id);
    }
    setLoading(false);
    if(error) return setMsg({k:"err",t:mapAuthError(error)});
    notify("Contraseña actualizada correctamente.");
    if(modo==="recuperacion"){ registrarAccion(data.user.id,"recuperar_password","Contraseña restablecida vía enlace de recuperación"); setRecoveryUserId(null); await supabase.auth.signOut(); }
    else { registrarAccion(session.id,"cambiar_password","Contraseña cambiada en el primer ingreso"); setSession(s=>({...s,debeCambiarPassword:false})); }
  };

  return (<div className="login-wrap-glow">
    <div className="login-glow-card">
      <div className="crest-mini">
        <img className="mark" src={LOGO_GOES_DATAURI} alt="Gobierno de El Salvador"/>
        <small>ATENCIÓN AL USUARIO MINED · EL SALVADOR</small>
      </div>
      <h1>{modo==="primerIngreso"?"Configura tu nueva contraseña":"Restablece tu contraseña"}</h1>
      <p className="sub" style={{textAlign:"center",marginTop:-10}}>{modo==="primerIngreso"?"Por seguridad, debes cambiar tu contraseña antes de continuar.":"Elige una nueva contraseña para tu cuenta."}</p>
      {msg&&<div className={"alert alert-"+(msg.k==="err"?"err":"ok")}>{msg.t}</div>}
      <div className="field"><label>Nueva contraseña</label><PasswordInput value={p1} onChange={e=>setP1(e.target.value)}/>
        <PasswordChecklist value={p1}/>
      </div>
      <div className="field"><label>Confirmar nueva contraseña</label><PasswordInput value={p2} onChange={e=>setP2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&guardar()}/></div>
      <button className="btn btn-primary" disabled={loading} onClick={guardar}>{loading?"Guardando…":"Guardar contraseña"}</button>
      {modo==="recuperacion" && <p className="hint"><span className="link" onClick={async()=>{setRecoveryUserId(null);await supabase.auth.signOut();}}>Cancelar y volver a iniciar sesión</span></p>}
      <div className="foot-mini">Acceso restringido a personal autorizado · 2026 <span className="ver mono">V{APP_VERSION}</span></div>
    </div>
  </div>);
}

/* ---- modal de cambio de contraseña voluntario (usuario ya con sesión iniciada) ---- */
function CambiarPasswordModal({ctx,onClose}){
  const {session,notify}=ctx;
  const [actual,setActual]=useState("");
  const [p1,setP1]=useState("");
  const [p2,setP2]=useState("");
  const [msg,setMsg]=useState(null);
  const [loading,setLoading]=useState(false);

  const guardar=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    if(!actual) return setMsg({k:"err",t:"Escribe tu contraseña actual."});
    if(!passwordValida(p1)) return setMsg({k:"err",t:"La nueva contraseña no cumple los requisitos mínimos."});
    if(p1!==p2) return setMsg({k:"err",t:"Las dos contraseñas nuevas no coinciden."});
    setLoading(true);
    // confirmamos la contraseña actual re-autenticando antes de cambiarla
    const {error:errActual}=await supabase.auth.signInWithPassword({email:session.email,password:actual});
    if(errActual){ setLoading(false); return setMsg({k:"err",t:"La contraseña actual no es correcta."}); }
    const {error}=await supabase.auth.updateUser({password:p1});
    setLoading(false);
    if(error) return setMsg({k:"err",t:mapAuthError(error)});
    notify("Contraseña actualizada correctamente.");
    registrarAccion(session.id,"cambiar_password","Contraseña cambiada voluntariamente");
    onClose();
  };

  return (<Modal title="Cambiar contraseña" onClose={onClose} foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-accent" disabled={loading} onClick={guardar}>{loading?"Guardando…":"Guardar"}</button></>}>
    {msg&&<div className={"alert alert-"+(msg.k==="err"?"err":"ok")} style={{marginTop:0}}>{msg.t}</div>}
    <div className="field"><label>Contraseña actual</label><PasswordInput value={actual} onChange={e=>setActual(e.target.value)}/></div>
    <div className="field"><label>Nueva contraseña</label><PasswordInput value={p1} onChange={e=>setP1(e.target.value)}/>
      <PasswordChecklist value={p1}/>
    </div>
    <div className="field" style={{marginBottom:0}}><label>Confirmar nueva contraseña</label><PasswordInput value={p2} onChange={e=>setP2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&guardar()}/></div>
  </Modal>);
}

/* selector de semana */
function FiltroFecha({filtro,setFiltro}){
  const [open,setOpen]=useState(false);
  const modo=filtro.desde===filtro.hasta?"dia":"periodo";
  const setModo=m=>{ if(m==="dia") setFiltro({desde:filtro.desde,hasta:filtro.desde}); else setFiltro({desde:filtro.desde,hasta:addDays(filtro.desde,6)}); };
  return (<div style={{position:"relative"}}>
    <button className="weekpill" onClick={()=>setOpen(o=>!o)} title="Filtro de fecha">📅 {rangeLabel(filtro.desde,filtro.hasta)} <span style={{opacity:.6}}>▾</span></button>
    {open && <>
      <div style={{position:"fixed",inset:0,zIndex:39}} onClick={()=>setOpen(false)}/>
      <div className="card card-pad" style={{position:"absolute",top:"110%",right:0,zIndex:40,width:270,boxShadow:"var(--shadow-lg)"}}>
        <div className="seg" style={{marginBottom:10,width:"100%"}}>
          <button className={modo==="dia"?"on":""} style={{flex:1}} onClick={()=>setModo("dia")}>Un día</button>
          <button className={modo==="periodo"?"on":""} style={{flex:1}} onClick={()=>setModo("periodo")}>Período</button>
        </div>
        {modo==="dia" ? (
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setFiltro({desde:addDays(filtro.desde,-1),hasta:addDays(filtro.desde,-1)})}>‹</button>
            <input className="input" type="date" value={filtro.desde} onChange={e=>setFiltro({desde:e.target.value,hasta:e.target.value})}/>
            <button className="btn btn-ghost btn-sm" onClick={()=>setFiltro({desde:addDays(filtro.desde,1),hasta:addDays(filtro.desde,1)})}>›</button>
          </div>
        ) : (<>
          <div className="field" style={{margin:"0 0 8px"}}><label>Desde</label><input className="input" type="date" value={filtro.desde} max={filtro.hasta} onChange={e=>setFiltro(f=>({...f,desde:e.target.value}))}/></div>
          <div className="field" style={{margin:0}}><label>Hasta</label><input className="input" type="date" value={filtro.hasta} min={filtro.desde} onChange={e=>setFiltro(f=>({...f,hasta:e.target.value}))}/></div>
        </>)}
        <button className="btn btn-primary btn-sm" style={{marginTop:10,width:"100%"}} onClick={()=>setOpen(false)}>Aplicar</button>
      </div>
    </>}
  </div>);
}

/* control de estatus operativo del agente (Activo/Baño/Break/Comida) */
function AgentStatusControl({ctx}){
  const {session,patchUser,bumpDaily,dailyLog,limites,auxHabilitados,notify}=ctx;
  const cur=session.opStatus||"Activo";
  const now=useNow(cur!=="Activo");
  const elapsed=cur!=="Activo"?Math.max(0,liveTotal(dailyLog,session,STATUS_FIELD[cur],now)):0;
  const limite=limites[cur]; // segundos, undefined para "Activo"
  const nivel=cur!=="Activo"?nivelTiempo(elapsed,limite):null;
  const set=k=>{
    const s=session,t=Date.now(),old=s.opStatus||"Activo";
    if(old!=="Activo" && s.statusSince && STATUS_FIELD[old]) bumpDaily(s.id,dayKey(),STATUS_FIELD[old],(t-s.statusSince)/1000);
    patchUser(s.id,{opStatus:k,statusSince:k!=="Activo"?t:null});notify("Estatus: "+k);
  };
  const opciones=OP_STATUSES.filter(s=>s.k==="Activo"||auxHabilitados[s.k]!==false);
  return (<div className="seg" title="Tu estatus operativo">
    {opciones.map(s=><button key={s.k} className={cur===s.k?"on":""} onClick={()=>set(s.k)}>{s.k}</button>)}
    {cur!=="Activo"&&<span className={"pill "+opPill(cur)} style={{marginLeft:4}}><i/><span style={estiloNivel(nivel)}>{fmtLong(elapsed)}</span>{limite?" / "+fmtLong(limite):""}</span>}
  </div>);
}

function Shell({ctx,toast}){
  const {session,view,setView,theme,setTheme,setSession,patchUser,filtro,setFiltro,pausa,setPausa,bumpDaily,campaigns,records,users,alertas}=ctx;
  const can=CAN[session.rol];
  const [cambiarPass,setCambiarPass]=useState(false);
  const [menuOpen,setMenuOpen]=useState(false);
  const [saludAlerta,setSaludAlerta]=useState(false);
  useEffect(()=>{
    if(!can.salud||!supabase) return;
    let cancelado=false;
    const revisar=async()=>{
      const s=await medirSaludSistema();
      if(cancelado) return;
      const syncVieja=s.ultimaSincronizacionCentros && (Date.now()-s.ultimaSincronizacionCentros)>48*3600*1000;
      setSaludAlerta(!s.conexionOk || syncVieja);
    };
    revisar();
    const id=setInterval(revisar,60000);
    return ()=>{cancelado=true;clearInterval(id);};
  },[can.salud]);
  const logout=async()=>{
    const t=Date.now();const today=dayKey();
    if(session.loginSince) bumpDaily(session.id,today,"loginSec",(t-session.loginSince)/1000);
    const cur=session.opStatus||"Activo";
    if(cur!=="Activo" && session.statusSince && STATUS_FIELD[cur]) bumpDaily(session.id,today,STATUS_FIELD[cur],(t-session.statusSince)/1000);
    if(supabase) await registrarUltimoLogoutDB(session.id,today,t);
    if(supabase) registrarAccion(session.id,"logout",`${session.nombre} (${session.rol}) cerró sesión`);
    console.log(`[LOGOUT] ${session.nombre} (${session.rol}) · ${today} ${new Date(t).toLocaleTimeString("es-SV")} — último logout del día registrado.`);
    patchUser(session.id,{loginSince:null,opStatus:"Activo",statusSince:null});
    if(supabase) await supabase.auth.signOut();
    setSession(null);
  };
  const esSDP=session.skill==="SDP";

    if(!can.bandeja||esSDP) return 0;
    const isAgent=session.rol==="Agente";

    let total=0;
    misCamp.forEach(c=>{
      const asg=getAssign(c);
      const codigos=c.schoolCodes.filter(code=>isAgent?asg[code]===session.id:true);
      codigos.forEach(code=>{
        const r=records.find(x=>x.campaignId===c.id&&x.codigo===code);
        if(!r||r.estado==="Pendiente") total++;
      });
    });
    return total;
  })();
  const nav=[
    {k:"bandeja",ic:"📞",t:"Bandeja de llamadas",show:can.bandeja&&!esSDP,count:pendientesBandeja},
    {k:"campanas",ic:"🎯",t:"Campañas",show:can.campanas,count:campaigns.filter(c=>c.estado==="En curso").length},
    {k:"borradores",ic:"📝",t:"Borradores",show:can.borradores,count:campaigns.filter(c=>c.estado==="Borrador").length},
    {k:"consulta",ic:"🔎",t:"Consulta y edición",show:can.consulta},
    {k:"equipo",ic:"🧑‍💼",t:"Equipo de agentes",show:can.equipo},
    {k:"dashboard",ic:"📊",t:"Dashboard de avance",show:can.dashboard},
    {k:"agendaDirectores",ic:"🗓️",t:"Agenda semanal directores",show:can.agendaDirectores},
    {k:"alertas",ic:"🚨",t:"Alertas",show:can.alertas,count:alertas.filter(a=>!a.revisado).length,alerta:alertas.some(a=>!a.revisado)},
    {k:"admin",ic:"🛡️",t:"Administración",show:can.admin,count:users.filter(u=>u.estado==="pendiente").length},
    {k:"logs",ic:"📜",t:"Logs de usuarios",show:can.logs},
    {k:"salud",ic:"💚",t:"Salud del sistema",show:can.salud,alerta:saludAlerta},
  ].filter(x=>x.show);
  useEffect(()=>{ if(nav.length && !nav.some(n=>n.k===view)) setView(nav[0].k); },[view,session.rol,esSDP]);
  const titles={bandeja:"Bandeja de llamadas",campanas:"Campañas",borradores:"Borradores de campaña",consulta:"Consulta y edición (inbound)",equipo:"Equipo de agentes",dashboard:"Dashboard de avance",agendaDirectores:"Agenda semanal directores",alertas:"Alertas",admin:"Administración de usuarios",logs:"Logs de usuarios",salud:"Salud del sistema"};
  const withWeek=["bandeja","campanas","consulta","dashboard"].includes(view);
  const initials=session.nombre.split(" ").map(x=>x[0]).slice(0,2).join("");
  return (<div className="shell">
    <div className="mobile-topbar">
      <button className="hamburger" onClick={()=>setMenuOpen(true)} aria-label="Abrir menú">☰</button>
      <b>Gestión de Llamadas</b>
    </div>
    <div className={"sidebar-backdrop"+(menuOpen?" open":"")} onClick={()=>setMenuOpen(false)}/>
    <aside className={"sidebar"+(menuOpen?" open":"")}>
      <div className="brand"><img className="mark" src={LOGO_GOES_DATAURI} alt="Gobierno de El Salvador"/><div><b>Gestión de Llamadas</b><span>MINED · Centro de Monitoreo</span></div></div>
      <div className="nav-label">Módulos</div>
      {nav.map(n=><button key={n.k} className={"nav-item"+(view===n.k?" active":"")} onClick={()=>{setView(n.k);setMenuOpen(false);}}><span className="ico">{n.ic}</span>{n.t}{n.count!=null && <span style={{marginLeft:4}}>({n.count})</span>}{n.alerta && <span className="alerta-dot" title="Se detectó una irregularidad"/>}</button>)}
      <div className="spacer"/>
      <div className="me"><div className="avatar">{initials}</div><div className="grow"><b>{session.nombre}</b><span>{session.rol}</span></div></div>
      <button className="nav-item" style={{marginTop:8}} onClick={()=>{setCambiarPass(true);setMenuOpen(false);}}><span className="ico">🔑</span>Cambiar contraseña</button>

/* ============================ BANDEJA DEL AGENTE ============================ */
function Bandeja({ctx}){
  const {session,schools,campaigns,records,filtro,pausa,cargandoDatos}=ctx;
  const isAgent=session.rol==="Agente";
  // campañas en curso cuyo rango de fechas se solapa con el filtro, donde el agente participa
  const misCamp=campaigns.filter(c=>overlaps(c.fechaDesde,c.fechaHasta,filtro.desde,filtro.hasta) && c.estado==="En curso" && (!isAgent || Object.values(getAssign(c)).includes(session.id)));
  const [campId,setCampId]=useState(null);
  useEffect(()=>{ if(!misCamp.some(c=>c.id===campId)) setCampId(misCamp[0]?.id||null); },[filtro.desde,filtro.hasta,campaigns.length]);
  const camp=misCamp.find(c=>c.id===campId)||misCamp[0];
  const [active,setActive]=useState(null);

  const gate=puedeLlamar(session,pausa,camp);

  if(misCamp.length===0 && cargandoDatos) return <div className="card card-pad"><div className="empty"><div className="big">⏳</div>Cargando tus centros asignados…</div></div>;
  if(misCamp.length===0) return <div className="card card-pad"><div className="empty"><div className="big">📭</div>No tienes centros asignados para {rangeLabel(filtro.desde,filtro.hasta)}.<br/>Cuando un supervisor cree y te asigne una campaña, aparecerán aquí.</div></div>;

  const assign=getAssign(camp);
  const myCodes=camp.schoolCodes.filter(code=> isAgent ? assign[code]===session.id : true);
  const recFor=code=>records.find(r=>r.campaignId===camp.id && r.codigo===code);
  // Si el código no está en el catálogo oficial (centros_escolares) pero el registro trae su propia
  // información (nombre, departamento, etc. — ver migracion_centros_propios_de_campana.sql), se arma
  // un "centro virtual" con esos datos, solo para poder mostrarlo aquí — no se guarda en el catálogo.
  // Y si el código SÍ está en el catálogo pero el archivo de la campaña trajo su propio teléfono/dato,
  // ese dato de la campaña tiene prioridad — no se pisa con lo que haya guardado en el catálogo.
  const rows=myCodes.map(code=>{
    const r=recFor(code);
    let s=schools.find(x=>x.codigo===code);
    if(s && r && r.infoExtra){
      const ov={};
      if(r.infoExtra.telefonos && r.infoExtra.telefonos.length && r.infoExtra.telefonos[0]) ov.telefonos=r.infoExtra.telefonos;
      if(r.infoExtra.nombre) ov.nombre=r.infoExtra.nombre;
      if(r.infoExtra.departamento) ov.departamento=r.infoExtra.departamento;
      if(r.infoExtra.municipio) ov.municipio=r.infoExtra.municipio;
      if(r.infoExtra.distrito) ov.distrito=r.infoExtra.distrito;
      if(Object.keys(ov).length) s={...s,...ov};
    }
    if(!s && r && r.infoExtra && r.infoExtra.nombre){
      s={codigo:code,nombre:r.infoExtra.nombre,departamento:r.infoExtra.departamento||"",municipio:r.infoExtra.municipio||"",
        distrito:r.infoExtra.distrito||"",telefonos:(r.infoExtra.telefonos&&r.infoExtra.telefonos.length)?r.infoExtra.telefonos:[""],
        programa:null,modernizacion:false,fase:null,control:false};
    }
    return {s,r,estado:r?r.estado:"Pendiente"};
  }).filter(x=>x.s);
  // "cierre manual" (camp.cierreAutomatico===false): marcar "Contactado" ya NO saca por sí solo al
  // centro de la Bandeja — solo estaCerrado(r) (que se fija con la acción explícita "Guardar y cerrar
  // centro" en CallPanel) lo hace. Campañas normales (cierreAutomatico true, el default) siguen exactamente
  // igual que siempre: "Contactado" cierra de inmediato, sin tocar nada más.
  const cierreManual=camp.cierreAutomatico===false;
  const enBandeja=rows.filter(x=> !estaCerrado(x.r) && (cierreManual || x.estado!=="Contactado"));
  const cerradas=rows.filter(x=> estaCerrado(x.r) || (!cierreManual && x.estado==="Contactado"));
  // Campañas con "Hora de inicio" por centro (ej. esta especial) se ordenan SOLO por esa hora,
  // ascendente — el criterio normal (Pendiente→Llamar nuevamente→No contestó, antigüedad, intentos)
  // no aplica aquí porque lo que importa es llamar en el orden en que arrancan los eventos, no el
  // estado de contacto previo.
  const tieneHoraInicio=enBandeja.some(x=>x.r&&x.r.horaInicio);
  const RANGO_PRIORIDAD_BANDEJA={"Pendiente":0,"Llamar nuevamente":1,"No contestó":2}; // resto (ej. Número equivocado) va después
  const maxIntentosOrden=camp.maxIntentos||DEFAULT_MAX_INTENTOS;
  if(tieneHoraInicio){
    enBandeja.sort((a,b)=>{
      const ha=(a.r&&a.r.horaInicio)||"99:99", hb=(b.r&&b.r.horaInicio)||"99:99"; // sin hora definida, al final
      if(ha!==hb) return ha<hb?-1:1;
      const ta=(a.r&&a.r.updatedMs)||0, tb=(b.r&&b.r.updatedMs)||0;
      return ta-tb;
    });
  } else {
    enBandeja.sort((a,b)=>{
      const ra=RANGO_PRIORIDAD_BANDEJA[a.estado]??3, rb=RANGO_PRIORIDAD_BANDEJA[b.estado]??3;
      if(ra!==rb) return ra-rb;
      const ta=(a.r&&a.r.updatedMs)||0, tb=(b.r&&b.r.updatedMs)||0;
      if(ta!==tb) return ta-tb; // del más antiguo al más reciente
      const dispA=maxIntentosOrden-((a.r&&a.r.intentos)||0), dispB=maxIntentosOrden-((b.r&&b.r.intentos)||0);
      return dispB-dispA; // con más intentos disponibles primero
    });
  }
  const maxIntentos=camp.maxIntentos||DEFAULT_MAX_INTENTOS;
  const btnLabel=r=> (!r||r.estado==="Pendiente")?"Contactar":(["No contestó","Número equivocado","Llamar nuevamente"].includes(r.estado)?"Reintentar":"Continuar");

  return (<div className="grid">
    <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        {misCamp.length>1
          ? <select className="input" style={{width:"auto",fontWeight:600}} value={camp.id} onChange={e=>setCampId(e.target.value)}>{misCamp.map(c=><option key={c.id} value={c.id}>{c.titulo}</option>)}</select>
          : <Pill kind="p-accent">{camp.titulo}</Pill>}
        <span className="tag">{myCodes.length} asignados</span>
        <span className="tag">{cerradas.filter(x=>x.estado==="Contactado").length} contactados</span>
        <span className="tag">{enBandeja.length} en bandeja</span>
      </div>
      <p style={{color:"var(--text-dim)",margin:"8px 0 0"}}>{camp.objetivo}</p>
    </div>

    {!gate.ok && <div className="banner banner-warn">🔒 {gate.motivo}</div>}

    <div>
      <div className="section-title">Centros por contactar ({enBandeja.length})</div>
      <div className="tbl-wrap" style={{maxHeight:360}}>
        <table>
          <thead><tr><th>Código</th><th>Centro Educativo</th>{tieneHoraInicio&&<th>Hora</th>}<th>Depto.</th><th>Municipio</th><th>Teléfonos</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            {enBandeja.map(({s,r,estado})=>(
              <tr key={s.codigo}>
                <td className="mono">{s.codigo}</td>
                <td><div style={{fontWeight:600}}>{s.nombre}</div>
                  <div style={{display:"flex",gap:4,marginTop:3}}>{s.programa&&<span className="tag">{s.programa}</span>}{s.control&&<span className="tag">Control</span>}</div></td>
                {tieneHoraInicio&&<td className="mono">{(r&&r.horaInicio)||"—"}</td>}
                <td>{s.departamento}</td><td>{s.municipio}</td>
                <td className="mono" style={{fontSize:12}}>{s.telefonos.join(" · ")}</td>
                <td><Pill kind={statePill(estado)}>{estado}</Pill>
                  {r&&r.wrong&&r.wrong.length>0&&<span className="tag" style={{color:"var(--danger)",marginLeft:4}}>📵 {r.wrong.length}</span>}
                  {r&&r.intentos>0&&estado!=="Pendiente"&&<div className="mini" style={{marginTop:3}}>{r.intentos}/{maxIntentos}</div>}
                </td>
                <td><button className="btn btn-accent btn-sm" disabled={!gate.ok} onClick={()=>setActive({s,r})}>{btnLabel(r)}</button></td>
              </tr>
            ))}
            {enBandeja.length===0 && <tr><td colSpan={tieneHoraInicio?8:7}><div className="empty" style={{padding:26}}>Bandeja al día. No quedan centros por contactar.</div></td></tr>}
          </tbody>
        </table>
      </div>
    </div>

    <div className="card card-pad">
      <div className="section-title" style={{margin:0,marginBottom:10}}>Registro completado ({cerradas.length})</div>
      {cerradas.length===0?<div className="empty" style={{padding:18}}>Aún no hay centros contactados o cerrados.</div>:
      <div className="tbl-wrap"><table>
        <thead><tr><th>Centro</th><th>Estado</th><th>Actividades</th><th></th></tr></thead>
        <tbody>{cerradas.map(({s,r,estado})=>(
          <tr key={s.codigo}><td className="mono">{s.codigo} · {s.nombre.slice(0,26)}</td>
          <td><Pill kind={statePill(estado)}>{estado}</Pill></td>
          <td className="mono">{r&&r.actividades?r.actividades.length:0}</td>
          <td><button className="btn btn-ghost btn-sm" onClick={()=>setActive({s,r})}>Ver / editar</button></td></tr>))}
        </tbody></table></div>}
    </div>

    {active && <CallPanel ctx={ctx} camp={camp} school={active.s} rec={active.r} onClose={()=>setActive(null)}/>}
  </div>);
}

/* ---- Panel de llamada + registro de actividades (preguntas 100% parametrizadas por la campaña) ---- */
function CallPanel({ctx,camp,school,rec,onClose}){
  const {records,setRecords,session,notify}=ctx;
  const [sec,setSec]=useState(0);
  const [estado,setEstado]=useState(rec?rec.estado:null);
  const [estado2,setEstado2]=useState(null);
  const [wrong,setWrong]=useState(rec&&rec.wrong?rec.wrong:[]);
  const [acts,setActs]=useState(rec&&rec.actividades?rec.actividades:[]);
  const [editIdx,setEditIdx]=useState(null);
  const [actualAns,setActualAns]=useState({}); // respuestas de la actividad que se está componiendo
  useEffect(()=>{const id=setInterval(()=>setSec(s=>s+1),1000);return ()=>clearInterval(id);},[]);

  const preguntas=camp.preguntas||[];
  const maxIntentos=camp.maxIntentos||DEFAULT_MAX_INTENTOS;
  const totalTel=(school.telefonos||[]).length;
  const todosErrados=estado==="Número equivocado" && totalTel>0 && wrong.length===totalTel;
  const unSoloErrado=estado==="Número equivocado" && !todosErrados && wrong.length===1 && totalTel>1;
  const efectivo=estado==="Número equivocado" ? (unSoloErrado?estado2:"Número equivocado") : estado;
  const intentosPrev=rec?rec.intentos||0:0;
  const esNoContacto=["No contestó","Número equivocado","Llamar nuevamente"].includes(efectivo);
  const toggleWrong=i=>setWrong(w=>w.includes(i)?w.filter(x=>x!==i):[...w,i]);

  const iniciarEdicion=i=>{ setActualAns(acts[i]||{}); setEditIdx(i); };
  const cancelarEdicion=()=>{ setActualAns({}); setEditIdx(null); };
  const faltantesActual=preguntasObligatoriasFaltantes(preguntas,actualAns);
  const agregarActividad=()=>{
    if(faltantesActual.length){ notify("Faltan preguntas obligatorias por responder: "+faltantesActual.join(", "),"err"); return; }
    if(editIdx!=null){ setActs(p=>p.map((x,i)=>i===editIdx?actualAns:x)); }
    else{ setActs(p=>[...p,actualAns]); }
    setActualAns({});setEditIdx(null);
  };
  const delAct=i=>setActs(p=>p.filter((_,j)=>j!==i));

  const persist=(nuevoEstado,intentosInc,cerrado)=>{
    const prev=records.find(r=>r.campaignId===camp.id&&r.codigo===school.codigo);
    const base=prev||{id:uid("rec"),campaignId:camp.id,codigo:school.codigo,intentos:0,actividades:[]};
    // agentId SIEMPRE refleja a quien está registrando ahora mismo — un centro puede pasar por
    // varios agentes (reasignado, o retomado tras "llamar nuevamente") antes de lograr contacto,
    // y quien finalmente contesta debe poder guardarlo sin importar quién lo tocó antes.
    // agenteOriginalId y primerIntento* se guardan UNA sola vez y nunca se sobrescriben, para no
    // perder la trazabilidad de a quién se asignó primero y quién hizo el primer intento real.
    const esPrimerRegistro=!prev;
    const esPrimerIntentoReal=!base.primerIntentoAgenteId && nuevoEstado!=="Pendiente";
    const nr={...base,agentId:session.id,estado:nuevoEstado,
      agenteOriginalId:base.agenteOriginalId||session.id,
      primerIntentoAgenteId:base.primerIntentoAgenteId||(esPrimerIntentoReal?session.id:null),
      primerIntentoEstado:base.primerIntentoEstado||(esPrimerIntentoReal?nuevoEstado:null),
      primerIntentoEn:base.primerIntentoEn||(esPrimerIntentoReal?Date.now():null),
      actividades:nuevoEstado==="Contactado"?acts:base.actividades,
      wrong:estado==="Número equivocado"?wrong:(base.wrong||[]),
      cerrado:cerrado===true,
      intentos:(base.intentos||0)+(intentosInc?1:0),dur:sec,updatedMs:Date.now()};
    setRecords(p=> prev?p.map(r=>r.id===prev.id?nr:r):[...p,nr]);
    if(supabase){
      // registrarAccion (bitácora) SOLO se escribe si upsertRegistroDB confirma que el guardado
      // realmente tuvo éxito — antes se disparaban ambas cosas en paralelo sin esperar, así que
      // la bitácora podía decir "marcó X como Y" aunque el guardado real hubiera fallado (visto
      // en staging el 18-ago-2026: toast de error + entrada de bitácora como si hubiera funcionado).
      upsertRegistroDB(camp.id,school.codigo,{agentId:nr.agentId,estado:nr.estado,actividades:nr.actividades,wrong:nr.wrong,cerrado:nr.cerrado,intentos:nr.intentos,dur:nr.dur,
        agenteOriginalId:esPrimerRegistro?nr.agenteOriginalId:undefined,
        primerIntentoAgenteId:esPrimerIntentoReal?nr.primerIntentoAgenteId:undefined,
        primerIntentoEstado:esPrimerIntentoReal?nr.primerIntentoEstado:undefined,
        primerIntentoEn:esPrimerIntentoReal?nr.primerIntentoEn:undefined,
      }).then(exito=>{ if(exito) registrarAccion(session.id,"registrar_actividad",`${session.nombre} marcó ${school.codigo} (${school.nombre}) como «${nuevoEstado}» en «${camp.titulo}»`); });
    }
    return nr;
  };
  const guardarContactado=()=>{
    const actsFinal = acts.length? acts : (preguntas.length===0? [{}] : acts);
    if(actsFinal.length===0)return notify("Registra al menos una actividad para marcar Contactado.","err");
    setActs(actsFinal);
    persist("Contactado",false);notify(`Contactado · ${actsFinal.length} actividad(es) · ${school.nombre.slice(0,24)}`);onClose();
  };
  // Solo aplica cuando camp.cierreAutomatico===false: marcar "Contactado" por sí solo NO saca al
  // centro de la Bandeja en esas campañas — hace falta esta acción explícita, para que el agente
  // confirme que la respuesta obtenida sí cumple lo esperado antes de darlo por cerrado.
  const guardarYCerrar=()=>{
    const actsFinal = acts.length? acts : (preguntas.length===0? [{}] : acts);
    if(actsFinal.length===0)return notify("Registra al menos una actividad para cerrar el centro.","err");
    setActs(actsFinal);
    persist("Contactado",false,true);notify(`Centro cerrado · ${school.nombre.slice(0,24)}`);onClose();
  };
  const guardarEstado=()=>{
    if(!estado)return notify("Selecciona el estado de la llamada.","err");
    if(estado==="Número equivocado"){ if(wrong.length===0)return notify("Indica cuál número es equivocado.","err");
      if(unSoloErrado&&!estado2)return notify("Indica qué pasó con el otro número.","err"); }
    if(efectivo==="Contactado")return guardarContactado();
    if(todosErrados){
      persist("Número equivocado",true,true);
      notify(`Cerrado como «Número equivocado»: los ${totalTel} número(s) de este centro están marcados como equivocados.`);
      onClose();
      return;
    }
    const nuevosIntentos=intentosPrev+(esNoContacto?1:0);
    const cierraAuto=esNoContacto && nuevosIntentos>=maxIntentos;
    const estadoFinal=cierraAuto?"Cerrado por no contacto":efectivo;
    persist(estadoFinal,esNoContacto,cierraAuto);
    notify(cierraAuto?`Cerrado por no contacto tras ${nuevosIntentos} intentos (máximo ${maxIntentos}).`:`Registrado · ${estadoFinal}`);
    onClose();
  };
  const cerrarNoContacto=()=>{persist("Cerrado por no contacto",false,true);notify("Centro cerrado por no contacto.");onClose();};

  const foot=<>
    <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
    {efectivo==="Contactado"
      ? (camp.cierreAutomatico===false
          ? <>
              <button className="btn btn-primary" onClick={guardarContactado}>Guardar (sigue en Bandeja)</button>
              <button className="btn btn-accent" onClick={guardarYCerrar}>Guardar y cerrar centro</button>
            </>
          : <button className="btn btn-accent" onClick={guardarContactado}>Finalizar registro</button>)
      : <button className="btn btn-primary" onClick={guardarEstado}>Guardar estado</button>}
  </>;

  return (<Modal title={`${school.nombre}`} onClose={onClose} foot={foot} wide>
    {(rec&&(rec.horaInicio||rec.infoExtra)) && <div className="card" style={{background:"var(--surface-2)",padding:"10px 14px",marginBottom:12}}>
      <div style={{fontWeight:600,fontSize:12.5,color:"var(--text-dim)",marginBottom:6}}>INFORMACIÓN DE REFERENCIA (solo lectura)</div>
      <div className="row" style={{gap:16,flexWrap:"wrap",fontSize:13.5}}>
        {rec.horaInicio && <div><b>Hora de inicio:</b> {rec.horaInicio}</div>}
        {rec.infoExtra&&rec.infoExtra.responsable1 && <div><b>Responsable 1:</b> {rec.infoExtra.responsable1}{rec.infoExtra.telResponsable1&&<> · {rec.infoExtra.telResponsable1}</>}</div>}
        {rec.infoExtra&&rec.infoExtra.responsable2 && <div><b>Responsable 2:</b> {rec.infoExtra.responsable2}{rec.infoExtra.telResponsable2&&<> · {rec.infoExtra.telResponsable2}</>}</div>}
        {rec.infoExtra&&rec.infoExtra.monitor && <div><b>Monitor:</b> {rec.infoExtra.monitor}{rec.infoExtra.telMonitor&&<> · {rec.infoExtra.telMonitor}</>}</div>}
      </div>
    </div>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div className="mono" style={{color:"var(--text-dim)",fontSize:12.5}}>{school.codigo} · {school.municipio}, {school.departamento}{intentosPrev>0&&<> · intento #{intentosPrev+1} de {maxIntentos}</>}</div>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:10,background:"var(--surface-2)"}}><span className="live-dot"/><span className="timer" style={{fontSize:24}}>{fmt(sec)}</span></div>
    </div>

    <div className="section-title" style={{margin:"14px 0 6px"}}>Teléfonos</div>
    <div className="row" style={{gap:8}}>{school.telefonos.map((t,i)=><span key={i} className="chip-btn" style={wrong.includes(i)?{background:"var(--danger)",borderColor:"var(--danger)",color:"#fff"}:null}>📱 {t}</span>)}</div>

    <div className="divider"/>
    <div className="section-title" style={{margin:"0 0 6px"}}>Estado de la llamada</div>
    <div className="row" style={{gap:8}}>
      {["Contactado","No contestó","Número equivocado","Llamar nuevamente"].map(k=>(
        <button key={k} className={"chip-btn"+(estado===k?" on":"")} onClick={()=>{setEstado(k);if(k!=="Número equivocado"){setWrong([]);setEstado2(null);}}}>{k}</button>
      ))}
      <button className="chip-btn" style={{color:"var(--danger)"}} onClick={cerrarNoContacto}>Cerrar por no contacto</button>
    </div>
    {intentosPrev>0 && <small className="muted" style={{display:"block",marginTop:6}}>Intentos hasta ahora: {intentosPrev}/{maxIntentos}. Al llegar a {maxIntentos} sin contactar, el centro se cierra automáticamente.</small>}

    {estado==="Número equivocado" && <div style={{marginTop:10}}>
      <small className="muted">Marca cuál(es) número(s) están equivocados:</small>
      <div className="row" style={{gap:8,marginTop:6}}>{school.telefonos.map((t,i)=>(
        <label key={i} className="checkline" style={{border:"1px solid var(--border)",borderRadius:8,padding:"6px 10px"}}><input type="checkbox" checked={wrong.includes(i)} onChange={()=>toggleWrong(i)}/><span className="mono">{t}</span></label>))}
      </div>
      {unSoloErrado && <div style={{marginTop:12,padding:"12px 14px",borderRadius:10,background:"var(--info-bg)"}}>
        <small style={{color:"var(--info)",fontWeight:600,display:"block",marginBottom:8}}>Solo un número es equivocado. ¿Qué pasó con el otro?</small>
        <div className="row" style={{gap:8}}>{["Contactado","No contestó","Llamar nuevamente"].map(k=><button key={k} className={"chip-btn"+(estado2===k?" on":"")} onClick={()=>setEstado2(k)}>{k}</button>)}</div>
      </div>}
    </div>}

    {efectivo==="Contactado" && <>
      <div className="divider"/>
      <div style={{display:"flex",alignItems:"center"}}><div className="section-title grow" style={{margin:0}}>Actividades registradas ({acts.length})</div></div>

      {acts.map((a,i)=>(editIdx===i?null:
        <div key={i} className="act-card">
          <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
            <div className="grow"><ActividadResumen preguntas={preguntas} act={a}/></div>
            <span style={{display:"flex",gap:6,flex:"none"}}>
              <button className="link" onClick={()=>iniciarEdicion(i)}>Editar</button>
              <button className="link" style={{color:"var(--danger)"}} onClick={()=>delAct(i)}>Eliminar</button>
            </span>
          </div>
        </div>
      ))}

      <div className="card card-pad" style={{background:"var(--surface-2)",marginTop:6}}>
        <div className="section-title" style={{marginTop:0}}>{editIdx!=null?"Editar actividad":"Nueva actividad"}</div>
        <PreguntasEditor preguntas={preguntas} ans={actualAns} setAns={setActualAns}/>
        {faltantesActual.length>0 && <div className="alert alert-err" style={{marginBottom:8}}>Faltan preguntas obligatorias: {faltantesActual.join(", ")}</div>}
        <div style={{display:"flex",gap:8,marginTop:preguntas.length?4:0}}>
          <button className="btn btn-primary btn-sm" disabled={faltantesActual.length>0} onClick={agregarActividad}>{editIdx!=null?"Guardar cambios":"Guardar respuesta"}</button>
          {editIdx!=null&&<button className="btn btn-ghost btn-sm" onClick={cancelarEdicion}>Cancelar edición</button>}
        </div>
      </div>
    </>}
  </Modal>);
}

/* ============================ CAMPAÑAS ============================ */
function Campanas({ctx}){
  const {campaigns,setCampaigns,records,setRecords,filtro,notify,session,users,schools,cargandoDatos,etiquetas,agregarEtiqueta}=ctx;
  const can=CAN[session.rol];
  const [wizard,setWizard]=useState(false);
  const [dup,setDup]=useState(null);      // campaña a duplicar
  const [reasg,setReasg]=useState(null);  // campaña a reasignar
  const [cerrModal,setCerrModal]=useState(null); // campaña a gestionar cerrados
  const [editPreg,setEditPreg]=useState(null);   // campaña a editar preguntas
  const [etiqModal,setEtiqModal]=useState(null); // campaña a etiquetar
  const [verTodas,setVerTodas]=useState(false);
  const [estadoFiltro,setEstadoFiltro]=useState("En curso");
  const [confirmarArchivar,setConfirmarArchivar]=useState(null); // campaña a archivar
  const lista=campaigns.filter(c=>c.estado===estadoFiltro && (verTodas||overlaps(c.fechaDesde,c.fechaHasta,filtro.desde,filtro.hasta)));
  const agName=id=>(users.find(u=>u.id===id)||{}).nombre||"—";

  const toggleEstado=c=>{
    const nuevo=c.estado==="En curso"?"Finalizada":"En curso";
    setCampaigns(p=>p.map(x=>x.id===c.id?{...x,estado:nuevo}:x));
    if(supabase) actualizarCampanaDB(c.id,{estado:nuevo});
    registrarAccion(session.id,nuevo==="Finalizada"?"finalizar_campana":"reactivar_campana",`${session.nombre} ${nuevo==="Finalizada"?"finalizó":"reactivó"} la campaña «${c.titulo}»`);
  };

  // Archivar (solo Administrador/Supervisor, ver CAN.archivarCampana): mueve la campaña y sus
  // registros a las tablas "campanas_archivo"/"registros_archivo" (ver migracion_archivo_campanas.sql)
  // vía una función de Postgres que hace la copia + verificación + borrado en una sola transacción.
  // Una vez archivada, deja de aparecer aquí, en la Bandeja y en Consulta y edición — solo queda
  // accesible por SQL directo. Por eso pide confirmación explícita antes de ejecutarla.
  const archivar=async()=>{
    const c=confirmarArchivar;
    if(!supabase){ setConfirmarArchivar(null); return; }
    const {data,error}=await supabase.rpc("archivar_campana",{p_campana_id:c.id});
    if(error){ avisarErrorGuardado(`No se pudo archivar la campaña «${c.titulo}».`,error.message); setConfirmarArchivar(null); return; }
    const filas=(data&&typeof data.filas_archivadas==="number")?data.filas_archivadas:null;
    setCampaigns(p=>p.filter(x=>x.id!==c.id));
    setRecords(p=>p.filter(r=>r.campaignId!==c.id));
    registrarAccion(session.id,"archivar_campana",`${session.nombre} archivó la campaña «${c.titulo}»${filas!==null?` (${filas} centros)`:""}`);
    notify(`Campaña archivada: ${c.titulo}`);
    setConfirmarArchivar(null);
  };

  return (<div className="grid">
    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <div className="grow"><div className="section-title" style={{margin:0}}>Campañas · {verTodas?"todas las fechas":rangeLabel(filtro.desde,filtro.hasta)}</div></div>
      <div className="seg">{["En curso","Finalizada"].map(k=><button key={k} className={estadoFiltro===k?"on":""} onClick={()=>setEstadoFiltro(k)}>{k}</button>)}</div>
      <label className="checkline" style={{border:"none",padding:0,gap:8}}><input type="checkbox" checked={verTodas} onChange={e=>setVerTodas(e.target.checked)}/><small className="muted">Ver todas las fechas</small></label>
      {can.crear && <button className="btn btn-primary btn-sm" onClick={()=>setWizard(true)}>＋ Crear campaña</button>}
    </div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))"}}>
      {lista.length===0 && cargandoDatos && <div className="card card-pad"><div className="empty">⏳ Cargando campañas…</div></div>}
      {lista.length===0 && !cargandoDatos && <div className="card card-pad"><div className="empty">No hay campañas «{estadoFiltro}» para este rango de fechas.{estadoFiltro==="En curso"&&can.crear?" Puedes gestionar varias campañas en paralelo; crea la primera.":""}</div></div>}
      {lista.map(c=>{const asg=getAssign(c);const rec=records.filter(r=>r.campaignId===c.id);const cont=rec.filter(r=>r.estado==="Contactado").length;const cerrados=rec.filter(r=>estaCerrado(r)).length;return(
        <div key={c.id} className="card card-pad">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <Pill kind={c.estado==="En curso"?"p-success":"p-neutral"}>{c.estado}</Pill>
            <small className="muted">{rangeLabel(c.fechaDesde,c.fechaHasta)}</small>
          </div>
          <h4 style={{margin:"10px 0 6px"}}>{c.titulo}</h4>
          {c.etiqueta && <Pill kind="p-accent">🏷️ {c.etiqueta}</Pill>}
          <p style={{color:"var(--text-dim)",fontSize:13,margin:"6px 0 0",minHeight:36}}>{c.objetivo}</p>
          <div className="divider" style={{margin:"12px 0"}}/>
          <div className="row" style={{gap:14,fontSize:13}}><span>🏫 <b>{c.schoolCodes.length}</b> CE</span><span>🎧 <b>{c.agentIds.length}</b> agentes</span><span>✅ <b>{cont}</b> contactados</span>{c.preguntas&&c.preguntas.length>0&&<span>❓ <b>{c.preguntas.length}</b> preguntas</span>}</div>
          <div style={{display:"flex",gap:6,marginTop:12,flexWrap:"wrap"}}>
            {can.crear && <button className="btn btn-ghost btn-sm" onClick={()=>setEditPreg(c)}>✏️ Editar preguntas</button>}
            {can.crear && <button className="btn btn-ghost btn-sm" onClick={()=>setEtiqModal(c)}>🏷️ Etiquetar</button>}
            {can.reasignar && <button className="btn btn-ghost btn-sm" onClick={()=>setReasg(c)}>Reasignar</button>}
            {can.duplicar && <button className="btn btn-ghost btn-sm" onClick={()=>setDup(c)}>Duplicar</button>}
            {can.crear && <button className="btn btn-ghost btn-sm" onClick={()=>toggleEstado(c)}>{c.estado==="En curso"?"Finalizar":"Reactivar"}</button>}
            {can.exportar && <button className="btn btn-ghost btn-sm" onClick={()=>exportarCampanaExcel(c,schools,users,records)}>⬇ Excel</button>}
            {can.gestionarCerrados && cerrados>0 && <button className="btn btn-ghost btn-sm" style={{color:"var(--danger)"}} onClick={()=>setCerrModal(c)}>🔒 Cerrados ({cerrados})</button>}
            {can.archivarCampana && c.estado==="Finalizada" && c.etiqueta!==ETIQUETA_AGENDA_DIRECTORES && <button className="btn btn-ghost btn-sm" onClick={()=>setConfirmarArchivar(c)}>📦 Archivar</button>}
          </div>
        </div>);})}
    </div>
    {wizard && <CampaignWizard ctx={ctx} onClose={()=>setWizard(false)}/>}
    {dup && <DuplicateModal ctx={ctx} camp={dup} onClose={()=>setDup(null)}/>}
    {reasg && <ReassignModal ctx={ctx} camp={reasg} onClose={()=>setReasg(null)}/>}
    {cerrModal && <CerradosModal ctx={ctx} camp={cerrModal} onClose={()=>setCerrModal(null)}/>}
    {editPreg && <EditQuestionsModal ctx={ctx} camp={editPreg} onClose={()=>setEditPreg(null)}/>}
    {etiqModal && <EtiquetaModal ctx={ctx} camp={etiqModal} onClose={()=>setEtiqModal(null)}/>}
    {confirmarArchivar && <Modal title="Archivar campaña" onClose={()=>setConfirmarArchivar(null)} foot={<><button className="btn btn-ghost" onClick={()=>setConfirmarArchivar(null)}>Cancelar</button><button className="btn btn-danger" onClick={archivar}>Sí, archivar</button></>}>
      <p style={{marginTop:0}}>¿Archivar la campaña «{confirmarArchivar.titulo}»?</p>
      <p style={{color:"var(--text-dim)",fontSize:13}}>Dejará de aparecer aquí, en la Bandeja de llamadas y en Consulta y edición para todos los agentes. Sus datos no se borran — quedan guardados aparte, accesibles solo por el Administrador vía consulta directa a la base de datos si hace falta revisarlos más adelante.</p>
    </Modal>}
  </div>);
}

/* ---- Borradores de campaña (Administrador, Supervisor, Team Leader) ---- */
function Borradores({ctx}){
  const {campaigns,setCampaigns,users,session,notify}=ctx;
  const [continuar,setContinuar]=useState(null); // borrador a continuar en el asistente
  const [confirmarBorrar,setConfirmarBorrar]=useState(null); // borrador a descartar
  const borradores=[...campaigns.filter(c=>c.estado==="Borrador")].sort((a,b)=>(b.actualizadoEn||0)-(a.actualizadoEn||0));
  const nombreDe=id=>(users.find(u=>u.id===id)||{}).nombre||"—";
  const hace=ms=>{
    if(!ms) return "—";
    const seg=Math.floor((Date.now()-ms)/1000);
    if(seg<60) return "hace un momento";
    if(seg<3600) return `hace ${Math.floor(seg/60)} min`;
    if(seg<86400) return `hace ${Math.floor(seg/3600)} h`;
    return `hace ${Math.floor(seg/86400)} día(s)`;
  };
  const descartar=async()=>{
    const b=confirmarBorrar;
    setCampaigns(p=>p.filter(c=>c.id!==b.id));
    if(supabase) await eliminarBorradorDB(b.id);
    registrarAccion(session.id,"descartar_borrador",`${session.nombre} descartó el borrador «${b.titulo||"(sin título)"}»`);
    notify("Borrador descartado.");
    setConfirmarBorrar(null);
  };

  return (<div className="grid">
    <div><div className="section-title" style={{margin:0}}>Borradores de campaña</div><small className="muted">Campañas a medio crear, guardadas automáticamente. Cualquier Administrador, Supervisor o Team Leader puede continuarlas o descartarlas — no solo quien las empezó.</small></div>

    {borradores.length===0 && <div className="card"><div className="empty" style={{padding:30}}>No hay borradores pendientes.</div></div>}

    {borradores.map(b=>(
      <div key={b.id} className="card card-pad" style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
        <div className="grow">
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <b>{b.titulo&&b.titulo.trim()?b.titulo:"(Sin título todavía)"}</b>
            <span className="tag" style={{background:"var(--warn-bg)",color:"var(--warn)"}}>📝 Borrador</span>
          </div>
          <small className="muted" style={{display:"block",marginTop:4}}>
            Iniciado por {nombreDe(b.creadoPor)} · guardado {hace(b.actualizadoEn)}
            {b.preguntas&&b.preguntas.length ? ` · ${b.preguntas.length} pregunta(s) configurada(s)` : ""}
          </small>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-primary btn-sm" onClick={()=>setContinuar(b)}>Continuar</button>
          <button className="btn btn-ghost btn-sm" style={{color:"var(--danger)"}} onClick={()=>setConfirmarBorrar(b)}>Descartar</button>
        </div>
      </div>
    ))}

    {continuar && <CampaignWizard ctx={ctx} borradorInicial={continuar} onClose={()=>setContinuar(null)}/>}
    {confirmarBorrar && <Modal title="Descartar borrador" onClose={()=>setConfirmarBorrar(null)} foot={<><button className="btn btn-ghost" onClick={()=>setConfirmarBorrar(null)}>Cancelar</button><button className="btn btn-danger" onClick={descartar}>Sí, descartar</button></>}>
      <p style={{marginTop:0}}>¿Seguro que quieres descartar el borrador «{confirmarBorrar.titulo&&confirmarBorrar.titulo.trim()?confirmarBorrar.titulo:"(sin título)"}»? Esta acción no se puede deshacer.</p>
    </Modal>}
  </div>);
}

/* ---- Exportar a Excel la base de una campaña con sus resultados (Admin/Supervisor) ---- */
function exportarCampanaExcel(camp,schools,users,records){
  if(typeof XLSX==="undefined") return;
  const asg=getAssign(camp);
  const agName=id=>(users.find(u=>u.id===id)||{}).nombre||"—";
  const recFor=code=>records.find(r=>r.campaignId===camp.id&&r.codigo===code);

  const centros=camp.schoolCodes.map(code=>{
    const s=schools.find(x=>x.codigo===code)||{};
    const r=recFor(code);
    return {
      "Código":code,"Centro Educativo":s.nombre||"","Departamento":s.departamento||"","Municipio":s.municipio||"",
      "Teléfonos":(s.telefonos||[]).join(" / "),"Agente asignado":agName(asg[code]),
      "Estado":r?r.estado:"Pendiente","Intentos":r?r.intentos||0:0,
    };
  });

  const preguntas=camp.preguntas||[];
  const columnasPreg=[];
  preguntas.forEach(q=>{ if(q.tipo==="combinacion") (q.partes||[]).forEach(p=>columnasPreg.push({label:`${q.texto} · ${p.label||p.id}`,q,partId:p.id})); else columnasPreg.push({label:q.texto,q,partId:null}); });
  // si el mismo texto de pregunta se repite (ej. un bloque "¿Tiene otra actividad?" duplicado varias
  // veces para Actividad 1, 2, 3...), numera cada aparición — de lo contrario todas comparten el mismo
  // nombre de columna y se sobrescriben entre sí en el Excel, dejando solo la última con datos.
  const conteoLabel={};
  columnasPreg.forEach(c=>{ conteoLabel[c.label]=(conteoLabel[c.label]||0)+1; });
  const vistoLabel={};
  columnasPreg.forEach(c=>{
    if(conteoLabel[c.label]>1){
      vistoLabel[c.label]=(vistoLabel[c.label]||0)+1;
      c.label=`${c.label} (${vistoLabel[c.label]})`;
    }
  });

  const actividades=[];
  camp.schoolCodes.forEach(code=>{
    const s=schools.find(x=>x.codigo===code)||{};
    const r=recFor(code);
    if(!r||!r.actividades||r.actividades.length===0) return;
    r.actividades.forEach((act,i)=>{
      const fila={"Código":code,"Centro Educativo":s.nombre||"","Agente":agName(r.agentId),"N.° actividad":i+1,
        "Fecha de registro":r.updatedMs?new Date(r.updatedMs).toLocaleString("es-SV"):""};
      columnasPreg.forEach(c=>{ fila[c.label]=labelDeValor(valoresActividad(act,c.q,c.partId)); });
      actividades.push(fila);
    });
  });

  const wb=XLSX.utils.book_new();
  const wsCentros=XLSX.utils.json_to_sheet(centros);
  XLSX.utils.book_append_sheet(wb,wsCentros,"Centros");
  if(actividades.length){
    const wsAct=XLSX.utils.json_to_sheet(actividades);
    XLSX.utils.book_append_sheet(wb,wsAct,"Actividades");
  }
  const nombreArchivo=`campana_${camp.titulo.replace(/[^a-z0-9]+/gi,"_").slice(0,40)}.xlsx`;
  XLSX.writeFile(wb,nombreArchivo);
}

/* ---- Duplicar campaña (sin respuestas, exige nuevo nombre, permite modificar los centros) ---- */
function DuplicateModal({ctx,camp,onClose}){
  const {campaigns,setCampaigns,schools,setSchools,session,notify}=ctx;
  const [nombre,setNombre]=useState(camp.titulo+" (copia)");
  const [err,setErr]=useState(null);
  const [guardando,setGuardando]=useState(false);

  const [selMode,setSelMode]=useState("manual"); // arranca en "manual" con la lista original ya marcada
  const [manual,setManual]=useState(camp.schoolCodes);
  const [grupo,setGrupo]=useState({tipo:"departamento",valores:[DEPTOS[0]]});
  const [uploaded,setUploaded]=useState([]);
  const [upInfo,setUpInfo]=useState(null);

  const ordenEs=(a,b)=>a.localeCompare(b,"es",{sensitivity:"base"});
  const grupoOptions={departamento:DEPTOS,municipio:[...new Set(schools.map(s=>s.municipio))].sort(ordenEs),distrito:[...new Set(schools.map(s=>s.distrito))].sort(ordenEs),fase:["1","2","3"],programa:[],modernizacion:[],control:[]};
  const MULTI_TIPOS=["departamento","municipio","distrito"];

  const selectedSchools=useMemo(()=>{
    if(selMode==="archivo")return uploaded;
    if(selMode==="todos")return schools;
    if(selMode==="manual")return schools.filter(s=>manual.includes(s.codigo));
    const {tipo,valores}=grupo;
    const igual=(a,b)=>String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();
    const norm=v=>String(v||"").trim().toLowerCase();
    const valoresNorm=(valores||[]).map(norm);
    return schools.filter(s=>{if(tipo==="departamento")return valoresNorm.includes(norm(s.departamento));if(tipo==="municipio")return valoresNorm.includes(norm(s.municipio));if(tipo==="distrito")return valoresNorm.includes(norm(s.distrito));if(tipo==="programa")return igual(s.programa,"Despega");if(tipo==="modernizacion")return s.modernizacion;if(tipo==="fase")return valoresNorm.includes(norm(valores&&valores[0]));if(tipo==="control")return s.control;return false;});
  },[selMode,manual,grupo,schools,uploaded]);

  const onFile=file=>{if(!file)return;setUpInfo({nombre:file.name,cargando:true});parseSchoolFile(file,(err,res)=>{if(err){setUploaded([]);setUpInfo({nombre:file.name,error:err.message});return;}const vistos={},lista=[];res.validos.forEach(s=>{if(!vistos[s.codigo]){vistos[s.codigo]=1;lista.push(s);}});setUploaded(lista);setUpInfo({nombre:file.name,cargados:lista.length,omitidos:res.omitidos,hoja:res.hoja});});};

  const dup=async()=>{
    const n=nombre.trim();
    if(!n)return setErr("Escribe un nombre.");
    if(n.toLowerCase()===camp.titulo.toLowerCase())return setErr("El nombre debe ser distinto al de la campaña original.");
    if(campaigns.some(c=>c.titulo.toLowerCase()===n.toLowerCase()))return setErr("Ya existe una campaña con ese nombre.");
    if(!selectedSchools.length)return setErr("Selecciona al menos un centro educativo.");
    if(selMode==="archivo"&&uploaded.length){setSchools(prev=>{const map={};prev.forEach(s=>map[s.codigo]=s);uploaded.forEach(s=>map[s.codigo]={...map[s.codigo],...s});return Object.values(map);});}
    const codesNuevos=selectedSchools.map(s=>s.codigo);
    // conserva la asignación original donde el centro sigue en la lista; el resto (centros nuevos) se reparte equitativamente
    const assignPrevio=getAssign(camp);
    const assignNuevo={};
    codesNuevos.forEach(code=>{ if(assignPrevio[code]&&camp.agentIds.includes(assignPrevio[code])) assignNuevo[code]=assignPrevio[code]; });
    const sinAsignar=codesNuevos.filter(code=>!assignNuevo[code]);
    Object.assign(assignNuevo,buildAssign(sinAsignar,camp.agentIds));
    const copiaLocal={id:uid("c"),titulo:n,objetivo:camp.objetivo,fechaDesde:camp.fechaDesde,fechaHasta:camp.fechaHasta,
      maxIntentos:camp.maxIntentos,preguntas:camp.preguntas,estado:"En curso",pausada:false,
      schoolCodes:codesNuevos,agentIds:[...camp.agentIds],assign:assignNuevo}; // conserva agentes; NO copia registros/respuestas
    if(supabase){
      setGuardando(true);
      const idReal=await crearCampanaDB(copiaLocal);
      setGuardando(false);
      if(!idReal) return setErr("No se pudo guardar la campaña duplicada.");
      copiaLocal.id=idReal;
    }
    setCampaigns(p=>[...p,copiaLocal]);
    registrarAccion(session.id,"duplicar_campana",`${session.nombre} duplicó «${camp.titulo}» como «${n}» (${codesNuevos.length} centros)`);
    notify("Campaña duplicada sin registros: "+n);onClose();
  };

  return (<Modal title="Duplicar campaña" onClose={onClose} wide foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-accent" disabled={guardando} onClick={dup}>{guardando?"Guardando…":"Duplicar"}</button></>}>
    <p style={{color:"var(--text-dim)",marginTop:0}}>Se copiarán los agentes de «{camp.titulo}». <b>No se copiarán los registros ni las respuestas.</b> Puedes modificar la lista de centros educativos antes de duplicar.</p>
    <div className="field"><label>Nombre de la nueva campaña</label><input className="input" value={nombre} onChange={e=>setNombre(e.target.value)}/></div>

    <div className="field"><label>Centros educativos</label>
      <div className="seg" style={{marginBottom:14,flexWrap:"wrap"}}>{[["todos","Todos"],["manual","Selección manual"],["grupo","Por grupo"],["archivo","Cargar archivo"]].map(([k,t])=><button key={k} className={selMode===k?"on":""} onClick={()=>setSelMode(k)}>{t}</button>)}</div>
      {selMode==="grupo"&&<div style={{margin:"12px 0"}}>
        <select className="input" style={{width:"auto"}} value={grupo.tipo} onChange={e=>{const nuevoTipo=e.target.value;const opts=grupoOptions[nuevoTipo]||[];setGrupo({tipo:nuevoTipo,valores:opts[0]!=null?[opts[0]]:[]});}}>
          <option value="departamento">Departamento</option><option value="municipio">Municipio</option><option value="distrito">Distrito</option><option value="programa">Programa Despega</option><option value="modernizacion">Modernización</option><option value="fase">Fase</option><option value="control">Centros control</option></select>
        {MULTI_TIPOS.includes(grupo.tipo) && (grupoOptions[grupo.tipo]||[]).length>0 && <div style={{marginTop:10}}>
          <div className="row" style={{gap:12,alignItems:"center",marginBottom:8}}>
            <span className="link" onClick={()=>setGrupo(g=>({...g,valores:[...grupoOptions[g.tipo]]}))}>Seleccionar todos</span>
            <span className="link" onClick={()=>setGrupo(g=>({...g,valores:[]}))}>Ninguno</span>
            <span className="tag">{grupo.valores.length} de {grupoOptions[grupo.tipo].length} seleccionado(s)</span>
          </div>
          <div className="tbl-wrap scroll-y" style={{maxHeight:220,padding:10}}>
            <div className="row" style={{gap:8,flexWrap:"wrap"}}>
              {grupoOptions[grupo.tipo].map(v=>(
                <label key={v} className="checkline" style={{border:"1px solid var(--border)",borderRadius:8,padding:"6px 10px"}}>
                  <input type="checkbox" checked={grupo.valores.includes(v)} onChange={()=>setGrupo(g=>({...g,valores:g.valores.includes(v)?g.valores.filter(x=>x!==v):[...g.valores,v]}))}/>
                  <span>{v}</span>
                </label>
              ))}
            </div>
          </div>
        </div>}
        {!MULTI_TIPOS.includes(grupo.tipo) && (grupoOptions[grupo.tipo]||[]).length>0 && <select className="input" style={{width:"auto",marginTop:10}} value={grupo.valores[0]||""} onChange={e=>setGrupo(g=>({...g,valores:[e.target.value]}))}>{grupoOptions[grupo.tipo].map(v=><option key={v}>{v}</option>)}</select>}
      </div>}
      {selMode==="archivo"&&<div style={{margin:"12px 0"}}>
        <div style={{border:"1.5px dashed var(--border-strong)",borderRadius:12,padding:18,background:"var(--surface-2)",textAlign:"center"}}>
          <div style={{fontSize:26,opacity:.6}}>📄</div><p style={{margin:"6px 0 12px",color:"var(--text-dim)"}}>Carga un archivo <b>CSV</b> o <b>Excel</b> con los centros educativos.</p>
          <label className="btn btn-primary btn-sm" style={{display:"inline-flex",cursor:"pointer"}}>Seleccionar archivo<input type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}} onChange={e=>onFile(e.target.files[0])}/></label>
          <button className="btn btn-ghost btn-sm" style={{marginLeft:8}} onClick={downloadTemplate}>⬇ Descargar plantilla</button>
        </div>
