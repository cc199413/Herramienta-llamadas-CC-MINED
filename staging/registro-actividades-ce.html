      </div>}

      <div className="tag" style={{margin:"6px 0 10px",display:"inline-block"}}>{selectedSchools.length} centros seleccionados</div>
      <div className="tbl-wrap scroll-y"><table><thead><tr>{selMode==="manual"&&<th></th>}<th>Código</th><th>Centro</th><th>Depto.</th><th>Teléfonos</th></tr></thead>
        <tbody>{(selMode==="archivo"?uploaded:schools).map(s=>{const inG=selectedSchools.some(x=>x.codigo===s.codigo);if(selMode==="grupo"&&!inG)return null;return(<tr key={s.codigo}>
          {selMode==="manual"&&<td><input type="checkbox" checked={manual.includes(s.codigo)} onChange={()=>setManual(m=>m.includes(s.codigo)?m.filter(x=>x!==s.codigo):[...m,s.codigo])}/></td>}
          <td className="mono">{s.codigo}</td><td>{s.nombre}</td><td>{s.departamento}</td><td className="mono" style={{fontSize:12}}>{(s.telefonos||[]).join(" · ")}</td></tr>);})}
        </tbody></table>{selMode==="archivo"&&uploaded.length===0&&<div className="empty" style={{padding:24}}>Aún no has cargado un archivo.</div>}</div>
    </div>}

    {step===3 && <div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,flexWrap:"wrap"}}>
        <small className="muted">Solo agentes con skill <b>Outbound</b>, activos y disponibles. Filtrar por turno:</small>
        <div className="seg">{(turnoApoyoHabilitado?["Todos","AM","PM","Apoyo"]:["Todos","AM","PM"]).map(t=><button key={t} className={turno===t?"on":""} onClick={()=>setTurno(t)}>{t}</button>)}</div>
      </div>
      <small className="muted">Todos van seleccionados por defecto. Des-selecciona a quienes estén de día libre.</small>
      <div className="card" style={{marginTop:10}}>{agAvail.map(a=>{
        const otrasCamps=campaigns.filter(c=>c.estado==="En curso"&&c.agentIds.includes(a.id));
        return (
        <label key={a.id} className="checkline" style={{padding:"10px 14px"}}>
          <input type="checkbox" checked={agSel.includes(a.id)} onChange={()=>setAgSel(s=>s.includes(a.id)?s.filter(x=>x!==a.id):[...s,a.id])}/>
          <div className="avatar" style={{background:"var(--surface-3)",color:"var(--text)"}}>{a.nombre.split(" ").map(x=>x[0]).slice(0,2).join("")}</div>
          <div className="grow"><b>{a.nombre}</b> <span className="tag">Turno {a.turno}</span> <span className="badge badge-out">Outbound</span>
            {otrasCamps.length>0 && <span className="tag" style={{color:"var(--warn)"}} title={otrasCamps.map(c=>c.titulo).join(", ")}>📌 {otrasCamps.length===1?otrasCamps[0].titulo:`${otrasCamps.length} campañas activas`}</span>}
          </div>
          <Pill kind={opPill(a.opStatus)}>{a.opStatus}</Pill></label>);})}
        {agAvail.length===0&&<div className="empty" style={{padding:20}}>No hay agentes Outbound disponibles en este turno.</div>}</div>
    </div>}

    {step===4 && <div>
      <div className="row" style={{gap:14}}>
        <div className="card card-pad grow"><div className="stat"><span className="k">Centros</span><span className="v">{selectedSchools.length}</span></div></div>
        <div className="card card-pad grow"><div className="stat"><span className="k">Agentes</span><span className="v">{finalAgents.length}</span></div></div>
        <div className="card card-pad grow"><div className="stat"><span className="k">Preguntas</span><span className="v">{preguntas.filter(q=>q.texto).length}</span></div></div>
        <div className="card card-pad grow"><div className="stat"><span className="k">Fecha</span><span className="v" style={{fontSize:16}}>{rangeLabel(fDesde,fHasta)}</span></div></div>
      </div>
      <div className="card card-pad" style={{marginTop:14}}>
        <div className="section-title" style={{marginTop:0}}>Asignación equitativa</div>
        <p style={{margin:0,color:"var(--text-dim)"}}>Cada agente recibirá <b>{perAgent}</b> centros{resto>0&&<> y los primeros <b>{resto}</b> recibirán uno adicional</>}.</p>
        <div className="legend" style={{marginTop:12}}>{finalAgents.map((a,i)=><span key={a.id}><i style={{background:PALETTE[i%PALETTE.length]}}/>{a.nombre}: <b className="mono">{perAgent+(i<resto?1:0)}</b></span>)}</div>
      </div>
      <div className="alert alert-info" style={{marginTop:14}}>«{titulo||"Campaña sin título"}» quedará <b>En curso</b> junto a las demás campañas activas (puedes gestionar varias en paralelo). Se cerrará por no contacto automáticamente tras {maxIntentos} intentos.</div>
    </div>}
  </Modal>
  {pedirConfirmIncompleta && <Modal title="Información adicional incompleta" onClose={()=>setPedirConfirmIncompleta(false)} foot={<><button className="btn btn-ghost" onClick={()=>setPedirConfirmIncompleta(false)}>Cancelar</button><button className="btn btn-accent" onClick={()=>{setPedirConfirmIncompleta(false);crearCampanaFinal();}}>Crear de todas formas</button></>}>
    <p style={{marginTop:0}}><b>{incompletosInfoExtra}</b> de {selectedSchools.length} centro(s) seleccionados no tienen completa la información adicional (Hora de inicio, Responsables o Monitor) — o no aparecen en el archivo cargado.</p>
    <p style={{color:"var(--text-dim)"}}>La campaña se puede crear igual: a esos centros simplemente no se les mostrará esa información en la Bandeja, sin que eso les impida ser contactados normalmente.</p>
  </Modal>}
  </>);
}

/* ============================ CONSULTA Y EDICIÓN (INBOUND) ============================ */
function Consulta({ctx}){
  const {schools,campaigns,filtro}=ctx;
  const [q,setQ]=useState("");
  const [sel,setSel]=useState(null);
  const [campSel,setCampSel]=useState("todas");
  const campanasOrdenadas=useMemo(()=>[...campaigns].sort((a,b)=>a.titulo.localeCompare(b.titulo,"es")),[campaigns]);
  const res=useMemo(()=>{
    let base=schools;
    if(campSel!=="todas"){
      const camp=campaigns.find(c=>c.id===campSel);
      base=camp?schools.filter(s=>camp.schoolCodes.includes(s.codigo)):[];
    }
    const t=_norm(q);
    if(!t)return base.slice(0,8);
    return base.filter(s=>_norm(s.nombre).includes(t)||_norm(s.codigo).includes(t)||_norm(s.departamento).includes(t)||_norm(s.municipio).includes(t)).slice(0,30);
  },[q,schools,campSel,campaigns]);
  return (<div className="grid split-360" style={{alignItems:"start"}}>
    <div className="grid">
      <div className="field" style={{margin:0}}><label>Campaña</label>
        <select className="input" value={campSel} onChange={e=>setCampSel(e.target.value)}>
          <option value="todas">Todas las campañas</option>
          {campanasOrdenadas.map(c=><option key={c.id} value={c.id}>{c.titulo}</option>)}
        </select>
      </div>
      <div className="searchbar"><span>🔎</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Nombre, código, departamento o municipio"/></div>
      <div className="card"><div className="toggle-list">
        {res.map(s=>(<button key={s.codigo} className="row-item" style={{textAlign:"left",background:sel===s.codigo?"var(--surface-2)":"none"}} onClick={()=>setSel(s.codigo)}>
          <div className="grow"><b style={{fontSize:13.5}}>{s.nombre}</b><div className="mini mono">{s.codigo} · {s.municipio}, {s.departamento}</div></div><span style={{color:"var(--text-faint)"}}>›</span></button>))}
        {res.length===0&&<div className="empty" style={{padding:24}}>Sin coincidencias.</div>}
      </div></div>
    </div>
    {sel?<InboundCE ctx={ctx} codigo={sel} campaniaId={campSel!=="todas"?campSel:null}/>:<div className="card card-pad"><div className="empty" style={{padding:"40px 10px"}}><div className="big">🔎</div>Busca y selecciona un Centro Educativo para consultar o editar sus actividades de {rangeLabel(filtro.desde,filtro.hasta)}.</div></div>}
  </div>);
}
function InboundCE({ctx,codigo,campaniaId}){
  const {schools,campaigns,records,setRecords,filtro,session,notify}=ctx;
  const can=CAN[session.rol];
  const campsRango=campaniaId?campaigns.filter(c=>c.id===campaniaId):campaigns.filter(c=>overlaps(c.fechaDesde,c.fechaHasta,filtro.desde,filtro.hasta));
  const recs=records.filter(r=>r.codigo===codigo && campsRango.some(c=>c.id===r.campaignId));
  // Igual que en Bandeja: si el archivo de la campaña trajo su propio teléfono/dato para este centro,
  // tiene prioridad sobre lo que haya en el catálogo oficial; y si el código no está en el catálogo en
  // absoluto, se arma un centro virtual con lo que traiga el registro.
  let s=schools.find(x=>x.codigo===codigo);
  const recConInfo=recs.find(r=>r.infoExtra&&(r.infoExtra.nombre||r.infoExtra.telefonos));
  if(s && recConInfo){
    const ov={};
    if(recConInfo.infoExtra.telefonos && recConInfo.infoExtra.telefonos.length && recConInfo.infoExtra.telefonos[0]) ov.telefonos=recConInfo.infoExtra.telefonos;
    if(recConInfo.infoExtra.nombre) ov.nombre=recConInfo.infoExtra.nombre;
    if(recConInfo.infoExtra.departamento) ov.departamento=recConInfo.infoExtra.departamento;
    if(recConInfo.infoExtra.municipio) ov.municipio=recConInfo.infoExtra.municipio;
    if(recConInfo.infoExtra.distrito) ov.distrito=recConInfo.infoExtra.distrito;
    if(Object.keys(ov).length) s={...s,...ov};
  }
  if(!s && recConInfo && recConInfo.infoExtra.nombre){
    s={codigo,nombre:recConInfo.infoExtra.nombre,departamento:recConInfo.infoExtra.departamento||"",municipio:recConInfo.infoExtra.municipio||"",
      distrito:recConInfo.infoExtra.distrito||"",telefonos:(recConInfo.infoExtra.telefonos&&recConInfo.infoExtra.telefonos.length)?recConInfo.infoExtra.telefonos:[""],
      programa:null,modernizacion:false,fase:null,control:false};
  }
  // campaña destino para agregar (si no hay registro): la elegida en el filtro, o la primera del rango que incluya el CE
  const campDestino=campsRango.find(c=>c.schoolCodes.includes(codigo));
  const [edit,setEdit]=useState(null); // {recId, idx}
  const [editAns,setEditAns]=useState({});
  const [adding,setAdding]=useState(false);
  const [nuevaAns,setNuevaAns]=useState({});

  const bloqueadoPorSDP=session.skill==="SDP";
  // Un agente con skill "Inbound" puede editar cualquier centro desde este módulo, sin importar
  // quién sea el dueño actual (agentId) — su función es justamente atender/editar llamadas entrantes
  // de cualquier Centro Educativo. Esto NO afecta la Bandeja de llamadas ni la regla de "dueño del
  // centro" para agentes Outbound, que sigue intacta ahí. Requiere la política RLS
  // "registros_update_inbound" (ver migracion_permisos_inbound.sql) para que el guardado no falle en
  // silencio del lado de la base de datos.
  const esInbound=session.skill==="Inbound";
  const puedeEditar=r=>!bloqueadoPorSDP && (can.editarTodo || esInbound || (can.editar && r.agentId===session.id));
  const puedeAgregar=can.editar && !bloqueadoPorSDP;
  const guardarAct=(recId,idx)=>{
    let campaignId=null,codigoCE=null,actividadesNuevas=null;
    setRecords(p=>p.map(r=>{
      if(r.id!==recId)return r;
      const arr=[...(r.actividades||[])];if(idx!=null)arr[idx]=editAns;else arr.push(editAns);
      campaignId=r.campaignId;codigoCE=r.codigo;actividadesNuevas=arr;
      return {...r,actividades:arr,estado:"Contactado",updatedMs:Date.now()};
    }));
    if(supabase&&campaignId) upsertRegistroDB(campaignId,codigoCE,{actividades:actividadesNuevas,estado:"Contactado"});
    setEdit(null);setEditAns({});notify(idx!=null?"Actividad actualizada.":"Actividad agregada.");
  };
  const eliminarAct=(recId,idx)=>{
    let campaignId=null,codigoCE=null,actividadesNuevas=null;
    setRecords(p=>p.map(r=>{
      if(r.id!==recId)return r;
      const arr=r.actividades.filter((_,i)=>i!==idx);
      campaignId=r.campaignId;codigoCE=r.codigo;actividadesNuevas=arr;
      return {...r,actividades:arr,updatedMs:Date.now()};
    }));
    if(supabase&&campaignId) upsertRegistroDB(campaignId,codigoCE,{actividades:actividadesNuevas});
    notify("Actividad eliminada.");
  };
  const crearRegistro=()=>{
    if(!campDestino)return notify("Este centro no pertenece a ninguna campaña del rango seleccionado.","err");
    const faltantes=preguntasObligatoriasFaltantes(campDestino.preguntas||[],nuevaAns);
    if(faltantes.length) return notify("Faltan preguntas obligatorias por responder: "+faltantes.join(", "),"err");
    const agentIdFinal=(getAssign(campDestino)[codigo])||session.id;
    const nr={id:uid("rec"),campaignId:campDestino.id,codigo,agentId:agentIdFinal,estado:"Contactado",intentos:0,actividades:[nuevaAns],wrong:[],dur:0,updatedMs:Date.now()};
    setRecords(p=>{ const existe=p.some(r=>r.campaignId===campDestino.id&&r.codigo===codigo); return existe?p.map(r=>(r.campaignId===campDestino.id&&r.codigo===codigo)?nr:r):[...p,nr]; });
    if(supabase) upsertRegistroDB(campDestino.id,codigo,{agentId:agentIdFinal,estado:"Contactado",actividades:[nuevaAns]});
    setAdding(false);setNuevaAns({});notify("Registro creado con la actividad.");
  };

  return (<div className="grid">
    <div className="card card-pad">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
        <div><h4 style={{margin:0}}>{s.nombre}</h4><div className="mini mono">{s.codigo} · {s.municipio}, {s.departamento} · Tel: {s.telefonos.join(" · ")}</div></div>
        <span className="tag">📅 {rangeLabel(filtro.desde,filtro.hasta)}</span>
      </div>
    </div>

    {recs.length===0 && <div className="card card-pad">
      <div className="empty" style={{padding:20}}>No hay actividades registradas para este rango de fechas.</div>
      {puedeAgregar && campDestino && (adding
        ? <div className="card card-pad" style={{background:"var(--surface-2)",marginTop:10}}>
            <PreguntasEditor preguntas={campDestino.preguntas||[]} ans={nuevaAns} setAns={setNuevaAns}/>
            {(()=>{const f=preguntasObligatoriasFaltantes(campDestino.preguntas||[],nuevaAns);return f.length>0 && <div className="alert alert-err" style={{marginBottom:8}}>Faltan preguntas obligatorias: {f.join(", ")}</div>;})()}
            <div style={{display:"flex",gap:8,marginTop:6}}>
              <button className="btn btn-primary btn-sm" disabled={preguntasObligatoriasFaltantes(campDestino.preguntas||[],nuevaAns).length>0} onClick={crearRegistro}>Guardar respuesta</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>{setAdding(false);setNuevaAns({});}}>Cancelar</button>
            </div>
          </div>
        : <div style={{textAlign:"center"}}><button className="btn btn-accent btn-sm" onClick={()=>setAdding(true)}>＋ Registrar actividad (inbound)</button></div>)}
      {can.editar && !campDestino && <div className="banner banner-warn">Este centro no pertenece a ninguna campaña del rango seleccionado, por lo que no puede registrarse aún.</div>}
      {bloqueadoPorSDP && <div className="banner banner-warn">Tu skill es SDP: no puedes registrar ni editar actividades en campañas.</div>}
    </div>}

    {recs.map(r=>{const camp=campaigns.find(c=>c.id===r.campaignId);const editable=puedeEditar(r);const preguntas=camp?camp.preguntas||[]:[];return(
      <div key={r.id} className="card card-pad">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
          <Pill kind={statePill(r.estado)}>{r.estado}</Pill>
          <span className="tag">{camp?camp.titulo:"—"}</span>
          <span className="mini">{r.actividades?r.actividades.length:0} actividad(es)</span>
          {!editable && <span className="tag" style={{marginLeft:"auto"}}>Solo lectura</span>}
        </div>
        {(r.actividades||[]).map((a,i)=>(edit&&edit.recId===r.id&&edit.idx===i
          ? <div key={i} className="card card-pad" style={{background:"var(--surface-2)",marginBottom:10}}>
              <PreguntasEditor preguntas={preguntas} ans={editAns} setAns={setEditAns}/>
              {(()=>{const f=preguntasObligatoriasFaltantes(preguntas,editAns);return f.length>0 && <div className="alert alert-err" style={{marginBottom:8}}>Faltan preguntas obligatorias: {f.join(", ")}</div>;})()}
              <div style={{display:"flex",gap:8,marginTop:6}}>
                <button className="btn btn-primary btn-sm" disabled={preguntasObligatoriasFaltantes(preguntas,editAns).length>0} onClick={()=>guardarAct(r.id,i)}>Guardar cambios</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>{setEdit(null);setEditAns({});}}>Cancelar</button>
              </div>
            </div>
          : <div key={i} className="act-card">
              <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                <div className="grow"><ActividadResumen preguntas={preguntas} act={a}/></div>
                {editable&&<span style={{display:"flex",gap:8,flex:"none"}}>
                  <button className="link" onClick={()=>{setEdit({recId:r.id,idx:i});setEditAns(a);}}>Editar</button>
                  {can.eliminar&&<button className="link" style={{color:"var(--danger)"}} onClick={()=>eliminarAct(r.id,i)}>Eliminar</button>}</span>}
              </div>
            </div>))}
        {editable && (adding===r.id
          ? <div className="card card-pad" style={{background:"var(--surface-2)"}}>
              <PreguntasEditor preguntas={preguntas} ans={editAns} setAns={setEditAns}/>
              <div style={{display:"flex",gap:8,marginTop:6}}>
                <button className="btn btn-primary btn-sm" onClick={()=>guardarAct(r.id,null)}>Guardar respuesta</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>{setAdding(false);setEditAns({});}}>Cancelar</button>
              </div>
            </div>
          : <button className="btn btn-ghost btn-sm" style={{marginTop:6}} onClick={()=>{setAdding(r.id);setEditAns({});setEdit(null);}}>＋ Agregar actividad</button>)}
      </div>);})}
  </div>);
}

/* ============================ EQUIPO DE AGENTES ============================ */
function Equipo({ctx}){
  const {users,patchUser,session,pausa,setPausa,dailyLog,limites,setLimites,auxHabilitados,auxUltimoCambio,toggleAuxiliar,campaigns,setCampaigns,notify,turnoApoyoHabilitado,toggleTurnoApoyo,sesionTimeouts,actualizarSesionTimeouts}=ctx;
  const can=CAN[session.rol];
  const esAdmin=session.rol==="Administrador";
  const now=useNow();
  const agentes=users.filter(u=>u.rol==="Agente"&&u.estado==="activo");
  const upd=(id,patch)=>patchUser(id,patch);

  const totalActivos=agentes.length;
  const disponibles=agentes.filter(a=>(a.opStatus||"Activo")==="Activo" && a.disponible!==false).length;
  const enLlamada=0; // este prototipo no mantiene un estado "en llamada" persistente por agente
  const dursSemana=[];
  // duración promedio: registros con llamada gestionada en cualquier campaña (dur>0)
  ctx.records&&ctx.records.forEach(r=>{ if(r.dur>0) dursSemana.push(r.dur); });
  const avgDur=dursSemana.length?Math.round(dursSemana.reduce((a,b)=>a+b,0)/dursSemana.length):0;
  const byOp=k=>agentes.filter(a=>(a.opStatus||"Activo")===k).length;

  // columnas de auxiliares con su clave de campo diario, para aplicar color por límite en cada una
  const AUX_COLS=[["Baño","banoSec"],["Break","breakSec"],["Comida","comidaSec"],["Capacitación","capacitacionSec"],["Personal","personalSec"],["Retroalimentación","retroalimentacionSec"]];

  // campañas en curso, para el control de pausa individual
  const campEnCurso=campaigns.filter(c=>c.estado==="En curso");
  const [campPausaSel,setCampPausaSel]=useState(campEnCurso[0]?campEnCurso[0].id:"");
  useEffect(()=>{ if(!campEnCurso.some(c=>c.id===campPausaSel)) setCampPausaSel(campEnCurso[0]?campEnCurso[0].id:""); },[campaigns.length]);
  const campSel=campaigns.find(c=>c.id===campPausaSel);
  const toggleCampPausa=()=>{
    const nuevaPausada=!(campSel&&campSel.pausada);
    setCampaigns(p=>p.map(c=>c.id===campPausaSel?{...c,pausada:nuevaPausada}:c));
    if(supabase) actualizarCampanaDB(campPausaSel,{pausada:nuevaPausada});
    registrarAccion(session.id,nuevaPausada?"pausar_campana":"reanudar_campana",`${session.nombre} ${nuevaPausada?"pausó":"reanudó"} las llamadas de «${campSel?campSel.titulo:""}»`);
    notify(nuevaPausada?`Llamadas pausadas para «${campSel?campSel.titulo:""}»`:`Llamadas reanudadas para «${campSel?campSel.titulo:""}»`);
  };

  return (<div className="grid">
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))"}}>
      <Stat k="Agentes disponibles" v={disponibles} meta={`de ${totalActivos} activos`} c="var(--success)"/>
      <Stat k="En llamada" v={enLlamada} meta="en tiempo real" c="var(--info)"/>
      <Stat k="Duración promedio" v={fmt(avgDur)} meta="por llamada" c="var(--navy-2)"/>
      <Stat k="En baño" v={byOp("Baño")} c="var(--info)"/>
      <Stat k="En break" v={byOp("Break")} c="var(--warn)"/>
      <Stat k="En comida" v={byOp("Comida")} c="var(--violet)"/>
      <Stat k="En capacitación" v={byOp("Capacitación")} c="var(--accent-ink)"/>
      <Stat k="En personal" v={byOp("Personal")} c="var(--neutral)"/>
      <Stat k="En retroalimentación" v={byOp("Retroalimentación")} c="var(--teal)"/>
    </div>

    <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div className="grow"><div className="section-title" style={{margin:0}}>Auxiliares habilitados</div><small className="muted">Un auxiliar deshabilitado deja de poder seleccionarse para nuevas pausas. {can.auxiliares?"Puedes habilitarlos/deshabilitarlos.":"Solo Administrador, Team Leader o Supervisor pueden modificar esto."}</small></div>
      </div>
      <div className="row" style={{gap:20,marginTop:10,flexWrap:"wrap"}}>
        {AUXILIARES.map(k=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:8}}>
            <Switch on={auxHabilitados[k]!==false} disabled={!can.auxiliares} onClick={()=>toggleAuxiliar(k)}/>
            <span style={{fontSize:13}}>{k}</span>
          </div>
        ))}
      </div>
      {auxUltimoCambio && <small className="muted" style={{display:"block",marginTop:10}}>Último cambio por <b>{(users.find(u=>u.id===auxUltimoCambio.porId)||{}).nombre||"—"}</b> · {new Date(auxUltimoCambio.cuando).toLocaleString("es-SV")}</small>}
    </div>

    <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div className="grow"><div className="section-title" style={{margin:0}}>Límites de tiempo por auxiliar</div><small className="muted">Tiempo acumulado por día: en amarillo al 80%, en rojo al excederlo. {esAdmin?"Puedes editarlo (minutos).":"Solo el Administrador puede modificar estos valores."}</small></div>
      </div>
      <div className="row" style={{gap:16,marginTop:10,flexWrap:"wrap"}}>
        {AUXILIARES.map(k=>(
          <div key={k} className="field" style={{margin:0}}>
            <label>{k}</label>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <input className="input" type="number" min={1} max={480} style={{width:90}} disabled={!esAdmin}
                value={Math.round((limites[k]||0)/60)}
                onChange={e=>{
                  const nuevo={...limites,[k]:Math.max(1,Number(e.target.value)||1)*60};
                  setLimites(nuevo);
                  if(supabase) updateConfiguracion("limites_auxiliares",nuevo,session.id);
                }}
                onBlur={e=>registrarAccion(session.id,"cambiar_limite",`${session.nombre} cambió el límite de «${k}» a ${Math.round((limites[k]||0)/60)} min`)}/>
              <small className="muted">min</small>
            </div>
          </div>
        ))}
      </div>
    </div>

    {esAdmin && <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div className="grow"><div className="section-title" style={{margin:0}}>Cierre de sesión automático</div><small className="muted">Minutos de inactividad antes de cerrar la sesión, por rol. Solo el Administrador puede editar esto.</small></div>
      </div>
      <div className="row" style={{gap:16,marginTop:10,flexWrap:"wrap"}}>
        {ROLES.map(rol=>(
          <div key={rol} className="field" style={{margin:0}}>
            <label>{rol}</label>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <input className="input" type="number" min={1} max={600} style={{width:90}}
                value={sesionTimeouts[rol]||""}
                onChange={e=>actualizarSesionTimeouts({...sesionTimeouts,[rol]:Math.max(1,Number(e.target.value)||1)})}/>
              <small className="muted">min</small>
            </div>
          </div>
        ))}
      </div>
      <small className="muted" style={{display:"block",marginTop:10}}>Además, un Agente en turno AM o PM cierra sesión automáticamente 10 minutos después del fin de su turno, sin importar este valor.</small>
    </div>}

    {esAdmin && <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div className="grow"><div className="section-title" style={{margin:0}}>Turno «Apoyo»</div><small className="muted">Permite asignar a un agente un turno sin restricción de horario: puede llamar a cualquier hora. Cierra sesión automáticamente todos los días a las 11:15 p.m. si no se cerró antes de forma manual.</small></div>
        <Switch on={turnoApoyoHabilitado} onClick={toggleTurnoApoyo}/>
      </div>
    </div>}

    <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Agentes en pausa · tiempo acumulado hoy</div>
      <div className="tbl-wrap scroll-y"><table>
        <thead><tr><th>Agente</th><th>Estado actual</th><th>En curso</th><th>Sesión (login)</th><th>Baño</th><th>Break</th><th>Comida</th><th>Capacitación</th><th>Personal</th><th>Retroalim.</th></tr></thead>
        <tbody>{[...agentes].sort((a,b)=>{
          const rank=u=>{
            const cur=u.opStatus||"Activo";
            if(cur==="Activo") return 0;
            const acumulado=liveTotal(dailyLog,u,STATUS_FIELD[cur],now);
            const nivel=nivelTiempo(acumulado,limites[cur]);
            return nivel==="danger"?2:nivel==="warn"?1:0;
          };
          return rank(b)-rank(a);
        }).map(a=>{
          const cur=a.opStatus||"Activo";
          const enPausaAhora=cur!=="Activo";
          const acumuladoCur=enPausaAhora?liveTotal(dailyLog,a,STATUS_FIELD[cur],now):0;
          const nivelCur=enPausaAhora?nivelTiempo(acumuladoCur,limites[cur]):null;
          return (
            <tr key={a.id} style={enPausaAhora?{background:"var(--surface-2)"}:null}>
              <td><b>{a.nombre}</b> <span className="tag">{a.turno}</span></td>
              <td><Pill kind={opPill(cur)}>{cur}</Pill></td>
              <td className="mono" style={estiloNivel(nivelCur)}>{enPausaAhora?fmtLong(acumuladoCur):"—"}</td>
              <td className="mono">{fmtLong(liveTotal(dailyLog,a,"loginSec",now))}</td>
              {AUX_COLS.map(([label,field])=>{
                const total=liveTotal(dailyLog,a,field,now);
                const nivel=nivelTiempo(total,limites[label]);
                return <td key={field} className="mono" style={estiloNivel(nivel)}>{fmtLong(total)}</td>;
              })}
            </tr>);
        })}
        </tbody></table></div>
      <small className="muted" style={{display:"block",marginTop:8}}>El tiempo de cada auxiliar es acumulativo durante el día: si el agente lo detiene y lo retoma más tarde, continúa donde quedó. El tiempo de sesión avanza mientras el agente está logeado y se detiene automáticamente al cerrar sesión. Los agentes en amarillo (80% del límite) o rojo (límite excedido) aparecen primero. Esta tabla muestra el acumulado de hoy; para otras fechas usa el reporte por período más abajo.</small>
    </div>

    <ReportePeriodo ctx={ctx} agentes={agentes}/>

    <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div className="grow"><div className="section-title" style={{margin:0}}>Control de llamadas · todas las campañas</div><small className="muted">Pausar impide iniciar nuevas llamadas en cualquier campaña; las que estén en curso pueden finalizarse.</small></div>
        <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontWeight:600,fontSize:13}}>{pausa?"Nuevas llamadas en pausa":"Nuevas llamadas activas"}</span><Switch on={!pausa} disabled={!can.pausar} onClick={()=>{const nueva=!pausa;setPausa(nueva);registrarAccion(session.id,nueva?"pausar_global":"reanudar_global",`${session.nombre} ${nueva?"pausó":"reanudó"} las llamadas en todas las campañas`);notify(pausa?"Llamadas reanudadas para todas las campañas":"Nuevas llamadas en pausa para todas las campañas");}}/></div>
      </div>
    </div>
    <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Control de llamadas · campaña específica</div>
      {campEnCurso.length===0 ? <div className="empty" style={{padding:14}}>No hay campañas en curso.</div> : <>
        <div className="row" style={{gap:12,alignItems:"center",flexWrap:"wrap"}}>
          <select className="input" style={{width:"auto"}} value={campPausaSel} onChange={e=>setCampPausaSel(e.target.value)}>
            {campEnCurso.map(c=><option key={c.id} value={c.id}>{c.titulo}</option>)}
          </select>
          <span style={{fontWeight:600,fontSize:13}}>{campSel&&campSel.pausada?"Pausada":"Activa"}</span>
          <Switch on={!(campSel&&campSel.pausada)} disabled={!can.pausar} onClick={toggleCampPausa}/>
        </div>
        <small className="muted" style={{display:"block",marginTop:8}}>Pausar una campaña específica no afecta a las demás campañas en curso.</small>
      </>}
    </div>
    <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Agentes · skill, turno, disponibilidad y habilitaciones</div>
      <div className="tbl-wrap"><table>
        <thead><tr><th>Agente</th><th>Skill</th><th>Turno</th><th>Disponible</th><th>Fuera de turno</th><th>Llamadas</th><th>Estatus</th></tr></thead>
        <tbody>{agentes.map(a=>{const enPausaAcc=fmtLong(liveTotal(dailyLog,a,"banoSec",now)+liveTotal(dailyLog,a,"breakSec",now)+liveTotal(dailyLog,a,"comidaSec",now)+liveTotal(dailyLog,a,"capacitacionSec",now)+liveTotal(dailyLog,a,"personalSec",now)+liveTotal(dailyLog,a,"retroalimentacionSec",now));return(
          <tr key={a.id}>
            <td><b>{a.nombre}</b><div className="mini">pausas hoy: {enPausaAcc}</div></td>
            <td><div className="seg">{["Outbound","Inbound","SDP"].map(sk=><button key={sk} className={(a.skill||"Outbound")===sk?"on":""} disabled={!can.equipo} onClick={()=>upd(a.id,{skill:sk})}>{sk}</button>)}</div></td>
            <td><div className="seg">{(turnoApoyoHabilitado?["AM","PM","Apoyo"]:["AM","PM"]).map(t=><button key={t} className={a.turno===t?"on":""} disabled={!can.equipo} onClick={()=>upd(a.id,{turno:t})}>{t}</button>)}</div></td>
            <td><Switch on={a.disponible!==false} disabled={!can.equipo} onClick={()=>upd(a.id,{disponible:a.disponible===false})}/></td>
            <td><Switch on={!!a.habilitadoFueraTurno} disabled={!can.equipo} onClick={()=>upd(a.id,{habilitadoFueraTurno:!a.habilitadoFueraTurno})}/></td>
            <td><Switch on={a.habilitadoLlamadas!==false} disabled={!can.equipo} onClick={()=>upd(a.id,{habilitadoLlamadas:a.habilitadoLlamadas===false})}/></td>
            <td><Pill kind={opPill(a.opStatus)}>{a.opStatus||"Activo"}</Pill></td>
          </tr>);})}
        </tbody></table></div>
      <small className="muted" style={{display:"block",marginTop:8}}>Los agentes Outbound pueden llamar por defecto (turno actual: <b>{shiftNow()}</b>). Un agente fuera de su turno debe habilitarse aquí. Marcar «No disponible» lo excluye de llamadas y de nuevas asignaciones. El skill <b>Inbound</b> no recibe llamadas de campaña, pero puede editar cualquier centro desde «Consulta y edición», sin importar quién sea el agente asignado. El skill <b>SDP</b> no recibe llamadas de campaña ni puede registrar actividades.</small>
    </div>
  </div>);
}

/* ---- Reporte de tiempos por período (login, baño, break, comida) con exportación a Excel ---- */
function ReportePeriodo({ctx,agentes}){
  const {dailyLog,users}=ctx;
  const now=useNow();
  const hoy=dayKey();
  const [desde,setDesde]=useState(addDays(hoy,-6));
  const [hasta,setHasta]=useState(hoy);
  const campos=DAILY_FIELDS; // loginSec + los 6 auxiliares

  const fechas=useMemo(()=>{ if(desde>hasta) return []; return datesBetween(desde,hasta); },[desde,hasta]);

  // filas: agente x fecha, con el valor "en vivo" cuando la fecha es hoy
  const filas=useMemo(()=>{
    const out=[];
    agentes.forEach(a=>{
      fechas.forEach(f=>{
        const e=getDailyEntry(dailyLog,a.id,f);
        const esHoy=f===hoy;
        const row={agentId:a.id,nombre:a.nombre,fecha:f,primerLoginMs:e.primerLoginMs||null,ultimoLogoutMs:e.ultimoLogoutMs||null};
        campos.forEach(c=>{ row[c]= esHoy? liveTotal(dailyLog,a,c,now) : (e[c]||0); });
        out.push(row);
      });
    });
    return out;
  },[agentes,fechas,dailyLog,hoy,now]);

  const totalesPorAgente=useMemo(()=>{
    const m={};
    filas.forEach(r=>{ const t=(m[r.agentId]=m[r.agentId]||{nombre:r.nombre,...Object.fromEntries(campos.map(c=>[c,0]))});
      campos.forEach(c=>t[c]+=r[c]); });
    return Object.values(m);
  },[filas]);

  const granTotal=totalesPorAgente.reduce((acc,t)=>{const o={...acc};campos.forEach(c=>o[c]=(acc[c]||0)+t[c]);return o;},Object.fromEntries(campos.map(c=>[c,0])));

  const exportarExcel=()=>{
    if(typeof XLSX==="undefined") return;
    const headers=["Agente","Fecha","Primer login","Último logout",...campos.map(c=>FIELD_LABEL[c]+" (HH:MM:SS)")];
    const rows=[headers];

    <div className="tbl-wrap scroll-y" style={{maxHeight:420,marginTop:12}}>

        <tbody>
          {agentes.map(a=>{

            return (<React.Fragment key={a.id}>

/* ============================ DASHBOARD DE AVANCE ============================ */
function Dashboard({ctx}){
  const {campaigns,records,users,filtro}=ctx;
  const camps=campaigns.filter(c=>overlaps(c.fechaDesde,c.fechaHasta,filtro.desde,filtro.hasta));
  const [campId,setCampId]=useState("all");
  useEffect(()=>{ if(campId!=="all" && !camps.some(c=>c.id===campId)) setCampId("all"); },[filtro.desde,filtro.hasta,campaigns.length]);

  if(camps.length===0) return <div className="card card-pad"><div className="empty"><div className="big">📊</div>No hay campañas para {rangeLabel(filtro.desde,filtro.hasta)}.<br/>Crea una campaña para ver su avance.</div></div>;

  const scope = campId==="all" ? camps : camps.filter(c=>c.id===campId);
  const items=[];
  scope.forEach(c=>{const asg=getAssign(c);c.schoolCodes.forEach(code=>{const rec=records.find(r=>r.campaignId===c.id&&r.codigo===code);items.push({agentId:asg[code],estado:rec?rec.estado:"Pendiente",cerrado:estaCerrado(rec)});});});
  const asignadas=items.length;
  const completadas=items.filter(x=>x.estado==="Contactado").length;
  const cerradas=items.filter(x=>x.cerrado).length; // agotó intentos, o todos los teléfonos quedaron equivocados
  const pendientes=Math.max(0,asignadas-completadas-cerradas);
  const enAvance=items.filter(x=>x.estado!=="Pendiente").length; // Contactado, No contestó, Número equivocado, Llamar nuevamente o Cerrado por no contacto
  const pct=asignadas?Math.round(enAvance/asignadas*100):0; // % de avance = todo lo gestionado, no solo lo contactado con éxito
  const pctCompletadas=asignadas?Math.round(completadas/asignadas*100):0;

  const byAgent={};
  items.forEach(x=>{
    const id=x.agentId||"—";
    (byAgent[id]=byAgent[id]||{asig:0,contactado:0,noContesto:0,numEquivocado:0,llamarNuevamente:0,cerrado:0,avance:0});
    const b=byAgent[id];
    b.asig++;
    if(x.estado==="Contactado") b.contactado++;
    else if(x.estado==="No contestó") b.noContesto++;
    else if(x.estado==="Número equivocado") b.numEquivocado++;
    else if(x.estado==="Llamar nuevamente") b.llamarNuevamente++;
    else if(x.estado==="Cerrado por no contacto") b.cerrado++;
    if(x.estado!=="Pendiente") b.avance++;
  });
  const agentName=id=>(users.find(u=>u.id===id)||{}).nombre||"Sin asignar";
  const agentRows=Object.entries(byAgent).map(([id,v])=>({id,nombre:agentName(id),...v,pct:v.asig?Math.round(v.avance/v.asig*100):0})).sort((a,b)=>b.pct-a.pct);

  const noContestoTotal=scope.reduce((acc,c)=>acc+records.filter(r=>r.campaignId===c.id&&r.estado==="No contestó").length,0);

  return (<div className="grid">
    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <div className="grow"><div className="section-title" style={{margin:0}}>Avance de campañas</div><small className="muted">{rangeLabel(filtro.desde,filtro.hasta)}</small></div>
      <select className="input" style={{width:"auto"}} value={campId} onChange={e=>setCampId(e.target.value)}>
        <option value="all">Todas las campañas del rango ({camps.length})</option>
        {camps.map(c=><option key={c.id} value={c.id}>{c.titulo}</option>)}
      </select>
    </div>

    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))"}}>
      <Stat k="Escuelas asignadas" v={asignadas} c="var(--navy-2)"/>
      <Stat k="En avance" v={enAvance} c="var(--info)" meta={pct+"% del total"}/>
      <Stat k="Completadas" v={completadas} c="var(--success)" meta={pctCompletadas+"% del total"}/>
      <Stat k="Pendientes" v={pendientes} c="var(--warn)"/>
      <Stat k="No contestó" v={noContestoTotal} c="var(--danger)"/>
      <Stat k="Cerradas sin contacto" v={cerradas} c="var(--neutral)"/>
    </div>

    <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Avance general</div>
      <Donut segments={[{label:"Completadas",value:completadas,color:"#0f9d58"},{label:"Pendientes",value:pendientes,color:"#f2a900"},{label:"Cerradas",value:cerradas,color:"#d9342b"}]}/>
      <div className="bar-track" style={{marginTop:16}}><div className="bar-fill" style={{width:pct+"%",background:"var(--success)"}}/></div>
      <small className="muted" style={{display:"block",marginTop:6}}>{pct}% de avance (Contactado, No contestó, Número equivocado, Llamar nuevamente o Cerrado por no contacto) en {scope.length} campaña(s).</small>
    </div>

    <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Porcentaje de avance por agente</div>
      <small className="muted" style={{display:"block",marginBottom:10}}>«No contestó» y «Número equivocado» todavía tienen intentos disponibles; «Cerrado por no contacto» ya agotó el máximo de intentos sin lograr contacto.</small>
      {agentRows.length===0?<div className="empty">Sin agentes en el alcance.</div>:
      <div className="tbl-wrap scroll-y"><table>
        <thead><tr><th>Agente</th><th>Asignadas</th><th>No contestó</th><th>Número equivocado</th><th>Llamar nuevamente</th><th>Contactado</th><th>Cerrado por no contacto</th><th>Avance</th></tr></thead>
        <tbody>{agentRows.map(a=>(
          <tr key={a.id}>
            <td><b>{a.nombre}</b></td>
            <td className="mono">{a.asig}</td>
            <td className="mono">{a.noContesto}</td>
            <td className="mono">{a.numEquivocado}</td>
            <td className="mono">{a.llamarNuevamente}</td>
            <td className="mono">{a.contactado}</td>
            <td className="mono">{a.cerrado}</td>
            <td style={{minWidth:170}}><div style={{display:"flex",alignItems:"center",gap:8}}>
              <div className="bar-track grow"><div className="bar-fill" style={{width:a.pct+"%",background:a.pct>=100?"var(--success)":"var(--navy-2)"}}/></div>
              <b className="mono" style={{width:40,textAlign:"right"}}>{a.pct}%</b></div></td>
          </tr>))}
        </tbody></table></div>}
    </div>

    {scope.length===1 && scope[0].preguntas && scope[0].preguntas.length>0 && <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Respuestas por pregunta · {scope[0].titulo}</div>
      {(()=>{ const acts=records.filter(r=>r.campaignId===scope[0].id).flatMap(r=>r.actividades||[]); return scope[0].preguntas.map(q=>(
        <div key={q.id} style={{marginBottom:16}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>{q.texto} <span className="tag">{qTipoLabel(q.tipo)}</span></div>
          {q.tipo==="combinacion"
            ? (q.partes||[]).map((p)=>(
                <div key={p.id} style={{marginBottom:10}}>
                  <small className="muted" style={{display:"block",marginBottom:4}}>{p.label||p.id}</small>
                  <Bars rows={contarActividades(acts,q,p.id)}/>
                </div>))
            : <Bars rows={contarActividades(acts,q)}/>}
        </div>
      )); })()}
    </div>}
  </div>);
}

/* ============================ AGENDA SEMANAL DIRECTORES ============================
   Alimentado por cualquier campaña etiquetada como "Agenda semanal directores".
   Lee las respuestas por el id fijo de cada pregunta estándar (ver PREGUNTAS_AGENDA_DIRECTORES),
   así que solo funciona correctamente si la campaña conserva esos ids. */
const ETIQUETA_AGENDA_DIRECTORES="Agenda semanal directores";
/* quita acentos y pasa a minúsculas, para poder emparejar por texto sin importar mayúsculas/tildes */
function _normLbl(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
/* lee los datos de UN bloque "Actividad N" (una pregunta tipo Combinación), buscando cada dato por
   el TEXTO de su sub-pregunta — no por un id fijo. Así funciona con cualquier campaña real ya
   construida a mano, sin importar cuántos bloques de actividad tenga (se pueden duplicar y seguir
   agregando más desde el editor de preguntas, y este módulo los sigue leyendo igual). */
function extraerActividadAgenda(q,actividadObj){
  if(!actividadObj||typeof actividadObj!=="object"||Object.keys(actividadObj).length===0) return null;
  const partes=q.partes||[];
  const buscar=(...palabrasClave)=>partes.find(p=>{const l=_normLbl(p.label);return palabrasClave.some(k=>l.includes(k));});
  const pTipo=partes.find(p=>{const l=_normLbl(p.label);return l.includes("tipo de actividad")&&!l.includes("otro");}) || buscar("tipo de actividad");
  const pTipoOtro=partes.find(p=>{const l=_normLbl(p.label);return l.includes("tipo de actividad")&&l.includes("otro");});
  const pFecha=buscar("fecha");
  const pHora=buscar("hora");
  const pSuspension=buscar("suspension"); // "Suspensión de clases?" (Sin suspensión / Parcial / Total)
  const pAfecta=buscar("afecta clases","afecta a clases","afecta asistencia");
  const pInvolucrados=buscar("involucrad");
  const pParticipantes=buscar("participante");
  const pObs=buscar("observacion");

  let tipoActividad=pTipo?(actividadObj[pTipo.id]||""):"";
  if(_normLbl(tipoActividad)==="otro" && pTipoOtro && actividadObj[pTipoOtro.id]) tipoActividad=actividadObj[pTipoOtro.id];

  let afectaClases="",tipoAfectacion="";
  if(pSuspension && actividadObj[pSuspension.id]){
    const susp=String(actividadObj[pSuspension.id]);
    afectaClases=_normLbl(susp).includes("sin suspension")?"No":"Sí";
    if(_normLbl(susp).includes("parcial")) tipoAfectacion="Parcial";
    else if(_normLbl(susp).includes("total")) tipoAfectacion="Total";
  } else if(pAfecta && actividadObj[pAfecta.id]!=null){
    const av=String(actividadObj[pAfecta.id]);
    afectaClases=(av&&_normLbl(av)!=="no")?"Sí":"No";
  }
  if(!tipoActividad && !(pFecha&&actividadObj[pFecha.id])) return null; // bloque sin datos = no se reportó esa actividad

  return {
    tipoActividad, fecha:pFecha?(actividadObj[pFecha.id]||""):"", hora:pHora?(actividadObj[pHora.id]||""):"",
    afectaClases, tipoAfectacion,
    involucrados:pInvolucrados?(labelDeValor(actividadObj[pInvolucrados.id])):"",
    participantes:pParticipantes?(labelDeValor(actividadObj[pParticipantes.id])):"",
    observacion:pObs?(actividadObj[pObs.id]||""):"",
  };
}
function filasAgendaDirectores(campaigns,records,schools){
  const camps=campaigns.filter(c=>c.etiqueta===ETIQUETA_AGENDA_DIRECTORES);
  const filas=[];
  camps.forEach(c=>{
    const bloques=(c.preguntas||[]).filter(q=>q.tipo==="combinacion"); // cada uno = un bloque "Actividad N"
    if(!bloques.length) return;
    c.schoolCodes.forEach(code=>{
      const rec=records.find(r=>r.campaignId===c.id&&r.codigo===code);
      if(!rec||!rec.actividades||!rec.actividades.length) return;
      const s=schools.find(x=>x.codigo===code)||{};
      rec.actividades.forEach((act,actIdx)=>{
        bloques.forEach(q=>{
          const datos=extraerActividadAgenda(q,act[q.id]);
          if(!datos) return;
          filas.push({
            key:`${rec.id}-${actIdx}-${q.id}`, campaignId:c.id, campaignTitulo:c.titulo, codigo:code, recordId:rec.id, actIdx, bloque:q.texto,
            nombre:s.nombre||"", departamento:s.departamento||"", municipio:s.municipio||"", distrito:s.distrito||"",
            agentId:rec.agentId, ...datos,
          });
        });
      });
    });
  });
  return filas;
}

    "Campaña":f.campaignTitulo,
  }));

/* "Carga SDP": exporta en el formato tabla exacto que espera el sistema SDP (Requester..Description),
   una fila por cada actividad — código de centro sin comas ni espacios, fecha en DD/MM/AAAA, y el
   texto de "Item" según si la actividad requiere suspensión de clases o no. */
function fechaDDMMAAAA(iso){
  if(!iso) return "";
  const [a,m,d]=String(iso).split("-");
  if(!a||!m||!d) return iso;
  return `${d}/${m}/${a}`;
}
function exportarCargaSDP(filas){
  if(typeof XLSX==="undefined") return;
  const filasExcel=filas.map(f=>{
    const codigoNum=/^\d+$/.test(String(f.codigo).trim())?Number(f.codigo):String(f.codigo).replace(/[\s,]/g,"");
    const item=f.afectaClases==="Sí" ? "Actividades con suspension de clases" : "Actividades sin suspension de clases";
    return {
      "Requester":codigoNum,
      "Subject":"Reportes del centro escolar || Actividades extraordinarias",
      "Category":"Reportes del centro escolar",
      "Subcategory":"Actividades extraordinarias",
      "Item":item,
      "Mode":"INTERNO",
      "Status":"Centro de Monitoreo N1",
      "Group":"CENTRO DE MONITOREO",
      "Rol de quien reporta":"Director",
      "Fecha de la actividad":fechaDDMMAAAA(f.fecha),
      "Motivo de la actividad":f.tipoActividad||"",
      "Description":f.tipoActividad||"",
    };
  });
  const ws=XLSX.utils.json_to_sheet(filasExcel);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Encabezados");
  XLSX.writeFile(wb,`Carga_masiva_Agendas_Educacion_${dayKey()}.xlsx`);
}
function exportarAgendaDirectoresPDF(filas){
