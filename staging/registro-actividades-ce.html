        {upInfo&&(upInfo.error?<div className="alert alert-err" style={{marginTop:10}}>No se pudo procesar «{upInfo.nombre}»: {upInfo.error}</div>:upInfo.cargando?<div className="alert alert-info" style={{marginTop:10}}>Procesando…</div>:<div className="alert alert-ok" style={{marginTop:10}}>«{upInfo.nombre}»: <b>{upInfo.cargados}</b> centros cargados{upInfo.omitidos>0&&<> · {upInfo.omitidos} omitidos</>}.</div>)}
      </div>}
      <div className="tag" style={{margin:"6px 0 10px",display:"inline-block"}}>{selectedSchools.length} centros seleccionados</div>
      <div className="tbl-wrap scroll-y" style={{maxHeight:320}}><table><thead><tr>{selMode==="manual"&&<th></th>}<th>Código</th><th>Centro</th><th>Depto.</th><th>Teléfonos</th></tr></thead>
        <tbody>{(selMode==="archivo"?uploaded:schools).map(s=>{const inG=selectedSchools.some(x=>x.codigo===s.codigo);if(selMode==="grupo"&&!inG)return null;return(<tr key={s.codigo}>
          {selMode==="manual"&&<td><input type="checkbox" checked={manual.includes(s.codigo)} onChange={()=>setManual(m=>m.includes(s.codigo)?m.filter(x=>x!==s.codigo):[...m,s.codigo])}/></td>}
          <td className="mono">{s.codigo}</td><td>{s.nombre}</td><td>{s.departamento}</td><td className="mono" style={{fontSize:12}}>{(s.telefonos||[]).join(" · ")}</td></tr>);})}
        </tbody></table>{selMode==="archivo"&&uploaded.length===0&&<div className="empty" style={{padding:24}}>Aún no has cargado un archivo.</div>}</div>
    </div>
    {err&&<div className="alert alert-err">{err}</div>}
  </Modal>);
}

/* ---- Reasignar CE no contactados: por agente(s) o por turno, siempre de forma equitativa ---- */
function ReassignModal({ctx,camp,onClose}){
  const {campaigns,setCampaigns,records,records:recs,setRecords,schools,users,session,notify,turnoApoyoHabilitado}=ctx;
  const [modo,setModo]=useState("agente"); // agente | turno
  const asg=getAssign(camp);
  const campAgentes=camp.agentIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
  const agentesDisponibles=users.filter(u=>u.rol==="Agente"&&u.estado==="activo"&&u.disponible!==false);

  const [origenAgentes,setOrigenAgentes]=useState(camp.agentIds); // por defecto: todos
  const [destinoAgentes,setDestinoAgentes]=useState(camp.agentIds.filter(id=>agentesDisponibles.some(a=>a.id===id)));
  const [origenTurno,setOrigenTurno]=useState("AM");
  const [destinoTurno,setDestinoTurno]=useState("PM");

  const recFor=code=>recs.find(r=>r.campaignId===camp.id&&r.codigo===code);
  const noContactado=code=>{const r=recFor(code);return !r||r.estado!=="Contactado";};

  const sourceCodes=useMemo(()=>{
    if(modo==="agente") return camp.schoolCodes.filter(code=>noContactado(code) && origenAgentes.includes(asg[code]));
    return camp.schoolCodes.filter(code=>{ if(!noContactado(code)) return false; const ag=campAgentes.find(a=>a.id===asg[code]); return ag&&ag.turno===origenTurno; });
  },[modo,origenAgentes,origenTurno,camp.schoolCodes,recs]);

  const destinoIds=useMemo(()=>{
    if(modo==="agente") return destinoAgentes;
    return agentesDisponibles.filter(a=>a.turno===destinoTurno).map(a=>a.id);
  },[modo,destinoAgentes,destinoTurno,agentesDisponibles]);

  const [selected,setSelected]=useState(sourceCodes);
  useEffect(()=>{ setSelected(sourceCodes); },[JSON.stringify(sourceCodes)]);

  const toggleCode=code=>setSelected(p=>p.includes(code)?p.filter(x=>x!==code):[...p,code]);
  const toggleOrigenAgente=id=>setOrigenAgentes(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleDestinoAgente=id=>setDestinoAgentes(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);

  const perAgent=destinoIds.length?Math.floor(selected.length/destinoIds.length):0;
  const resto=destinoIds.length?selected.length%destinoIds.length:0;
  const agName=id=>(users.find(u=>u.id===id)||{}).nombre||"—";

  const guardar=async()=>{
    if(selected.length===0) return notify("No hay centros seleccionados para reasignar.","err");
    if(destinoIds.length===0) return notify("Selecciona al menos un agente destino.","err");
    const nuevoParcial=buildAssign(selected,destinoIds);
    const agentIdsNuevos=[...new Set([...camp.agentIds,...destinoIds])];
    setCampaigns(p=>p.map(c=>{
      if(c.id!==camp.id) return c;
      return {...c,agentIds:agentIdsNuevos,assign:{...getAssign(c),...nuevoParcial}};
    }));
    setRecords(p=>p.map(r=> (r.campaignId===camp.id && selected.includes(r.codigo)) ? {...r,agentId:nuevoParcial[r.codigo]||r.agentId} : r));
    if(supabase){
      await agregarAgentesACampanaDB(camp.id,agentIdsNuevos);
      await actualizarRegistrosMasivoDB(camp.id,selected.map(codigo=>({codigo,agentId:nuevoParcial[codigo]})));
    }
    notify(`Reasignados ${selected.length} centro(s) entre ${destinoIds.length} agente(s), de forma equitativa.`);
    registrarAccion(session.id,"reasignar",`${session.nombre} reasignó ${selected.length} centro(s) de «${camp.titulo}» entre ${destinoIds.length} agente(s)`);
    onClose();
  };

  return (<Modal title={`Reasignar centros no contactados · ${camp.titulo}`} onClose={onClose} wide foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={guardar} disabled={!selected.length||!destinoIds.length}>Guardar reasignación</button></>}>
    <p style={{color:"var(--text-dim)",marginTop:0}}>Solo se reasignan los centros <b>no contactados</b>. La distribución entre los agentes destino siempre es equitativa. Los registros ya capturados se conservan.</p>

    <div className="seg" style={{marginBottom:14}}>
      <button className={modo==="agente"?"on":""} onClick={()=>setModo("agente")}>Por agente</button>
      <button className={modo==="turno"?"on":""} onClick={()=>setModo("turno")}>Por turno</button>
    </div>

    {modo==="agente" ? (<div className="row" style={{gap:20,alignItems:"flex-start"}}>
      <div className="grow">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <b style={{fontSize:13}}>Desde</b>
          <button className="link" onClick={()=>setOrigenAgentes(origenAgentes.length===camp.agentIds.length?[]:camp.agentIds)}>{origenAgentes.length===camp.agentIds.length?"Ninguno":"Todos los agentes"}</button>
        </div>
        <div className="card" style={{maxHeight:220,overflow:"auto"}}>{campAgentes.map(a=>(
          <label key={a.id} className="checkline" style={{padding:"8px 12px"}}>
            <input type="checkbox" checked={origenAgentes.includes(a.id)} onChange={()=>toggleOrigenAgente(a.id)}/>
            <span className="grow">{a.nombre} <span className="tag">{a.turno}</span></span>
          </label>))}
        </div>
      </div>
      <div className="grow">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <b style={{fontSize:13}}>Hacia</b>
          <button className="link" onClick={()=>setDestinoAgentes(destinoAgentes.length===agentesDisponibles.length?[]:agentesDisponibles.map(a=>a.id))}>{destinoAgentes.length===agentesDisponibles.length?"Ninguno":"Todos los agentes disponibles"}</button>
        </div>
        <div className="card" style={{maxHeight:220,overflow:"auto"}}>{agentesDisponibles.map(a=>{const otras=otrasCampanasActivas(a.id,campaigns,camp.id);return(
          <label key={a.id} className="checkline" style={{padding:"8px 12px"}}>
            <input type="checkbox" checked={destinoAgentes.includes(a.id)} onChange={()=>toggleDestinoAgente(a.id)}/>
            <span className="grow">{a.nombre} <span className="tag">{a.turno}</span>
              {otras.length>0 && <span className="tag" style={{color:"var(--warn)",marginLeft:6}} title={otras.map(c=>c.titulo).join(", ")}>📌 {otras.length===1?otras[0].titulo:`${otras.length} bases activas`}</span>}
            </span>
          </label>);})}
        </div>
      </div>
    </div>) : (<div className="row" style={{gap:20}}>
      <div><b style={{fontSize:13,display:"block",marginBottom:6}}>Desde el turno</b>
        <div className="seg">{(turnoApoyoHabilitado?["AM","PM","Apoyo"]:["AM","PM"]).map(t=><button key={t} className={origenTurno===t?"on":""} onClick={()=>setOrigenTurno(t)}>{t}</button>)}</div></div>
      <div><b style={{fontSize:13,display:"block",marginBottom:6}}>Hacia el turno</b>
        <div className="seg">{(turnoApoyoHabilitado?["AM","PM","Apoyo"]:["AM","PM"]).map(t=><button key={t} className={destinoTurno===t?"on":""} onClick={()=>setDestinoTurno(t)}>{t}</button>)}</div></div>
    </div>)}

    <div className="divider"/>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
      <div className="grow"><b style={{fontSize:13}}>Centros elegibles (no contactados): {sourceCodes.length}</b><br/><small className="muted">Por defecto se reasignan todos; des-selecciona los que no quieras mover.</small></div>
      <button className="link" onClick={()=>setSelected(sourceCodes)}>Seleccionar todos</button>
      <button className="link" onClick={()=>setSelected([])}>Ninguno</button>
    </div>
    <div className="tbl-wrap scroll-y" style={{maxHeight:260}}><table>
      <thead><tr><th></th><th>Código</th><th>Centro</th><th>Agente actual</th><th>Estado</th></tr></thead>
      <tbody>{sourceCodes.map(code=>{const s=schools.find(x=>x.codigo===code);if(!s)return null;const r=recFor(code);return(
        <tr key={code}>
          <td><input type="checkbox" checked={selected.includes(code)} onChange={()=>toggleCode(code)}/></td>
          <td className="mono">{code}</td><td>{s.nombre}</td><td>{agName(asg[code])}</td>
          <td><Pill kind={statePill(r?r.estado:"Pendiente")}>{r?r.estado:"Pendiente"}</Pill></td>
        </tr>);})}
      {sourceCodes.length===0&&<tr><td colSpan={5}><div className="empty" style={{padding:18}}>No hay centros no contactados con esta selección de origen.</div></td></tr>}
      </tbody></table></div>

    {selected.length>0 && destinoIds.length>0 && <div className="card card-pad" style={{marginTop:14}}>
      <div className="section-title" style={{marginTop:0}}>Distribución equitativa</div>
      <p style={{margin:0,color:"var(--text-dim)"}}>Cada agente destino recibirá <b>{perAgent}</b> centros{resto>0&&<> y los primeros <b>{resto}</b> recibirán uno adicional</>}.</p>
      <div className="legend" style={{marginTop:10}}>{destinoIds.map((id,i)=><span key={id}><i style={{background:PALETTE[i%PALETTE.length]}}/>{agName(id)}: <b className="mono">{perAgent+(i<resto?1:0)}</b></span>)}</div>
    </div>}
  </Modal>);
}

/* ---- Gestionar centros cerrados por no contacto: reactivar o reasignar, uno a uno o en lote ---- */
function CerradosModal({ctx,camp,onClose}){
  const {campaigns,records,setRecords,setCampaigns,schools,users,session,notify}=ctx;
  const asg=getAssign(camp);
  const agName=id=>(users.find(u=>u.id===id)||{}).nombre||"—";
  const cerrados=camp.schoolCodes.filter(code=>{const r=records.find(rr=>rr.campaignId===camp.id&&rr.codigo===code);return estaCerrado(r);});
  const [selected,setSelected]=useState(cerrados);
  useEffect(()=>{ setSelected(cerrados); },[JSON.stringify(cerrados)]);
  const agentesCamp=camp.agentIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
  const [destinoAgentes,setDestinoAgentes]=useState(camp.agentIds);

  const reactivarCodes=codes=>{
    setRecords(p=>p.map(r=>(r.campaignId===camp.id&&codes.includes(r.codigo))?{...r,estado:"Pendiente",intentos:0,wrong:[],cerrado:false}:r));
    if(supabase) actualizarRegistrosPorCodigosDB(camp.id,codes,{estado:"Pendiente",intentos:0,wrong:[],cerrado:false});
  };
  const reactivarUno=code=>{ reactivarCodes([code]); registrarAccion(session.id,"reactivar_cerrados",`${session.nombre} reactivó el centro ${code} en «${camp.titulo}»`); notify("Centro reactivado."); };
  const reactivarSeleccionados=()=>{ if(!selected.length) return; reactivarCodes(selected); registrarAccion(session.id,"reactivar_cerrados",`${session.nombre} reactivó ${selected.length} centro(s) en «${camp.titulo}»`); notify(`${selected.length} centro(s) reactivado(s).`); };

  const reasignarUno=(code,nuevoAgente)=>{
    if(!nuevoAgente) return;
    setCampaigns(p=>p.map(c=>c.id===camp.id?{...c,assign:{...getAssign(c),[code]:nuevoAgente}}:c));
    setRecords(p=>p.map(r=>(r.campaignId===camp.id&&r.codigo===code)?{...r,agentId:nuevoAgente,estado:"Pendiente",intentos:0,wrong:[],cerrado:false}:r));
    if(supabase) upsertRegistroDB(camp.id,code,{agentId:nuevoAgente,estado:"Pendiente",intentos:0,wrong:[],cerrado:false});
    registrarAccion(session.id,"reasignar",`${session.nombre} reasignó el centro cerrado ${code} en «${camp.titulo}»`);
    notify("Centro reasignado y reactivado.");
  };

  const toggleCode=code=>setSelected(p=>p.includes(code)?p.filter(x=>x!==code):[...p,code]);
  const toggleAgente=id=>setDestinoAgentes(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const perAgent=destinoAgentes.length?Math.floor(selected.length/destinoAgentes.length):0;
  const resto=destinoAgentes.length?selected.length%destinoAgentes.length:0;

  const reasignarSeleccionados=async()=>{
    if(!selected.length) return notify("No hay centros seleccionados.","err");
    if(!destinoAgentes.length) return notify("Selecciona al menos un agente destino.","err");
    const nuevoParcial=buildAssign(selected,destinoAgentes);
    setCampaigns(p=>p.map(c=>c.id===camp.id?{...c,assign:{...getAssign(c),...nuevoParcial}}:c));
    setRecords(p=>p.map(r=>(r.campaignId===camp.id&&selected.includes(r.codigo))?{...r,agentId:nuevoParcial[r.codigo],estado:"Pendiente",intentos:0,wrong:[],cerrado:false}:r));
    if(supabase) await actualizarRegistrosMasivoDB(camp.id,selected.map(codigo=>({codigo,agentId:nuevoParcial[codigo],estado:"Pendiente",intentos:0,wrong:[],cerrado:false})));
    registrarAccion(session.id,"reasignar",`${session.nombre} reasignó ${selected.length} centro(s) cerrado(s) en «${camp.titulo}»`);
    notify(`${selected.length} centro(s) reasignado(s) y reactivado(s) de forma equitativa.`);
    onClose();
  };

  return (<Modal title={`Centros cerrados por no contacto · ${camp.titulo}`} onClose={onClose} wide foot={<button className="btn btn-ghost" onClick={onClose}>Cerrar</button>}>
    <p style={{color:"var(--text-dim)",marginTop:0}}>Estos centros ya están cerrados: agotaron el máximo de intentos sin contactar, o todos sus teléfonos quedaron marcados como equivocados. Puedes <b>reactivarlos</b> (vuelven a la bandeja con el mismo agente) o <b>reasignarlos</b> a otro agente (se reactivan automáticamente al reasignar).</p>

    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
      <div className="grow"><b style={{fontSize:13}}>Centros cerrados: {cerrados.length}</b></div>
      <button className="link" onClick={()=>setSelected(cerrados)}>Seleccionar todos</button>
      <button className="link" onClick={()=>setSelected([])}>Ninguno</button>
    </div>

    <div className="tbl-wrap scroll-y" style={{maxHeight:280}}><table>
      <thead><tr><th></th><th>Código</th><th>Centro</th><th>Agente actual</th><th>Intentos</th><th></th></tr></thead>
      <tbody>{cerrados.map(code=>{
        const s=schools.find(x=>x.codigo===code); if(!s) return null;
        const r=records.find(rr=>rr.campaignId===camp.id&&rr.codigo===code);
        return (<tr key={code}>
          <td><input type="checkbox" checked={selected.includes(code)} onChange={()=>toggleCode(code)}/></td>
          <td className="mono">{code}</td><td>{s.nombre}</td><td>{agName(asg[code])}</td>
          <td className="mono">{r?r.intentos:0}</td>
          <td style={{whiteSpace:"nowrap"}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>reactivarUno(code)}>Reactivar</button>
            <select className="input" style={{width:"auto",marginLeft:6,padding:"5px 8px"}} defaultValue="" onChange={e=>{const v=e.target.value;e.target.value="";reasignarUno(code,v);}}>
              <option value="" disabled>Reasignar a…</option>
              {agentesCamp.map(a=>{const otras=otrasCampanasActivas(a.id,campaigns,camp.id);return <option key={a.id} value={a.id}>{a.nombre}{otras.length>0?` (📌 ${otras.length===1?otras[0].titulo:otras.length+" bases activas"})`:""}</option>;})}
            </select>
          </td>
        </tr>);
      })}
      {cerrados.length===0 && <tr><td colSpan={6}><div className="empty" style={{padding:18}}>No hay centros cerrados por no contacto.</div></td></tr>}
      </tbody></table></div>

    <div className="divider"/>
    <button className="btn btn-primary btn-sm" onClick={reactivarSeleccionados} disabled={!selected.length}>Reactivar seleccionados ({selected.length})</button>

    <div className="card card-pad" style={{marginTop:14,background:"var(--surface-2)"}}>
      <div className="section-title" style={{marginTop:0}}>Reasignar seleccionados hacia…</div>
      <div className="card" style={{maxHeight:160,overflow:"auto"}}>{agentesCamp.map(a=>{const otras=otrasCampanasActivas(a.id,campaigns,camp.id);return(
        <label key={a.id} className="checkline" style={{padding:"8px 12px"}}>
          <input type="checkbox" checked={destinoAgentes.includes(a.id)} onChange={()=>toggleAgente(a.id)}/>
          <span className="grow">{a.nombre} <span className="tag">{a.turno}</span>
            {otras.length>0 && <span className="tag" style={{color:"var(--warn)",marginLeft:6}} title={otras.map(c=>c.titulo).join(", ")}>📌 {otras.length===1?otras[0].titulo:`${otras.length} bases activas`}</span>}
          </span>
        </label>);})}
      </div>
      {selected.length>0 && destinoAgentes.length>0 && <p style={{margin:"10px 0 0",color:"var(--text-dim)",fontSize:13}}>Se repartirán equitativamente: {destinoAgentes.map((id,i)=>`${agName(id)}: ${perAgent+(i<resto?1:0)}`).join(" · ")}</p>}
      <button className="btn btn-accent btn-sm" style={{marginTop:10}} onClick={reasignarSeleccionados} disabled={!selected.length||!destinoAgentes.length}>Reasignar seleccionados equitativamente</button>
    </div>
  </Modal>);
}

/* ---- Editor de preguntas de campaña: crear, duplicar, reordenar y condicionar (reutilizable en creación y edición) ---- */
function PreguntasBuilder({preguntas,setPreguntas}){
  const addQ=()=>setPreguntas(p=>[...p,blankPregunta(p)]);
  const duplicarQ=i=>setPreguntas(p=>{
    const copia=JSON.parse(JSON.stringify(p[i]));
    copia.id=nextId(p,"q");
    const arr=[...p];arr.splice(i+1,0,copia);return sanitizeConditions(arr);
  });
  const updQ=(i,patch)=>setPreguntas(p=>p.map((q,j)=>j===i?{...q,...patch}:q));
  const setTipoPregunta=(i,nuevoTipo)=>{
    const q=preguntas[i];const patch={tipo:nuevoTipo};
    if(nuevoTipo==="sino" && !q.opcionesFinaliza) patch.opcionesFinaliza={Sí:false,No:false};
    updQ(i,patch);
  };
  const delQ=i=>setPreguntas(p=>sanitizeConditions(p.filter((_,j)=>j!==i)));
  const moveQ=(i,dir)=>setPreguntas(p=>{
    const j=i+dir; if(j<0||j>=p.length) return p;
    const arr=[...p]; [arr[i],arr[j]]=[arr[j],arr[i]];
    return sanitizeConditions(arr);
  });
  const addOpcion=i=>updQ(i,{opciones:[...preguntas[i].opciones,blankOpcion()]});
  const updOpcion=(i,k,patch)=>updQ(i,{opciones:preguntas[i].opciones.map((o,oi)=>oi===k?{...o,...patch}:o)});
  const addParte=i=>updQ(i,{partes:[...(preguntas[i].partes||[]),blankParte(preguntas[i].partes)]});
  const duplicarParte=(i,pi)=>setPreguntas(p=>{
    const partes=p[i].partes;
    const copia=JSON.parse(JSON.stringify(partes[pi]));
    copia.id=nextId(partes,"p");
    const nuevasPartes=[...partes];nuevasPartes.splice(pi+1,0,copia);
    const arr=p.map((q,j)=>j===i?{...q,partes:nuevasPartes}:q);
    return sanitizeConditions(arr);
  });
  const updParte=(i,pi,patch)=>updQ(i,{partes:preguntas[i].partes.map((p,k)=>k===pi?{...p,...patch}:p)});
  const setTipoParte=(i,pi,nuevoTipo)=>{
    const p=preguntas[i].partes[pi];const patch={tipo:nuevoTipo};
    if(nuevoTipo==="sino" && !p.opcionesFinaliza) patch.opcionesFinaliza={Sí:false,No:false};
    updParte(i,pi,patch);
  };
  const delParte=(i,pi)=>setPreguntas(p=>sanitizeConditions(p.map((q,j)=>j===i?{...q,partes:q.partes.filter((_,k)=>k!==pi)}:q)));
  const moveParte=(i,pi,dir)=>setPreguntas(p=>{
    const partes=p[i].partes; const pj=pi+dir; if(pj<0||pj>=partes.length) return p;
    const nuevasPartes=[...partes]; [nuevasPartes[pi],nuevasPartes[pj]]=[nuevasPartes[pj],nuevasPartes[pi]];
    const arr=p.map((q,j)=>j===i?{...q,partes:nuevasPartes}:q);
    return sanitizeConditions(arr);
  });
  const updParteOpcion=(i,pi,k,patch)=>updQ(i,{partes:preguntas[i].partes.map((p,j)=>j===pi?{...p,opciones:p.opciones.map((o,oi)=>oi===k?{...o,...patch}:o)}:p)});
  const addParteOpcion=(i,pi)=>updQ(i,{partes:preguntas[i].partes.map((p,j)=>j===pi?{...p,opciones:[...p.opciones,blankOpcion()]}:p)});

  return (<div>
    <small className="muted">Define cada pregunta, su tipo de respuesta y sus opciones. Puedes indicar, por opción, un <b>valor a reportar</b> distinto al que ve el agente (para normalizar el dato en reportes y exportaciones). Una pregunta puede mostrarse solo si una pregunta previa (Sí/No, selección múltiple o lista desplegable) tuvo o no tuvo cierta respuesta. Puedes duplicar y reordenar preguntas y sub-preguntas; al reordenar, las condiciones que ya no apunten a algo anterior se limpian automáticamente. Este paso reemplaza cualquier campo fijo: si no agregas preguntas, la llamada se registrará como Contactada sin datos adicionales.</small>
    <div style={{marginTop:12}}>
      {preguntas.map((q,i)=>(
        <div className="qcard" key={q.id}>
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
            <span className="tag">{q.id.toUpperCase()}</span>
            <div className="row" style={{gap:2}}>
              <button className="btn btn-ghost btn-sm" disabled={i===0} onClick={()=>moveQ(i,-1)} title="Subir">↑</button>
              <button className="btn btn-ghost btn-sm" disabled={i===preguntas.length-1} onClick={()=>moveQ(i,1)} title="Bajar">↓</button>
            </div>
            <input className="input grow" value={q.texto} onChange={e=>updQ(i,{texto:e.target.value})} placeholder="Texto de la pregunta"/>
            <button className="btn btn-ghost btn-sm" onClick={()=>duplicarQ(i)}>⧉ Duplicar</button>
            {preguntas.length>1 && <button className="btn btn-danger btn-sm" onClick={()=>delQ(i)}>Eliminar</button>}
          </div>

          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8,flexWrap:"wrap"}}>
            <small className="muted">Tipo de respuesta</small>
            <select className="input" style={{width:"auto"}} value={q.tipo} onChange={e=>setTipoPregunta(i,e.target.value)}>
              {Q_TIPOS.map(t=><option key={t.k} value={t.k}>{t.t}</option>)}
            </select>
            <label className="checkline" style={{border:"none",padding:0,gap:5,marginLeft:6}}>
              <input type="checkbox" checked={!!q.obligatoria} onChange={e=>updQ(i,{obligatoria:e.target.checked})}/>
              <small className="muted">Obligatoria (el agente no puede guardar sin responderla)</small>
            </label>
          </div>

          {q.tipo==="sino" && <div style={{marginBottom:8}}>
            <small className="muted" style={{display:"block",marginBottom:6}}>Respuestas fijas: <span className="tag">Sí</span> <span className="tag">No</span></small>
            <label className="checkline" style={{border:"none",padding:0,gap:6,marginBottom:4}}>
              <input type="checkbox" checked={!!(q.opcionesFinaliza&&q.opcionesFinaliza["Sí"])} onChange={e=>updQ(i,{opcionesFinaliza:{...(q.opcionesFinaliza||{}),"Sí":e.target.checked}})}/>
              <small>Finaliza el formulario si responde <b>Sí</b> (no muestra las siguientes preguntas)</small>
            </label>
            <label className="checkline" style={{border:"none",padding:0,gap:6}}>
              <input type="checkbox" checked={!!(q.opcionesFinaliza&&q.opcionesFinaliza["No"])} onChange={e=>updQ(i,{opcionesFinaliza:{...(q.opcionesFinaliza||{}),"No":e.target.checked}})}/>
              <small>Finaliza el formulario si responde <b>No</b> (no muestra las siguientes preguntas)</small>
            </label>
          </div>}
          {q.tipo==="abierta" && <small className="muted" style={{display:"block"}}>El agente escribirá texto libre.</small>}
          {q.tipo==="fecha" && <small className="muted" style={{display:"block"}}>El agente seleccionará una fecha.</small>}
          {q.tipo==="hora" && <small className="muted" style={{display:"block"}}>El agente seleccionará una hora (hh:mm).</small>}
          {q.tipo==="lista" && <small className="muted" style={{display:"block"}}>Lista desplegable: el agente solo puede seleccionar una opción.</small>}

          {(q.tipo==="multiple"||q.tipo==="lista") && <>
            <small className="muted">Opciones {q.tipo==="multiple"?"(el agente puede marcar una o varias)":"(el agente elige solo una)"}</small>
            <div style={{display:"flex",flexDirection:"column",gap:6,margin:"6px 0"}}>
              {q.opciones.map((op,k)=>(
                <div key={k} className="row" style={{gap:6,alignItems:"center",flexWrap:"wrap"}}>
                  <input className="input" style={{width:160}} value={op.texto} placeholder={"Opción "+(k+1)}
                    onChange={e=>updOpcion(i,k,{texto:e.target.value})}/>
                  <input className="input" style={{width:160}} value={op.valorReporte} placeholder="Valor a reportar (opcional)"
                    onChange={e=>updOpcion(i,k,{valorReporte:e.target.value})}/>
                  <label className="checkline" style={{border:"none",padding:0,gap:5}}>
                    <input type="checkbox" checked={!!op.finaliza} onChange={e=>updOpcion(i,k,{finaliza:e.target.checked})}/>
                    <small className="muted">Finaliza el formulario</small>
                  </label>
                </div>
              ))}
              <button className="btn btn-ghost btn-sm" style={{width:"fit-content"}} onClick={()=>addOpcion(i)}>＋ opción</button>
            </div>
          </>}

          {q.tipo==="combinacion" && <div style={{marginTop:4}}>
            <small className="muted">Sub-respuestas que combina esta pregunta. Puedes condicionar una sub-respuesta según otra anterior de esta misma pregunta, e incluso marcar que finalice todo el formulario.</small>
            {(q.partes||[]).map((p,pi)=>(
              <div key={p.id} style={{border:"1px solid var(--border)",borderRadius:8,padding:10,margin:"8px 0",background:"var(--surface)"}}>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
                  <span className="tag">{p.id}</span>
                  <div className="row" style={{gap:2}}>
                    <button className="btn btn-ghost btn-sm" disabled={pi===0} onClick={()=>moveParte(i,pi,-1)} title="Subir">↑</button>
                    <button className="btn btn-ghost btn-sm" disabled={pi===q.partes.length-1} onClick={()=>moveParte(i,pi,1)} title="Bajar">↓</button>
                  </div>
                  <input className="input grow" style={{minWidth:140}} value={p.label} placeholder={"Etiqueta de la parte "+(pi+1)} onChange={e=>updParte(i,pi,{label:e.target.value})}/>
                  <select className="input" style={{width:"auto"}} value={p.tipo} onChange={e=>setTipoParte(i,pi,e.target.value)}>
                    {Q_TIPOS_SIMPLES.map(t=><option key={t.k} value={t.k}>{t.t}</option>)}
                  </select>
                  <label className="checkline" style={{border:"none",padding:0,gap:5}}>
                    <input type="checkbox" checked={!!p.obligatoria} onChange={e=>updParte(i,pi,{obligatoria:e.target.checked})}/>
                    <small className="muted">Obligatoria</small>
                  </label>
                  <button className="btn btn-ghost btn-sm" onClick={()=>duplicarParte(i,pi)}>⧉ Duplicar</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>delParte(i,pi)}>✕</button>
                </div>

                {p.tipo==="sino" && <div style={{marginBottom:8}}>
                  <small className="muted" style={{display:"block",marginBottom:6}}>Respuestas fijas: <span className="tag">Sí</span> <span className="tag">No</span></small>
                  <label className="checkline" style={{border:"none",padding:0,gap:6,marginBottom:4}}>
                    <input type="checkbox" checked={!!(p.opcionesFinaliza&&p.opcionesFinaliza["Sí"])} onChange={e=>updParte(i,pi,{opcionesFinaliza:{...(p.opcionesFinaliza||{}),"Sí":e.target.checked}})}/>
                    <small>Finaliza el formulario si responde <b>Sí</b></small>
                  </label>
                  <label className="checkline" style={{border:"none",padding:0,gap:6}}>
                    <input type="checkbox" checked={!!(p.opcionesFinaliza&&p.opcionesFinaliza["No"])} onChange={e=>updParte(i,pi,{opcionesFinaliza:{...(p.opcionesFinaliza||{}),"No":e.target.checked}})}/>
                    <small>Finaliza el formulario si responde <b>No</b></small>
                  </label>
                </div>}

                {(p.tipo==="multiple"||p.tipo==="lista") && <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {(p.opciones||[]).map((op,k)=>(
                    <div key={k} className="row" style={{gap:6,alignItems:"center",flexWrap:"wrap"}}>
                      <input className="input" style={{width:130}} value={op.texto} placeholder={"Opción "+(k+1)}
                        onChange={e=>updParteOpcion(i,pi,k,{texto:e.target.value})}/>
                      <input className="input" style={{width:130}} value={op.valorReporte} placeholder="Valor a reportar"
                        onChange={e=>updParteOpcion(i,pi,k,{valorReporte:e.target.value})}/>
                      <label className="checkline" style={{border:"none",padding:0,gap:5}}>
                        <input type="checkbox" checked={!!op.finaliza} onChange={e=>updParteOpcion(i,pi,k,{finaliza:e.target.checked})}/>
                        <small className="muted">Finaliza</small>
                      </label>
                    </div>))}
                  <button className="btn btn-ghost btn-sm" style={{width:"fit-content"}} onClick={()=>addParteOpcion(i,pi)}>＋ opción</button>
                </div>}

                {pi>0 && <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <small className="muted">Condición:</small>
                  <select className="input" style={{width:"auto"}} value={p.cond?p.cond.p:""} onChange={e=>updParte(i,pi,{cond:e.target.value?{p:e.target.value,op:"",mode:"eq"}:null})}>
                    <option value="">Mostrar siempre</option>
                    {q.partes.slice(0,pi).filter(sp=>(sp.label||sp.id)&&esCondicionable(sp)).map(sp=><option key={sp.id} value={sp.id}>Según {sp.label||sp.id}</option>)}
                  </select>
                  {p.cond && <select className="input" style={{width:"auto"}} value={p.cond.mode||"eq"} onChange={e=>updParte(i,pi,{cond:{...p.cond,mode:e.target.value}})}>
                    <option value="eq">es igual a</option>
                    <option value="neq">es diferente de</option>
                  </select>}
                  {p.cond && <select className="input" style={{width:"auto"}} value={p.cond.op} onChange={e=>updParte(i,pi,{cond:{...p.cond,op:e.target.value}})}>
                    <option value="">elige opción</option>
                    {opcionesDe(q.partes.find(sp=>sp.id===p.cond.p)||{}).map(o=><option key={o}>{o}</option>)}
                  </select>}
                </div>}
              </div>
            ))}
            <button className="btn btn-ghost btn-sm" onClick={()=>addParte(i)}>＋ Agregar sub-respuesta</button>
          </div>}

          {i>0 && <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <small className="muted">Condición:</small>
            <select className="input" style={{width:"auto"}} value={q.cond?q.cond.q:""} onChange={e=>updQ(i,{cond:e.target.value?{q:e.target.value,op:"",mode:"eq"}:null})}>
              <option value="">Mostrar siempre</option>
              {preguntas.slice(0,i).filter(p=>p.texto&&esCondicionable(p)).map(p=><option key={p.id} value={p.id}>Según {p.id.toUpperCase()}</option>)}
            </select>
            {q.cond && <select className="input" style={{width:"auto"}} value={q.cond.mode||"eq"} onChange={e=>updQ(i,{cond:{...q.cond,mode:e.target.value}})}>
              <option value="eq">es igual a</option>
              <option value="neq">es diferente de</option>
            </select>}
            {q.cond && <select className="input" style={{width:"auto"}} value={q.cond.op} onChange={e=>updQ(i,{cond:{...q.cond,op:e.target.value}})}>
              <option value="">elige opción</option>
              {opcionesDe(preguntas.find(p=>p.id===q.cond.q)||{}).map(o=><option key={o}>{o}</option>)}
            </select>}
          </div>}
        </div>
      ))}
      <button className="btn btn-ghost btn-sm" onClick={addQ}>＋ Agregar pregunta</button>
    </div>
  </div>);
}

/* ---- Editar las preguntas de una campaña ya creada (Admin/Supervisor/Team leader) ---- */
function EditQuestionsModal({ctx,camp,onClose}){
  const {setCampaigns,session,notify}=ctx;
  const [preguntas,setPreguntas]=useState(()=>{
    const base=camp.preguntas&&camp.preguntas.length?camp.preguntas:[blankPregunta([])];
    return JSON.parse(JSON.stringify(base));
  });
  const guardar=()=>{
    const limpio=preguntas.filter(q=>q.texto).map(limpiaPregunta);
    setCampaigns(p=>p.map(c=>c.id===camp.id?{...c,preguntas:limpio}:c));
    if(supabase) actualizarCampanaDB(camp.id,{preguntas:limpio});
    registrarAccion(session.id,"editar_preguntas",`${session.nombre} editó las preguntas de «${camp.titulo}»`);
    notify("Preguntas de la campaña actualizadas.");
    onClose();
  };
  return (<Modal title={`Editar preguntas · ${camp.titulo}`} onClose={onClose} wide foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-accent" onClick={guardar}>Guardar cambios</button></>}>
    <div className="alert alert-info" style={{marginTop:0}}>Los cambios se aplican a partir de ahora. Las actividades ya registradas conservan las respuestas dadas con la configuración anterior.</div>
    <PreguntasBuilder preguntas={preguntas} setPreguntas={setPreguntas}/>
  </Modal>);
}

/* ---- Etiquetar una campaña ya existente ---- */
function EtiquetaModal({ctx,camp,onClose}){
  const {setCampaigns,session,notify,etiquetas,agregarEtiqueta}=ctx;
  const [etiqueta,setEtiqueta]=useState(camp.etiqueta||"");
  const [nueva,setNueva]=useState("");
  const guardar=()=>{
    setCampaigns(p=>p.map(c=>c.id===camp.id?{...c,etiqueta:etiqueta||null}:c));
    if(supabase) actualizarCampanaDB(camp.id,{etiqueta:etiqueta||null});
    registrarAccion(session.id,"etiquetar_campana",`${session.nombre} ${etiqueta?`etiquetó «${camp.titulo}» como «${etiqueta}»`:`quitó la etiqueta de «${camp.titulo}»`}`);
    notify(etiqueta?`Campaña etiquetada como «${etiqueta}».`:"Etiqueta removida.");
    onClose();
  };
  return (<Modal title={`Etiquetar · ${camp.titulo}`} onClose={onClose} foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-accent" onClick={guardar}>Guardar</button></>}>
    <div className="field"><label>Etiqueta</label>
      <select className="input" value={etiqueta} onChange={e=>setEtiqueta(e.target.value)}>
        <option value="">Sin etiqueta</option>
        {etiquetas.map(et=><option key={et} value={et}>{et}</option>)}
      </select>
    </div>
    <div className="field"><label>O crea una etiqueta nueva</label>
      <div className="row" style={{gap:8}}>
        <input className="input" placeholder="Ej. Seguimiento PEI" value={nueva} onChange={e=>setNueva(e.target.value)}/>
        <button type="button" className="btn btn-ghost btn-sm" onClick={()=>{ if(!nueva.trim())return; agregarEtiqueta(nueva.trim()); setEtiqueta(nueva.trim()); setNueva(""); }}>+ Agregar</button>
      </div>
    </div>
    {etiqueta==="Agenda semanal directores" && camp.preguntas && !camp.preguntas.some(q=>q.id==="q_fecha") &&
      <div className="alert alert-info">Esta campaña no tiene las preguntas estándar de «Agenda semanal directores» (fecha, tipo de actividad, etc.). El módulo del mismo nombre no podrá leer sus datos correctamente a menos que ajustes las preguntas manualmente desde «✏️ Editar preguntas», usando los mismos identificadores esperados.</div>}
  </Modal>);
}

/* ---- Asistente de creación de campaña ---- */
function CampaignWizard({ctx,onClose,borradorInicial}){
  const {schools,setSchools,users,campaigns,setCampaigns,filtro,session,notify,turnoApoyoHabilitado,etiquetas,agregarEtiqueta}=ctx;
  const bd=borradorInicial&&borradorInicial.borradorEstado||{};
  const [step,setStep]=useState(bd.step||0);
  const steps=["Datos","Preguntas","Centros escolares","Agentes","Resumen"];
  const [titulo,setTitulo]=useState(borradorInicial?borradorInicial.titulo:"");
  const [objetivo,setObjetivo]=useState(borradorInicial?borradorInicial.objetivo:"");
  const [etiqueta,setEtiqueta]=useState(borradorInicial?(borradorInicial.etiqueta||""):"");
  const [nuevaEtiqueta,setNuevaEtiqueta]=useState("");
  const [fDesde,setFDesde]=useState(borradorInicial?borradorInicial.fechaDesde:filtro.desde);
  const [fHasta,setFHasta]=useState(borradorInicial?borradorInicial.fechaHasta:filtro.hasta);
  const [maxIntentos,setMaxIntentos]=useState(borradorInicial?borradorInicial.maxIntentos:DEFAULT_MAX_INTENTOS);
  // Por defecto true = comportamiento de siempre (marcar "Contactado" saca al centro de la Bandeja).
  // En false, hace falta la acción explícita "Guardar y cerrar centro" — para campañas donde contestar
  // no basta, hace falta una respuesta específica que el propio agente confirma antes de cerrar.
  const [cierreAutomatico,setCierreAutomatico]=useState(bd.cierreAutomatico!==false);
  const [infoExtraPorCodigo,setInfoExtraPorCodigo]=useState({}); // información de referencia por centro (opcional), ver rowToInfoExtra
  const modoFecha=fDesde===fHasta?"dia":"periodo";
  const setModoFecha=m=>{ if(m==="dia") setFHasta(fDesde); else if(fHasta===fDesde) setFHasta(addDays(fDesde,6)); };
  // preguntas de la campaña (100% parametrizables; reemplazan cualquier esquema fijo de "actividad")
  const [preguntas,setPreguntas]=useState(borradorInicial&&borradorInicial.preguntas&&borradorInicial.preguntas.length?borradorInicial.preguntas:[blankPregunta([])]);
  const seleccionarEtiqueta=val=>{
    setEtiqueta(val);
    const preguntasEnBlanco = preguntas.length===1 && !preguntas[0].texto;
    if(val==="Agenda semanal directores" && preguntasEnBlanco) setPreguntas(PREGUNTAS_AGENDA_DIRECTORES());
  };
  const [selMode,setSelMode]=useState(bd.selMode||"todos");
  const [manual,setManual]=useState(bd.manual||[]);
  const [grupo,setGrupo]=useState(()=>{
    const bdGrupo=bd.grupo;
    if(bdGrupo&&Array.isArray(bdGrupo.valores)) return bdGrupo;
    if(bdGrupo&&bdGrupo.valor!=null) return {tipo:bdGrupo.tipo,valores:[bdGrupo.valor]}; // compatibilidad con borradores antiguos (un solo valor)
    return {tipo:"departamento",valores:[DEPTOS[0]]};
  });
  const [uploaded,setUploaded]=useState([]);const [upInfo,setUpInfo]=useState(null);
  // solo agentes Outbound, activos y disponibles (Inbound y SDP no reciben llamadas de campaña)
  const pool=users.filter(u=>u.rol==="Agente"&&u.estado==="activo"&&u.skill!=="Inbound"&&u.skill!=="SDP"&&u.disponible!==false);
  const [turno,setTurno]=useState(bd.turno||"Todos");
  const [agSel,setAgSel]=useState(bd.agSel||pool.map(a=>a.id));

  // ---- borrador autoguardado en Supabase (para que Admin/Supervisor/Team Leader puedan continuarlo desde cualquier lugar) ----
  const [borradorId,setBorradorId]=useState(borradorInicial?borradorInicial.id:null);
  const [continuandoBorrador]=useState(!!borradorInicial);
  const primerRenderRef=useRef(true);
  useEffect(()=>{
    if(primerRenderRef.current){ primerRenderRef.current=false; return; } // no autoguardar antes de que el usuario toque algo
    if(!supabase) return;
    const t=setTimeout(async()=>{
      const nuevoId=await guardarBorradorDB({
        titulo,objetivo,fechaDesde:fDesde,fechaHasta:fHasta,maxIntentos,preguntas,etiqueta,
        estadoAsistente:{selMode,manual,grupo,turno,agSel,step,cierreAutomatico},creadoPor:session.id,
      },borradorId);
      if(nuevoId && !borradorId){
        setBorradorId(nuevoId);
        setCampaigns(p=>[...p,{id:nuevoId,titulo,objetivo,fechaDesde:fDesde,fechaHasta:fHasta,maxIntentos,preguntas,etiqueta,estado:"Borrador",pausada:false,agentIds:[],schoolCodes:[],assign:{},creadoPor:session.id,actualizadoEn:Date.now()}]);
      } else if(nuevoId){
        setCampaigns(p=>p.map(c=>c.id===nuevoId?{...c,titulo,objetivo,fechaDesde:fDesde,fechaHasta:fHasta,maxIntentos,preguntas,etiqueta,actualizadoEn:Date.now()}:c));
      }
    },800);
    return ()=>clearTimeout(t);
  },[titulo,objetivo,fDesde,fHasta,maxIntentos,preguntas,selMode,manual,grupo,turno,agSel,step,etiqueta,cierreAutomatico]);

  const selectedSchools=useMemo(()=>{
    if(selMode==="archivo")return uploaded;
    if(selMode==="todos")return schools;
    if(selMode==="manual")return schools.filter(s=>manual.includes(s.codigo));
    const {tipo,valores}=grupo;
    const igual=(a,b)=>String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();
    const norm=v=>String(v||"").trim().toLowerCase();
    const valoresNorm=(valores||[]).map(norm);
    return schools.filter(s=>{if(tipo==="departamento")return valoresNorm.includes(norm(s.departamento));if(tipo==="municipio")return valoresNorm.includes(norm(s.municipio));if(tipo==="distrito")return valoresNorm.includes(norm(s.distrito));if(tipo==="programa")return igual(s.programa,"Despega");if(tipo==="modernizacion")return s.modernizacion;if(tipo==="fase")return valoresNorm.includes(norm(valores&&valores[0]));if(tipo==="control")return s.control;return false;});
  },[selMode,manual,grupo,schools,uploaded]);
  const agAvail=pool.filter(a=>turno==="Todos"||a.turno===turno);
  const finalAgents=agAvail.filter(a=>agSel.includes(a.id));
  const ordenEs=(a,b)=>a.localeCompare(b,"es",{sensitivity:"base"});
  const grupoOptions={departamento:DEPTOS,municipio:[...new Set(schools.map(s=>s.municipio))].sort(ordenEs),distrito:[...new Set(schools.map(s=>s.distrito))].sort(ordenEs),fase:["1","2","3"],programa:[],modernizacion:[],control:[]};
  const MULTI_TIPOS=["departamento","municipio","distrito"];

  // Un solo archivo hace las dos cosas: selecciona los centros Y, si el archivo trae esas columnas,
  // también carga la información de referencia (Hora de inicio, Responsables, Monitor) por centro —
  // ya no hace falta cargar dos archivos separados para una campaña especial.
  const onFile=file=>{
    if(!file)return;
    setUpInfo({nombre:file.name,cargando:true});
    parseSchoolConInfoExtraFile(file,(err,res)=>{
      if(err){ setUploaded([]); setInfoExtraPorCodigo({}); setUpInfo({nombre:file.name,error:err.message}); return; }
      const vistos={},lista=[],infoMapa={};
      const CAMPOS_INFO_EXTRA=["horaInicio","responsable1","telResponsable1","responsable2","telResponsable2","monitor","telMonitor"];
      let propios=0;
      res.validas.forEach(({escuela,info})=>{
        if(vistos[escuela.codigo]) return;
        vistos[escuela.codigo]=1; lista.push(escuela);
        const enCatalogo=schools.some(s=>s.codigo===escuela.codigo);
        const datos={...info};
        // El archivo de la campaña SIEMPRE tiene prioridad sobre lo que ya haya en el catálogo, si
        // trae su propio dato — así, un teléfono (u otro campo) distinto al que está guardado en
        // centros_escolares se respeta tal como viene en el archivo, sin que el catálogo lo pise.
        if(escuela.telefonos && escuela.telefonos.length && escuela.telefonos[0]) datos.telefonos=escuela.telefonos;
        if(escuela.nombre) datos.nombre=escuela.nombre;
        if(escuela.departamento) datos.departamento=escuela.departamento;
        if(escuela.municipio) datos.municipio=escuela.municipio;
        if(escuela.distrito) datos.distrito=escuela.distrito;
        if(!enCatalogo) propios++;
        if(CAMPOS_INFO_EXTRA.some(c=>datos[c]) || !enCatalogo || datos.telefonos) infoMapa[escuela.codigo]=datos;
      });
      setUploaded(lista);
      setInfoExtraPorCodigo(infoMapa);
      setUpInfo({nombre:file.name,cargados:lista.length,omitidos:res.omitidos,hoja:res.hoja,conInfoExtra:Object.keys(infoMapa).length,propios});
    });
  };

  const [creando,setCreando]=useState(false);
  const [pedirConfirmIncompleta,setPedirConfirmIncompleta]=useState(false);
  const CAMPOS_INFO_EXTRA=["horaInicio","responsable1","telResponsable1","responsable2","telResponsable2","monitor","telMonitor"];
  // Cuenta cuántos de los centros seleccionados no tienen la información adicional completa —
  // solo tiene sentido si se cargó algo de información adicional para empezar (si nadie la usó, 0).
  const incompletosInfoExtra=Object.keys(infoExtraPorCodigo).length ? selectedSchools.filter(s=>{
    const info=infoExtraPorCodigo[s.codigo];
    if(!info) return true;
    return CAMPOS_INFO_EXTRA.some(c=>!info[c]);
  }).length : 0;
  const crearCampanaFinal=async()=>{
    const codes=selectedSchools.map(s=>s.codigo);const agentIds=finalAgents.map(a=>a.id);
    const camp={id:borradorId||uid("c"),titulo:titulo||"Campaña sin título",objetivo,fechaDesde:fDesde,fechaHasta:fHasta,maxIntentos:Number(maxIntentos)||DEFAULT_MAX_INTENTOS,

      infoExtra:Object.keys(infoExtraPorCodigo).length?infoExtraPorCodigo:null,
      schoolCodes:codes,agentIds,assign:buildAssign(codes,agentIds),estado:"En curso",pausada:false};
    if(supabase){
      setCreando(true);
      const idReal=await crearCampanaDB(camp,borradorId);
      setCreando(false);
      if(!idReal) return notify("No se pudo crear la campaña en la base de datos.","err");
      camp.id=idReal;
    }
    setCampaigns(p=> borradorId?p.map(c=>c.id===borradorId?camp:c):[...p,camp]); // si venía de un borrador, reemplaza esa misma fila
    registrarAccion(session.id,"crear_campana",`${session.nombre} creó la campaña «${camp.titulo}» (${codes.length} centros, ${agentIds.length} agentes)`);

    if(incompletosInfoExtra>0){ setPedirConfirmIncompleta(true); return; }

          <button className={modoFecha==="periodo"?"on":""} onClick={()=>setModoFecha("periodo")}>Período</button>
        </div>
        {modoFecha==="dia"
          ? <input className="input" type="date" style={{width:"auto"}} value={fDesde} onChange={e=>{setFDesde(e.target.value);setFHasta(e.target.value);}}/>

              <div><small className="muted">Desde</small><input className="input" type="date" value={fDesde} max={fHasta} onChange={e=>setFDesde(e.target.value)}/></div>

        <small className="muted" style={{display:"block",marginTop:8}}>Columnas reconocidas: Código, Nombre, Departamento, Municipio, Distrito, Teléfono(s), Programa, Modernización, Fase, Centro Control — y, opcionalmente en el mismo archivo, Hora de inicio, Responsable 1/2 + sus teléfonos, y Monitor + teléfono (para campañas especiales que necesiten mostrarle esa información al agente).</small>
