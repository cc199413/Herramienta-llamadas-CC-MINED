}

/* ---- Borradores de campaña (Administrador, Supervisor, Team Leader) ---- */
function Borradores({ctx}){
  const {campaigns,setCampaigns,users,session,notify}=ctx;
  const [continuar,setContinuar]=useState(null); // borrador a continuar en el asistente
  const [confirmarBorrar,setConfirmarBorrar]=useState(null); // borrador a descartar
  const borradores=[...campaigns.filter(c=>c.estado==="Borrador")].sort((a,b)=>(b.actualizadoEn||0)-(a.actualizadoEn||0));
  const nombreDe=id=>(users.find(u=>u.id===id)||{}).nombre||"—";
  const hace=ms=>{
    if(!ms) return "—";
    const seg=Math.floor((Date.now()-ms)/1000);
    if(seg<60) return "hace un momento";
    if(seg<3600) return `hace ${Math.floor(seg/60)} min`;
    if(seg<86400) return `hace ${Math.floor(seg/3600)} h`;
    return `hace ${Math.floor(seg/86400)} día(s)`;
  };
  const descartar=async()=>{
    const b=confirmarBorrar;
    setCampaigns(p=>p.filter(c=>c.id!==b.id));
    if(supabase) await eliminarBorradorDB(b.id);
    registrarAccion(session.id,"descartar_borrador",`${session.nombre} descartó el borrador «${b.titulo||"(sin título)"}»`);
    notify("Borrador descartado.");
    setConfirmarBorrar(null);
  };

  return (<div className="grid">
    <div><div className="section-title" style={{margin:0}}>Borradores de campaña</div><small className="muted">Campañas a medio crear, guardadas automáticamente. Cualquier Administrador, Supervisor o Team Leader puede continuarlas o descartarlas — no solo quien las empezó.</small></div>

    {borradores.length===0 && <div className="card"><div className="empty" style={{padding:30}}>No hay borradores pendientes.</div></div>}

    {borradores.map(b=>(
      <div key={b.id} className="card card-pad" style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
        <div className="grow">
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <b>{b.titulo&&b.titulo.trim()?b.titulo:"(Sin título todavía)"}</b>
            <span className="tag" style={{background:"var(--warn-bg)",color:"var(--warn)"}}>📝 Borrador</span>
          </div>
          <small className="muted" style={{display:"block",marginTop:4}}>
            Iniciado por {nombreDe(b.creadoPor)} · guardado {hace(b.actualizadoEn)}
            {b.preguntas&&b.preguntas.length ? ` · ${b.preguntas.length} pregunta(s) configurada(s)` : ""}
          </small>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-primary btn-sm" onClick={()=>setContinuar(b)}>Continuar</button>
          <button className="btn btn-ghost btn-sm" style={{color:"var(--danger)"}} onClick={()=>setConfirmarBorrar(b)}>Descartar</button>
        </div>
      </div>
    ))}

    {continuar && <CampaignWizard ctx={ctx} borradorInicial={continuar} onClose={()=>setContinuar(null)}/>}
    {confirmarBorrar && <Modal title="Descartar borrador" onClose={()=>setConfirmarBorrar(null)} foot={<><button className="btn btn-ghost" onClick={()=>setConfirmarBorrar(null)}>Cancelar</button><button className="btn btn-danger" onClick={descartar}>Sí, descartar</button></>}>
      <p style={{marginTop:0}}>¿Seguro que quieres descartar el borrador «{confirmarBorrar.titulo&&confirmarBorrar.titulo.trim()?confirmarBorrar.titulo:"(sin título)"}»? Esta acción no se puede deshacer.</p>
    </Modal>}
  </div>);
}

/* ---- Exportar a Excel la base de una campaña con sus resultados (Admin/Supervisor) ---- */
function exportarCampanaExcel(camp,schools,users,records){
  if(typeof XLSX==="undefined") return;
  const asg=getAssign(camp);
  const agName=id=>(users.find(u=>u.id===id)||{}).nombre||"—";
  const recFor=code=>records.find(r=>r.campaignId===camp.id&&r.codigo===code);

  const centros=camp.schoolCodes.map(code=>{
    const s=schools.find(x=>x.codigo===code)||{};
    const r=recFor(code);
    return {
      "Código":code,"Centro Educativo":s.nombre||"","Departamento":s.departamento||"","Municipio":s.municipio||"",
      "Teléfonos":(s.telefonos||[]).join(" / "),"Agente asignado":agName(asg[code]),
      "Estado":r?r.estado:"Pendiente","Intentos":r?r.intentos||0:0,
    };
  });

  const preguntas=camp.preguntas||[];
  const columnasPreg=[];
  preguntas.forEach(q=>{ if(q.tipo==="combinacion") (q.partes||[]).forEach(p=>columnasPreg.push({label:`${q.texto} · ${p.label||p.id}`,q,partId:p.id})); else columnasPreg.push({label:q.texto,q,partId:null}); });

  const actividades=[];
  camp.schoolCodes.forEach(code=>{
    const s=schools.find(x=>x.codigo===code)||{};
    const r=recFor(code);
    if(!r||!r.actividades||r.actividades.length===0) return;
    r.actividades.forEach((act,i)=>{
      const fila={"Código":code,"Centro Educativo":s.nombre||"","Agente":agName(r.agentId),"N.° actividad":i+1,
        "Fecha de registro":r.updatedMs?new Date(r.updatedMs).toLocaleString("es-SV"):""};
      columnasPreg.forEach(c=>{ fila[c.label]=labelDeValor(valoresActividad(act,c.q,c.partId)); });
      actividades.push(fila);
    });
  });

  const wb=XLSX.utils.book_new();
  const wsCentros=XLSX.utils.json_to_sheet(centros);
  XLSX.utils.book_append_sheet(wb,wsCentros,"Centros");
  if(actividades.length){
    const wsAct=XLSX.utils.json_to_sheet(actividades);
    XLSX.utils.book_append_sheet(wb,wsAct,"Actividades");
  }
  const nombreArchivo=`campana_${camp.titulo.replace(/[^a-z0-9]+/gi,"_").slice(0,40)}.xlsx`;
  XLSX.writeFile(wb,nombreArchivo);
}

/* ---- Duplicar campaña (sin respuestas, exige nuevo nombre) ---- */
function DuplicateModal({ctx,camp,onClose}){
  const {campaigns,setCampaigns,session,notify}=ctx;
  const [nombre,setNombre]=useState(camp.titulo+" (copia)");
  const [err,setErr]=useState(null);
  const [guardando,setGuardando]=useState(false);
  const dup=async()=>{
    const n=nombre.trim();
    if(!n)return setErr("Escribe un nombre.");
    if(n.toLowerCase()===camp.titulo.toLowerCase())return setErr("El nombre debe ser distinto al de la campaña original.");
    if(campaigns.some(c=>c.titulo.toLowerCase()===n.toLowerCase()))return setErr("Ya existe una campaña con ese nombre.");
    const assign={...getAssign(camp)};
    const copiaLocal={id:uid("c"),titulo:n,objetivo:camp.objetivo,fechaDesde:camp.fechaDesde,fechaHasta:camp.fechaHasta,
      maxIntentos:camp.maxIntentos,preguntas:camp.preguntas,estado:"En curso",pausada:false,
      schoolCodes:[...camp.schoolCodes],agentIds:[...camp.agentIds],assign}; // conserva CE y agentes; NO copia registros/respuestas
    if(supabase){
      setGuardando(true);
      const idReal=await crearCampanaDB(copiaLocal);
      setGuardando(false);
      if(!idReal) return setErr("No se pudo guardar la campaña duplicada.");
      copiaLocal.id=idReal;
    }
    setCampaigns(p=>[...p,copiaLocal]);
    registrarAccion(session.id,"duplicar_campana",`${session.nombre} duplicó «${camp.titulo}» como «${n}»`);
    notify("Campaña duplicada sin registros: "+n);onClose();
  };
  return (<Modal title="Duplicar campaña" onClose={onClose} foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-accent" disabled={guardando} onClick={dup}>{guardando?"Guardando…":"Duplicar"}</button></>}>
    <p style={{color:"var(--text-dim)",marginTop:0}}>Se copiarán los centros educativos, los agentes y su asignación de «{camp.titulo}». <b>No se copiarán los registros ni las respuestas.</b> Debes asignar un nombre diferente.</p>
    <div className="field"><label>Nombre de la nueva campaña</label><input className="input" value={nombre} onChange={e=>setNombre(e.target.value)}/></div>
    {err&&<div className="alert alert-err">{err}</div>}
  </Modal>);
}

/* ---- Reasignar CE no contactados: por agente(s) o por turno, siempre de forma equitativa ---- */
function ReassignModal({ctx,camp,onClose}){
  const {campaigns,setCampaigns,records,records:recs,setRecords,schools,users,session,notify}=ctx;
  const [modo,setModo]=useState("agente"); // agente | turno
  const asg=getAssign(camp);
  const campAgentes=camp.agentIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
  const agentesDisponibles=users.filter(u=>u.rol==="Agente"&&u.estado==="activo"&&u.disponible!==false);

  const [origenAgentes,setOrigenAgentes]=useState(camp.agentIds); // por defecto: todos
  const [destinoAgentes,setDestinoAgentes]=useState(camp.agentIds.filter(id=>agentesDisponibles.some(a=>a.id===id)));
  const [origenTurno,setOrigenTurno]=useState("AM");
  const [destinoTurno,setDestinoTurno]=useState("PM");

  const recFor=code=>recs.find(r=>r.campaignId===camp.id&&r.codigo===code);
  const noContactado=code=>{const r=recFor(code);return !r||r.estado!=="Contactado";};

  const sourceCodes=useMemo(()=>{
    if(modo==="agente") return camp.schoolCodes.filter(code=>noContactado(code) && origenAgentes.includes(asg[code]));
    return camp.schoolCodes.filter(code=>{ if(!noContactado(code)) return false; const ag=campAgentes.find(a=>a.id===asg[code]); return ag&&ag.turno===origenTurno; });
  },[modo,origenAgentes,origenTurno,camp.schoolCodes,recs]);

  const destinoIds=useMemo(()=>{
    if(modo==="agente") return destinoAgentes;
    return agentesDisponibles.filter(a=>a.turno===destinoTurno).map(a=>a.id);
  },[modo,destinoAgentes,destinoTurno,agentesDisponibles]);

  const [selected,setSelected]=useState(sourceCodes);
  useEffect(()=>{ setSelected(sourceCodes); },[JSON.stringify(sourceCodes)]);

  const toggleCode=code=>setSelected(p=>p.includes(code)?p.filter(x=>x!==code):[...p,code]);
  const toggleOrigenAgente=id=>setOrigenAgentes(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleDestinoAgente=id=>setDestinoAgentes(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);

  const perAgent=destinoIds.length?Math.floor(selected.length/destinoIds.length):0;
  const resto=destinoIds.length?selected.length%destinoIds.length:0;
  const agName=id=>(users.find(u=>u.id===id)||{}).nombre||"—";

  const guardar=async()=>{
    if(selected.length===0) return notify("No hay centros seleccionados para reasignar.","err");
    if(destinoIds.length===0) return notify("Selecciona al menos un agente destino.","err");
    const nuevoParcial=buildAssign(selected,destinoIds);
    const agentIdsNuevos=[...new Set([...camp.agentIds,...destinoIds])];
    setCampaigns(p=>p.map(c=>{
      if(c.id!==camp.id) return c;
      return {...c,agentIds:agentIdsNuevos,assign:{...getAssign(c),...nuevoParcial}};
    }));
    setRecords(p=>p.map(r=> (r.campaignId===camp.id && selected.includes(r.codigo)) ? {...r,agentId:nuevoParcial[r.codigo]||r.agentId} : r));
    if(supabase){
      await agregarAgentesACampanaDB(camp.id,agentIdsNuevos);
      await actualizarRegistrosMasivoDB(camp.id,selected.map(codigo=>({codigo,agentId:nuevoParcial[codigo]})));
    }
    notify(`Reasignados ${selected.length} centro(s) entre ${destinoIds.length} agente(s), de forma equitativa.`);
    registrarAccion(session.id,"reasignar",`${session.nombre} reasignó ${selected.length} centro(s) de «${camp.titulo}» entre ${destinoIds.length} agente(s)`);
    onClose();
  };

  return (<Modal title={`Reasignar centros no contactados · ${camp.titulo}`} onClose={onClose} wide foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={guardar} disabled={!selected.length||!destinoIds.length}>Guardar reasignación</button></>}>
    <p style={{color:"var(--text-dim)",marginTop:0}}>Solo se reasignan los centros <b>no contactados</b>. La distribución entre los agentes destino siempre es equitativa. Los registros ya capturados se conservan.</p>

    <div className="seg" style={{marginBottom:14}}>
      <button className={modo==="agente"?"on":""} onClick={()=>setModo("agente")}>Por agente</button>
      <button className={modo==="turno"?"on":""} onClick={()=>setModo("turno")}>Por turno</button>
    </div>

    {modo==="agente" ? (<div className="row" style={{gap:20,alignItems:"flex-start"}}>
      <div className="grow">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <b style={{fontSize:13}}>Desde</b>
          <button className="link" onClick={()=>setOrigenAgentes(origenAgentes.length===camp.agentIds.length?[]:camp.agentIds)}>{origenAgentes.length===camp.agentIds.length?"Ninguno":"Todos los agentes"}</button>
        </div>
        <div className="card" style={{maxHeight:220,overflow:"auto"}}>{campAgentes.map(a=>(
          <label key={a.id} className="checkline" style={{padding:"8px 12px"}}>
            <input type="checkbox" checked={origenAgentes.includes(a.id)} onChange={()=>toggleOrigenAgente(a.id)}/>
            <span className="grow">{a.nombre} <span className="tag">{a.turno}</span></span>
          </label>))}
        </div>
      </div>
      <div className="grow">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <b style={{fontSize:13}}>Hacia</b>
          <button className="link" onClick={()=>setDestinoAgentes(destinoAgentes.length===agentesDisponibles.length?[]:agentesDisponibles.map(a=>a.id))}>{destinoAgentes.length===agentesDisponibles.length?"Ninguno":"Todos los agentes disponibles"}</button>
        </div>
        <div className="card" style={{maxHeight:220,overflow:"auto"}}>{agentesDisponibles.map(a=>{const otras=otrasCampanasActivas(a.id,campaigns,camp.id);return(
          <label key={a.id} className="checkline" style={{padding:"8px 12px"}}>
            <input type="checkbox" checked={destinoAgentes.includes(a.id)} onChange={()=>toggleDestinoAgente(a.id)}/>
            <span className="grow">{a.nombre} <span className="tag">{a.turno}</span>
              {otras.length>0 && <span className="tag" style={{color:"var(--warn)",marginLeft:6}} title={otras.map(c=>c.titulo).join(", ")}>📌 {otras.length===1?otras[0].titulo:`${otras.length} bases activas`}</span>}
            </span>
          </label>);})}
        </div>
      </div>
    </div>) : (<div className="row" style={{gap:20}}>
      <div><b style={{fontSize:13,display:"block",marginBottom:6}}>Desde el turno</b>
        <div className="seg">{["AM","PM"].map(t=><button key={t} className={origenTurno===t?"on":""} onClick={()=>setOrigenTurno(t)}>{t}</button>)}</div></div>
      <div><b style={{fontSize:13,display:"block",marginBottom:6}}>Hacia el turno</b>
        <div className="seg">{["AM","PM"].map(t=><button key={t} className={destinoTurno===t?"on":""} onClick={()=>setDestinoTurno(t)}>{t}</button>)}</div></div>
    </div>)}

    <div className="divider"/>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
      <div className="grow"><b style={{fontSize:13}}>Centros elegibles (no contactados): {sourceCodes.length}</b><br/><small className="muted">Por defecto se reasignan todos; des-selecciona los que no quieras mover.</small></div>
      <button className="link" onClick={()=>setSelected(sourceCodes)}>Seleccionar todos</button>
      <button className="link" onClick={()=>setSelected([])}>Ninguno</button>
    </div>
    <div className="tbl-wrap scroll-y" style={{maxHeight:260}}><table>
      <thead><tr><th></th><th>Código</th><th>Centro</th><th>Agente actual</th><th>Estado</th></tr></thead>
      <tbody>{sourceCodes.map(code=>{const s=schools.find(x=>x.codigo===code);if(!s)return null;const r=recFor(code);return(
        <tr key={code}>
          <td><input type="checkbox" checked={selected.includes(code)} onChange={()=>toggleCode(code)}/></td>
          <td className="mono">{code}</td><td>{s.nombre}</td><td>{agName(asg[code])}</td>
          <td><Pill kind={statePill(r?r.estado:"Pendiente")}>{r?r.estado:"Pendiente"}</Pill></td>
        </tr>);})}
      {sourceCodes.length===0&&<tr><td colSpan={5}><div className="empty" style={{padding:18}}>No hay centros no contactados con esta selección de origen.</div></td></tr>}
      </tbody></table></div>

    {selected.length>0 && destinoIds.length>0 && <div className="card card-pad" style={{marginTop:14}}>
      <div className="section-title" style={{marginTop:0}}>Distribución equitativa</div>
      <p style={{margin:0,color:"var(--text-dim)"}}>Cada agente destino recibirá <b>{perAgent}</b> centros{resto>0&&<> y los primeros <b>{resto}</b> recibirán uno adicional</>}.</p>
      <div className="legend" style={{marginTop:10}}>{destinoIds.map((id,i)=><span key={id}><i style={{background:PALETTE[i%PALETTE.length]}}/>{agName(id)}: <b className="mono">{perAgent+(i<resto?1:0)}</b></span>)}</div>
    </div>}
  </Modal>);
}

/* ---- Gestionar centros cerrados por no contacto: reactivar o reasignar, uno a uno o en lote ---- */
function CerradosModal({ctx,camp,onClose}){
  const {campaigns,records,setRecords,setCampaigns,schools,users,session,notify}=ctx;
  const asg=getAssign(camp);
  const agName=id=>(users.find(u=>u.id===id)||{}).nombre||"—";
  const cerrados=camp.schoolCodes.filter(code=>{const r=records.find(rr=>rr.campaignId===camp.id&&rr.codigo===code);return r&&r.estado==="Cerrado por no contacto";});
  const [selected,setSelected]=useState(cerrados);
  useEffect(()=>{ setSelected(cerrados); },[JSON.stringify(cerrados)]);
  const agentesCamp=camp.agentIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
  const [destinoAgentes,setDestinoAgentes]=useState(camp.agentIds);

  const reactivarCodes=codes=>{
    setRecords(p=>p.map(r=>(r.campaignId===camp.id&&codes.includes(r.codigo))?{...r,estado:"Pendiente",intentos:0,wrong:[]}:r));
    if(supabase) actualizarRegistrosPorCodigosDB(camp.id,codes,{estado:"Pendiente",intentos:0,wrong:[]});
  };
  const reactivarUno=code=>{ reactivarCodes([code]); registrarAccion(session.id,"reactivar_cerrados",`${session.nombre} reactivó el centro ${code} en «${camp.titulo}»`); notify("Centro reactivado."); };
  const reactivarSeleccionados=()=>{ if(!selected.length) return; reactivarCodes(selected); registrarAccion(session.id,"reactivar_cerrados",`${session.nombre} reactivó ${selected.length} centro(s) en «${camp.titulo}»`); notify(`${selected.length} centro(s) reactivado(s).`); };

  const reasignarUno=(code,nuevoAgente)=>{
    if(!nuevoAgente) return;
    setCampaigns(p=>p.map(c=>c.id===camp.id?{...c,assign:{...getAssign(c),[code]:nuevoAgente}}:c));
    setRecords(p=>p.map(r=>(r.campaignId===camp.id&&r.codigo===code)?{...r,agentId:nuevoAgente,estado:"Pendiente",intentos:0,wrong:[]}:r));
    if(supabase) upsertRegistroDB(camp.id,code,{agentId:nuevoAgente,estado:"Pendiente",intentos:0,wrong:[]});
    registrarAccion(session.id,"reasignar",`${session.nombre} reasignó el centro cerrado ${code} en «${camp.titulo}»`);
    notify("Centro reasignado y reactivado.");
  };

  const toggleCode=code=>setSelected(p=>p.includes(code)?p.filter(x=>x!==code):[...p,code]);
  const toggleAgente=id=>setDestinoAgentes(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const perAgent=destinoAgentes.length?Math.floor(selected.length/destinoAgentes.length):0;
  const resto=destinoAgentes.length?selected.length%destinoAgentes.length:0;

  const reasignarSeleccionados=async()=>{
    if(!selected.length) return notify("No hay centros seleccionados.","err");
    if(!destinoAgentes.length) return notify("Selecciona al menos un agente destino.","err");
    const nuevoParcial=buildAssign(selected,destinoAgentes);
    setCampaigns(p=>p.map(c=>c.id===camp.id?{...c,assign:{...getAssign(c),...nuevoParcial}}:c));
    setRecords(p=>p.map(r=>(r.campaignId===camp.id&&selected.includes(r.codigo))?{...r,agentId:nuevoParcial[r.codigo],estado:"Pendiente",intentos:0,wrong:[]}:r));
    if(supabase) await actualizarRegistrosMasivoDB(camp.id,selected.map(codigo=>({codigo,agentId:nuevoParcial[codigo],estado:"Pendiente",intentos:0,wrong:[]})));
    registrarAccion(session.id,"reasignar",`${session.nombre} reasignó ${selected.length} centro(s) cerrado(s) en «${camp.titulo}»`);
    notify(`${selected.length} centro(s) reasignado(s) y reactivado(s) de forma equitativa.`);
    onClose();
  };

  return (<Modal title={`Centros cerrados por no contacto · ${camp.titulo}`} onClose={onClose} wide foot={<button className="btn btn-ghost" onClick={onClose}>Cerrar</button>}>
    <p style={{color:"var(--text-dim)",marginTop:0}}>Estos centros llegaron al máximo de intentos sin contactar. Puedes <b>reactivarlos</b> (vuelven a la bandeja con el mismo agente) o <b>reasignarlos</b> a otro agente (se reactivan automáticamente al reasignar).</p>

    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
      <div className="grow"><b style={{fontSize:13}}>Centros cerrados: {cerrados.length}</b></div>
      <button className="link" onClick={()=>setSelected(cerrados)}>Seleccionar todos</button>
      <button className="link" onClick={()=>setSelected([])}>Ninguno</button>
    </div>

    <div className="tbl-wrap scroll-y" style={{maxHeight:280}}><table>
      <thead><tr><th></th><th>Código</th><th>Centro</th><th>Agente actual</th><th>Intentos</th><th></th></tr></thead>
      <tbody>{cerrados.map(code=>{
        const s=schools.find(x=>x.codigo===code); if(!s) return null;
        const r=records.find(rr=>rr.campaignId===camp.id&&rr.codigo===code);
        return (<tr key={code}>
          <td><input type="checkbox" checked={selected.includes(code)} onChange={()=>toggleCode(code)}/></td>
          <td className="mono">{code}</td><td>{s.nombre}</td><td>{agName(asg[code])}</td>
          <td className="mono">{r?r.intentos:0}</td>
          <td style={{whiteSpace:"nowrap"}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>reactivarUno(code)}>Reactivar</button>
            <select className="input" style={{width:"auto",marginLeft:6,padding:"5px 8px"}} defaultValue="" onChange={e=>{const v=e.target.value;e.target.value="";reasignarUno(code,v);}}>
              <option value="" disabled>Reasignar a…</option>
              {agentesCamp.map(a=>{const otras=otrasCampanasActivas(a.id,campaigns,camp.id);return <option key={a.id} value={a.id}>{a.nombre}{otras.length>0?` (📌 ${otras.length===1?otras[0].titulo:otras.length+" bases activas"})`:""}</option>;})}
            </select>
          </td>
        </tr>);
      })}
      {cerrados.length===0 && <tr><td colSpan={6}><div className="empty" style={{padding:18}}>No hay centros cerrados por no contacto.</div></td></tr>}
      </tbody></table></div>

    <div className="divider"/>
    <button className="btn btn-primary btn-sm" onClick={reactivarSeleccionados} disabled={!selected.length}>Reactivar seleccionados ({selected.length})</button>

    <div className="card card-pad" style={{marginTop:14,background:"var(--surface-2)"}}>
      <div className="section-title" style={{marginTop:0}}>Reasignar seleccionados hacia…</div>
      <div className="card" style={{maxHeight:160,overflow:"auto"}}>{agentesCamp.map(a=>{const otras=otrasCampanasActivas(a.id,campaigns,camp.id);return(
        <label key={a.id} className="checkline" style={{padding:"8px 12px"}}>
          <input type="checkbox" checked={destinoAgentes.includes(a.id)} onChange={()=>toggleAgente(a.id)}/>
          <span className="grow">{a.nombre} <span className="tag">{a.turno}</span>
            {otras.length>0 && <span className="tag" style={{color:"var(--warn)",marginLeft:6}} title={otras.map(c=>c.titulo).join(", ")}>📌 {otras.length===1?otras[0].titulo:`${otras.length} bases activas`}</span>}
          </span>
        </label>);})}
      </div>
      {selected.length>0 && destinoAgentes.length>0 && <p style={{margin:"10px 0 0",color:"var(--text-dim)",fontSize:13}}>Se repartirán equitativamente: {destinoAgentes.map((id,i)=>`${agName(id)}: ${perAgent+(i<resto?1:0)}`).join(" · ")}</p>}
      <button className="btn btn-accent btn-sm" style={{marginTop:10}} onClick={reasignarSeleccionados} disabled={!selected.length||!destinoAgentes.length}>Reasignar seleccionados equitativamente</button>
    </div>
  </Modal>);
}

/* ---- Editor de preguntas de campaña: crear, duplicar, reordenar y condicionar (reutilizable en creación y edición) ---- */
function PreguntasBuilder({preguntas,setPreguntas}){
  const addQ=()=>setPreguntas(p=>[...p,blankPregunta(p)]);
  const duplicarQ=i=>setPreguntas(p=>{
    const copia=JSON.parse(JSON.stringify(p[i]));
    copia.id=nextId(p,"q");
    const arr=[...p];arr.splice(i+1,0,copia);return sanitizeConditions(arr);
  });
  const updQ=(i,patch)=>setPreguntas(p=>p.map((q,j)=>j===i?{...q,...patch}:q));
  const setTipoPregunta=(i,nuevoTipo)=>{
    const q=preguntas[i];const patch={tipo:nuevoTipo};
    if(nuevoTipo==="sino" && !q.opcionesFinaliza) patch.opcionesFinaliza={Sí:false,No:false};
    updQ(i,patch);
  };
  const delQ=i=>setPreguntas(p=>sanitizeConditions(p.filter((_,j)=>j!==i)));
  const moveQ=(i,dir)=>setPreguntas(p=>{
    const j=i+dir; if(j<0||j>=p.length) return p;
    const arr=[...p]; [arr[i],arr[j]]=[arr[j],arr[i]];
    return sanitizeConditions(arr);
  });
  const addOpcion=i=>updQ(i,{opciones:[...preguntas[i].opciones,blankOpcion()]});
  const updOpcion=(i,k,patch)=>updQ(i,{opciones:preguntas[i].opciones.map((o,oi)=>oi===k?{...o,...patch}:o)});
  const addParte=i=>updQ(i,{partes:[...(preguntas[i].partes||[]),blankParte(preguntas[i].partes)]});
  const duplicarParte=(i,pi)=>setPreguntas(p=>{
    const partes=p[i].partes;
    const copia=JSON.parse(JSON.stringify(partes[pi]));
    copia.id=nextId(partes,"p");
    const nuevasPartes=[...partes];nuevasPartes.splice(pi+1,0,copia);
    const arr=p.map((q,j)=>j===i?{...q,partes:nuevasPartes}:q);
    return sanitizeConditions(arr);
  });
  const updParte=(i,pi,patch)=>updQ(i,{partes:preguntas[i].partes.map((p,k)=>k===pi?{...p,...patch}:p)});
  const setTipoParte=(i,pi,nuevoTipo)=>{
    const p=preguntas[i].partes[pi];const patch={tipo:nuevoTipo};
    if(nuevoTipo==="sino" && !p.opcionesFinaliza) patch.opcionesFinaliza={Sí:false,No:false};
    updParte(i,pi,patch);
  };
  const delParte=(i,pi)=>setPreguntas(p=>sanitizeConditions(p.map((q,j)=>j===i?{...q,partes:q.partes.filter((_,k)=>k!==pi)}:q)));
  const moveParte=(i,pi,dir)=>setPreguntas(p=>{
    const partes=p[i].partes; const pj=pi+dir; if(pj<0||pj>=partes.length) return p;
    const nuevasPartes=[...partes]; [nuevasPartes[pi],nuevasPartes[pj]]=[nuevasPartes[pj],nuevasPartes[pi]];
    const arr=p.map((q,j)=>j===i?{...q,partes:nuevasPartes}:q);
    return sanitizeConditions(arr);
  });
  const updParteOpcion=(i,pi,k,patch)=>updQ(i,{partes:preguntas[i].partes.map((p,j)=>j===pi?{...p,opciones:p.opciones.map((o,oi)=>oi===k?{...o,...patch}:o)}:p)});
  const addParteOpcion=(i,pi)=>updQ(i,{partes:preguntas[i].partes.map((p,j)=>j===pi?{...p,opciones:[...p.opciones,blankOpcion()]}:p)});

  return (<div>
    <small className="muted">Define cada pregunta, su tipo de respuesta y sus opciones. Puedes indicar, por opción, un <b>valor a reportar</b> distinto al que ve el agente (para normalizar el dato en reportes y exportaciones). Una pregunta puede mostrarse solo si una pregunta previa (Sí/No, selección múltiple o lista desplegable) tuvo o no tuvo cierta respuesta. Puedes duplicar y reordenar preguntas y sub-preguntas; al reordenar, las condiciones que ya no apunten a algo anterior se limpian automáticamente. Este paso reemplaza cualquier campo fijo: si no agregas preguntas, la llamada se registrará como Contactada sin datos adicionales.</small>
    <div style={{marginTop:12}}>
      {preguntas.map((q,i)=>(
        <div className="qcard" key={q.id}>
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
            <span className="tag">{q.id.toUpperCase()}</span>
            <div className="row" style={{gap:2}}>
              <button className="btn btn-ghost btn-sm" disabled={i===0} onClick={()=>moveQ(i,-1)} title="Subir">↑</button>
              <button className="btn btn-ghost btn-sm" disabled={i===preguntas.length-1} onClick={()=>moveQ(i,1)} title="Bajar">↓</button>
            </div>
            <input className="input grow" value={q.texto} onChange={e=>updQ(i,{texto:e.target.value})} placeholder="Texto de la pregunta"/>
            <button className="btn btn-ghost btn-sm" onClick={()=>duplicarQ(i)}>⧉ Duplicar</button>
            {preguntas.length>1 && <button className="btn btn-danger btn-sm" onClick={()=>delQ(i)}>Eliminar</button>}
          </div>

          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8,flexWrap:"wrap"}}>
            <small className="muted">Tipo de respuesta</small>
            <select className="input" style={{width:"auto"}} value={q.tipo} onChange={e=>setTipoPregunta(i,e.target.value)}>
              {Q_TIPOS.map(t=><option key={t.k} value={t.k}>{t.t}</option>)}
            </select>
            <label className="checkline" style={{border:"none",padding:0,gap:5,marginLeft:6}}>
              <input type="checkbox" checked={!!q.obligatoria} onChange={e=>updQ(i,{obligatoria:e.target.checked})}/>
              <small className="muted">Obligatoria (el agente no puede guardar sin responderla)</small>
            </label>
          </div>

          {q.tipo==="sino" && <div style={{marginBottom:8}}>
            <small className="muted" style={{display:"block",marginBottom:6}}>Respuestas fijas: <span className="tag">Sí</span> <span className="tag">No</span></small>
            <label className="checkline" style={{border:"none",padding:0,gap:6,marginBottom:4}}>
              <input type="checkbox" checked={!!(q.opcionesFinaliza&&q.opcionesFinaliza["Sí"])} onChange={e=>updQ(i,{opcionesFinaliza:{...(q.opcionesFinaliza||{}),"Sí":e.target.checked}})}/>
              <small>Finaliza el formulario si responde <b>Sí</b> (no muestra las siguientes preguntas)</small>
            </label>
            <label className="checkline" style={{border:"none",padding:0,gap:6}}>
              <input type="checkbox" checked={!!(q.opcionesFinaliza&&q.opcionesFinaliza["No"])} onChange={e=>updQ(i,{opcionesFinaliza:{...(q.opcionesFinaliza||{}),"No":e.target.checked}})}/>
              <small>Finaliza el formulario si responde <b>No</b> (no muestra las siguientes preguntas)</small>
            </label>
          </div>}
          {q.tipo==="abierta" && <small className="muted" style={{display:"block"}}>El agente escribirá texto libre.</small>}
          {q.tipo==="fecha" && <small className="muted" style={{display:"block"}}>El agente seleccionará una fecha.</small>}
          {q.tipo==="hora" && <small className="muted" style={{display:"block"}}>El agente seleccionará una hora (hh:mm).</small>}
          {q.tipo==="lista" && <small className="muted" style={{display:"block"}}>Lista desplegable: el agente solo puede seleccionar una opción.</small>}

          {(q.tipo==="multiple"||q.tipo==="lista") && <>
            <small className="muted">Opciones {q.tipo==="multiple"?"(el agente puede marcar una o varias)":"(el agente elige solo una)"}</small>
            <div style={{display:"flex",flexDirection:"column",gap:6,margin:"6px 0"}}>
              {q.opciones.map((op,k)=>(
                <div key={k} className="row" style={{gap:6,alignItems:"center",flexWrap:"wrap"}}>
                  <input className="input" style={{width:160}} value={op.texto} placeholder={"Opción "+(k+1)}
                    onChange={e=>updOpcion(i,k,{texto:e.target.value})}/>
                  <input className="input" style={{width:160}} value={op.valorReporte} placeholder="Valor a reportar (opcional)"
                    onChange={e=>updOpcion(i,k,{valorReporte:e.target.value})}/>
                  <label className="checkline" style={{border:"none",padding:0,gap:5}}>
                    <input type="checkbox" checked={!!op.finaliza} onChange={e=>updOpcion(i,k,{finaliza:e.target.checked})}/>
                    <small className="muted">Finaliza el formulario</small>
                  </label>
                </div>
              ))}
              <button className="btn btn-ghost btn-sm" style={{width:"fit-content"}} onClick={()=>addOpcion(i)}>＋ opción</button>
            </div>
          </>}

          {q.tipo==="combinacion" && <div style={{marginTop:4}}>
            <small className="muted">Sub-respuestas que combina esta pregunta. Puedes condicionar una sub-respuesta según otra anterior de esta misma pregunta, e incluso marcar que finalice todo el formulario.</small>
            {(q.partes||[]).map((p,pi)=>(
              <div key={p.id} style={{border:"1px solid var(--border)",borderRadius:8,padding:10,margin:"8px 0",background:"var(--surface)"}}>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
                  <span className="tag">{p.id}</span>
                  <div className="row" style={{gap:2}}>
                    <button className="btn btn-ghost btn-sm" disabled={pi===0} onClick={()=>moveParte(i,pi,-1)} title="Subir">↑</button>
                    <button className="btn btn-ghost btn-sm" disabled={pi===q.partes.length-1} onClick={()=>moveParte(i,pi,1)} title="Bajar">↓</button>
                  </div>
                  <input className="input grow" style={{minWidth:140}} value={p.label} placeholder={"Etiqueta de la parte "+(pi+1)} onChange={e=>updParte(i,pi,{label:e.target.value})}/>
                  <select className="input" style={{width:"auto"}} value={p.tipo} onChange={e=>setTipoParte(i,pi,e.target.value)}>
                    {Q_TIPOS_SIMPLES.map(t=><option key={t.k} value={t.k}>{t.t}</option>)}
                  </select>
                  <label className="checkline" style={{border:"none",padding:0,gap:5}}>
                    <input type="checkbox" checked={!!p.obligatoria} onChange={e=>updParte(i,pi,{obligatoria:e.target.checked})}/>
                    <small className="muted">Obligatoria</small>
                  </label>
                  <button className="btn btn-ghost btn-sm" onClick={()=>duplicarParte(i,pi)}>⧉ Duplicar</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>delParte(i,pi)}>✕</button>
                </div>

                {p.tipo==="sino" && <div style={{marginBottom:8}}>
                  <small className="muted" style={{display:"block",marginBottom:6}}>Respuestas fijas: <span className="tag">Sí</span> <span className="tag">No</span></small>
                  <label className="checkline" style={{border:"none",padding:0,gap:6,marginBottom:4}}>
                    <input type="checkbox" checked={!!(p.opcionesFinaliza&&p.opcionesFinaliza["Sí"])} onChange={e=>updParte(i,pi,{opcionesFinaliza:{...(p.opcionesFinaliza||{}),"Sí":e.target.checked}})}/>
                    <small>Finaliza el formulario si responde <b>Sí</b></small>
                  </label>
                  <label className="checkline" style={{border:"none",padding:0,gap:6}}>
                    <input type="checkbox" checked={!!(p.opcionesFinaliza&&p.opcionesFinaliza["No"])} onChange={e=>updParte(i,pi,{opcionesFinaliza:{...(p.opcionesFinaliza||{}),"No":e.target.checked}})}/>
                    <small>Finaliza el formulario si responde <b>No</b></small>
                  </label>
                </div>}

                {(p.tipo==="multiple"||p.tipo==="lista") && <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {(p.opciones||[]).map((op,k)=>(
                    <div key={k} className="row" style={{gap:6,alignItems:"center",flexWrap:"wrap"}}>
                      <input className="input" style={{width:130}} value={op.texto} placeholder={"Opción "+(k+1)}
                        onChange={e=>updParteOpcion(i,pi,k,{texto:e.target.value})}/>
                      <input className="input" style={{width:130}} value={op.valorReporte} placeholder="Valor a reportar"
                        onChange={e=>updParteOpcion(i,pi,k,{valorReporte:e.target.value})}/>
                      <label className="checkline" style={{border:"none",padding:0,gap:5}}>
                        <input type="checkbox" checked={!!op.finaliza} onChange={e=>updParteOpcion(i,pi,k,{finaliza:e.target.checked})}/>
                        <small className="muted">Finaliza</small>
                      </label>
                    </div>))}
                  <button className="btn btn-ghost btn-sm" style={{width:"fit-content"}} onClick={()=>addParteOpcion(i,pi)}>＋ opción</button>
                </div>}

                {pi>0 && <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <small className="muted">Condición:</small>
                  <select className="input" style={{width:"auto"}} value={p.cond?p.cond.p:""} onChange={e=>updParte(i,pi,{cond:e.target.value?{p:e.target.value,op:"",mode:"eq"}:null})}>
                    <option value="">Mostrar siempre</option>
                    {q.partes.slice(0,pi).filter(sp=>(sp.label||sp.id)&&esCondicionable(sp)).map(sp=><option key={sp.id} value={sp.id}>Según {sp.label||sp.id}</option>)}
                  </select>
                  {p.cond && <select className="input" style={{width:"auto"}} value={p.cond.mode||"eq"} onChange={e=>updParte(i,pi,{cond:{...p.cond,mode:e.target.value}})}>
                    <option value="eq">es igual a</option>
                    <option value="neq">es diferente de</option>
                  </select>}
                  {p.cond && <select className="input" style={{width:"auto"}} value={p.cond.op} onChange={e=>updParte(i,pi,{cond:{...p.cond,op:e.target.value}})}>
                    <option value="">elige opción</option>
                    {opcionesDe(q.partes.find(sp=>sp.id===p.cond.p)||{}).map(o=><option key={o}>{o}</option>)}
                  </select>}
                </div>}
              </div>
            ))}
            <button className="btn btn-ghost btn-sm" onClick={()=>addParte(i)}>＋ Agregar sub-respuesta</button>
          </div>}

          {i>0 && <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <small className="muted">Condición:</small>
            <select className="input" style={{width:"auto"}} value={q.cond?q.cond.q:""} onChange={e=>updQ(i,{cond:e.target.value?{q:e.target.value,op:"",mode:"eq"}:null})}>
              <option value="">Mostrar siempre</option>
              {preguntas.slice(0,i).filter(p=>p.texto&&esCondicionable(p)).map(p=><option key={p.id} value={p.id}>Según {p.id.toUpperCase()}</option>)}
            </select>
            {q.cond && <select className="input" style={{width:"auto"}} value={q.cond.mode||"eq"} onChange={e=>updQ(i,{cond:{...q.cond,mode:e.target.value}})}>
              <option value="eq">es igual a</option>
              <option value="neq">es diferente de</option>
            </select>}
            {q.cond && <select className="input" style={{width:"auto"}} value={q.cond.op} onChange={e=>updQ(i,{cond:{...q.cond,op:e.target.value}})}>
              <option value="">elige opción</option>
              {opcionesDe(preguntas.find(p=>p.id===q.cond.q)||{}).map(o=><option key={o}>{o}</option>)}
            </select>}
          </div>}
        </div>
      ))}
      <button className="btn btn-ghost btn-sm" onClick={addQ}>＋ Agregar pregunta</button>
    </div>
  </div>);
}

/* ---- Editar las preguntas de una campaña ya creada (Admin/Supervisor/Team leader) ---- */
function EditQuestionsModal({ctx,camp,onClose}){
  const {setCampaigns,session,notify}=ctx;
  const [preguntas,setPreguntas]=useState(()=>{
    const base=camp.preguntas&&camp.preguntas.length?camp.preguntas:[blankPregunta([])];
    return JSON.parse(JSON.stringify(base));
  });
  const guardar=()=>{
    const limpio=preguntas.filter(q=>q.texto).map(limpiaPregunta);
    setCampaigns(p=>p.map(c=>c.id===camp.id?{...c,preguntas:limpio}:c));
    if(supabase) actualizarCampanaDB(camp.id,{preguntas:limpio});
    registrarAccion(session.id,"editar_preguntas",`${session.nombre} editó las preguntas de «${camp.titulo}»`);
    notify("Preguntas de la campaña actualizadas.");
    onClose();
  };
  return (<Modal title={`Editar preguntas · ${camp.titulo}`} onClose={onClose} wide foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-accent" onClick={guardar}>Guardar cambios</button></>}>
    <div className="alert alert-info" style={{marginTop:0}}>Los cambios se aplican a partir de ahora. Las actividades ya registradas conservan las respuestas dadas con la configuración anterior.</div>
    <PreguntasBuilder preguntas={preguntas} setPreguntas={setPreguntas}/>
  </Modal>);
}

/* ---- Asistente de creación de campaña ---- */
function CampaignWizard({ctx,onClose,borradorInicial}){
  const {schools,setSchools,users,campaigns,setCampaigns,filtro,session,notify}=ctx;
  const bd=borradorInicial&&borradorInicial.borradorEstado||{};
  const [step,setStep]=useState(bd.step||0);
  const steps=["Datos","Preguntas","Centros escolares","Agentes","Resumen"];
  const [titulo,setTitulo]=useState(borradorInicial?borradorInicial.titulo:"");
  const [objetivo,setObjetivo]=useState(borradorInicial?borradorInicial.objetivo:"");
  const [fDesde,setFDesde]=useState(borradorInicial?borradorInicial.fechaDesde:filtro.desde);
  const [fHasta,setFHasta]=useState(borradorInicial?borradorInicial.fechaHasta:filtro.hasta);
  const [maxIntentos,setMaxIntentos]=useState(borradorInicial?borradorInicial.maxIntentos:DEFAULT_MAX_INTENTOS);
  const modoFecha=fDesde===fHasta?"dia":"periodo";
  const setModoFecha=m=>{ if(m==="dia") setFHasta(fDesde); else if(fHasta===fDesde) setFHasta(addDays(fDesde,6)); };
  // preguntas de la campaña (100% parametrizables; reemplazan cualquier esquema fijo de "actividad")
  const [preguntas,setPreguntas]=useState(borradorInicial&&borradorInicial.preguntas&&borradorInicial.preguntas.length?borradorInicial.preguntas:[blankPregunta([])]);
  const [selMode,setSelMode]=useState(bd.selMode||"todos");
  const [manual,setManual]=useState(bd.manual||[]);
  const [grupo,setGrupo]=useState(bd.grupo||{tipo:"departamento",valor:DEPTOS[0]});
  const [uploaded,setUploaded]=useState([]);const [upInfo,setUpInfo]=useState(null);
  // solo agentes Outbound, activos y disponibles (Inbound y SDP no reciben llamadas de campaña)
  const pool=users.filter(u=>u.rol==="Agente"&&u.estado==="activo"&&u.skill!=="Inbound"&&u.skill!=="SDP"&&u.disponible!==false);
  const [turno,setTurno]=useState(bd.turno||"Todos");
  const [agSel,setAgSel]=useState(bd.agSel||pool.map(a=>a.id));

  // ---- borrador autoguardado en Supabase (para que Admin/Supervisor/Team Leader puedan continuarlo desde cualquier lugar) ----
  const [borradorId,setBorradorId]=useState(borradorInicial?borradorInicial.id:null);
  const [continuandoBorrador]=useState(!!borradorInicial);
  const primerRenderRef=useRef(true);
  useEffect(()=>{
    if(primerRenderRef.current){ primerRenderRef.current=false; return; } // no autoguardar antes de que el usuario toque algo
    if(!supabase) return;
    const t=setTimeout(async()=>{
      const nuevoId=await guardarBorradorDB({
        titulo,objetivo,fechaDesde:fDesde,fechaHasta:fHasta,maxIntentos,preguntas,
        estadoAsistente:{selMode,manual,grupo,turno,agSel,step},creadoPor:session.id,
      },borradorId);
      if(nuevoId && !borradorId){
        setBorradorId(nuevoId);
        setCampaigns(p=>[...p,{id:nuevoId,titulo,objetivo,fechaDesde:fDesde,fechaHasta:fHasta,maxIntentos,preguntas,estado:"Borrador",pausada:false,agentIds:[],schoolCodes:[],assign:{},creadoPor:session.id,actualizadoEn:Date.now()}]);
      } else if(nuevoId){
        setCampaigns(p=>p.map(c=>c.id===nuevoId?{...c,titulo,objetivo,fechaDesde:fDesde,fechaHasta:fHasta,maxIntentos,preguntas,actualizadoEn:Date.now()}:c));
      }
    },800);
    return ()=>clearTimeout(t);
  },[titulo,objetivo,fDesde,fHasta,maxIntentos,preguntas,selMode,manual,grupo,turno,agSel,step]);

  const selectedSchools=useMemo(()=>{
    if(selMode==="archivo")return uploaded;
    if(selMode==="todos")return schools;
    if(selMode==="manual")return schools.filter(s=>manual.includes(s.codigo));
    const {tipo,valor}=grupo;
    const igual=(a,b)=>String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();
    return schools.filter(s=>{if(tipo==="departamento")return igual(s.departamento,valor);if(tipo==="municipio")return igual(s.municipio,valor);if(tipo==="distrito")return igual(s.distrito,valor);if(tipo==="programa")return igual(s.programa,"Despega");if(tipo==="modernizacion")return s.modernizacion;if(tipo==="fase")return String(s.fase)===String(valor);if(tipo==="control")return s.control;return false;});
  },[selMode,manual,grupo,schools,uploaded]);
  const agAvail=pool.filter(a=>turno==="Todos"||a.turno===turno);
  const finalAgents=agAvail.filter(a=>agSel.includes(a.id));
  const ordenEs=(a,b)=>a.localeCompare(b,"es",{sensitivity:"base"});
  const grupoOptions={departamento:DEPTOS,municipio:[...new Set(schools.map(s=>s.municipio))].sort(ordenEs),distrito:[...new Set(schools.map(s=>s.distrito))].sort(ordenEs),fase:["1","2","3"],programa:[],modernizacion:[],control:[]};

  const onFile=file=>{if(!file)return;setUpInfo({nombre:file.name,cargando:true});parseSchoolFile(file,(err,res)=>{if(err){setUploaded([]);setUpInfo({nombre:file.name,error:err.message});return;}const vistos={},lista=[];res.validos.forEach(s=>{if(!vistos[s.codigo]){vistos[s.codigo]=1;lista.push(s);}});setUploaded(lista);setUpInfo({nombre:file.name,cargados:lista.length,omitidos:res.omitidos,hoja:res.hoja});});};

  const [creando,setCreando]=useState(false);
  const launch=async()=>{
    const codes=selectedSchools.map(s=>s.codigo);const agentIds=finalAgents.map(a=>a.id);
    if(selMode==="archivo"&&uploaded.length){setSchools(prev=>{const map={};prev.forEach(s=>map[s.codigo]=s);uploaded.forEach(s=>map[s.codigo]={...map[s.codigo],...s});return Object.values(map);});}
    const camp={id:borradorId||uid("c"),titulo:titulo||"Campaña sin título",objetivo,fechaDesde:fDesde,fechaHasta:fHasta,maxIntentos:Number(maxIntentos)||DEFAULT_MAX_INTENTOS,
      preguntas:preguntas.filter(q=>q.texto).map(limpiaPregunta),
      schoolCodes:codes,agentIds,assign:buildAssign(codes,agentIds),estado:"En curso",pausada:false};
    if(supabase){
      setCreando(true);
      const idReal=await crearCampanaDB(camp,borradorId);
      setCreando(false);
      if(!idReal) return notify("No se pudo crear la campaña en la base de datos.","err");
      camp.id=idReal;
    }
    setCampaigns(p=> borradorId?p.map(c=>c.id===borradorId?camp:c):[...p,camp]); // si venía de un borrador, reemplaza esa misma fila
    registrarAccion(session.id,"crear_campana",`${session.nombre} creó la campaña «${camp.titulo}» (${codes.length} centros, ${agentIds.length} agentes)`);
    notify(`Campaña creada · ${codes.length} centros entre ${agentIds.length} agentes`);onClose();
  };
  const perAgent=finalAgents.length?Math.floor(selectedSchools.length/finalAgents.length):0;
  const resto=finalAgents.length?selectedSchools.length%finalAgents.length:0;
  const foot=<>
    {step>0&&<button className="btn btn-ghost" onClick={()=>setStep(step-1)}>Atrás</button>}
    {step<steps.length-1?<button className="btn btn-primary" onClick={()=>setStep(step+1)}>Siguiente</button>
      :<button className="btn btn-accent" disabled={!finalAgents.length||!selectedSchools.length||!titulo.trim()||creando} onClick={launch}>{creando?"Creando…":"Crear campaña"}</button>}
  </>;
  return (<Modal title="Nueva campaña" onClose={onClose} wide foot={foot}>
    <div className="stepper">{steps.map((s,i)=><div key={s} className={"step"+(i===step?" on":i<step?" done":"")}><b>{i<step?"✓":i+1}</b>{s}</div>)}</div>
    {continuandoBorrador && <small className="muted" style={{display:"block",marginBottom:10}}>💾 Continuando desde un borrador guardado.</small>}

    {step===0 && <div>
      <div className="field"><label>Título de la campaña</label><input className="input" value={titulo} onChange={e=>setTitulo(e.target.value)} placeholder="Ej. Actividades semanales de CE"/></div>
      <div className="field">
        <label>Fecha de trabajo</label>
        <div className="seg" style={{marginBottom:8}}>
          <button className={modoFecha==="dia"?"on":""} onClick={()=>setModoFecha("dia")}>Un día</button>
          <button className={modoFecha==="periodo"?"on":""} onClick={()=>setModoFecha("periodo")}>Período</button>
        </div>
        {modoFecha==="dia"
          ? <input className="input" type="date" style={{width:"auto"}} value={fDesde} onChange={e=>{setFDesde(e.target.value);setFHasta(e.target.value);}}/>
          : <div className="row" style={{gap:10}}>
              <div><small className="muted">Desde</small><input className="input" type="date" value={fDesde} max={fHasta} onChange={e=>setFDesde(e.target.value)}/></div>
              <div><small className="muted">Hasta</small><input className="input" type="date" value={fHasta} min={fDesde} onChange={e=>setFHasta(e.target.value)}/></div>
            </div>}
        <small className="muted" style={{display:"block",marginTop:6}}>Toda la información registrada quedará asociada a {modoFecha==="dia"?"esta fecha":"este período"}.</small>
      </div>
      <div className="field"><label>Cantidad máxima de intentos antes de cerrar por no contacto</label>
        <input className="input" type="number" min={1} max={10} style={{width:100}} value={maxIntentos} onChange={e=>setMaxIntentos(e.target.value)}/>
        <small className="muted" style={{display:"block",marginTop:6}}>Al llegar a este número de intentos sin contactar, el centro se cierra automáticamente y desaparece de la bandeja.</small></div>
      <div className="field"><label>Objetivo</label><textarea className="input" rows={2} placeholder="Ej. Registrar las actividades programadas para el período." value={objetivo} onChange={e=>setObjetivo(e.target.value)}/></div>
    </div>}

    {step===1 && <PreguntasBuilder preguntas={preguntas} setPreguntas={setPreguntas}/>}

    {step===2 && <div>
      <div className="seg" style={{marginBottom:14,flexWrap:"wrap"}}>{[["todos","Todos"],["manual","Selección manual"],["grupo","Por grupo"],["archivo","Cargar archivo"]].map(([k,t])=><button key={k} className={selMode===k?"on":""} onClick={()=>setSelMode(k)}>{t}</button>)}</div>
      {selMode!=="archivo"&&<small className="muted">Origen: catálogo de centros educativos (base institucional).</small>}
      {selMode==="grupo"&&<div className="row" style={{gap:10,margin:"12px 0"}}>
        <select className="input" style={{width:"auto"}} value={grupo.tipo} onChange={e=>setGrupo({tipo:e.target.value,valor:(grupoOptions[e.target.value]||[])[0]||""})}>
          <option value="departamento">Departamento</option><option value="municipio">Municipio</option><option value="distrito">Distrito</option><option value="programa">Programa Despega</option><option value="modernizacion">Modernización</option><option value="fase">Fase</option><option value="control">Centros control</option></select>
        {(grupoOptions[grupo.tipo]||[]).length>0&&<select className="input" style={{width:"auto"}} value={grupo.valor} onChange={e=>setGrupo(g=>({...g,valor:e.target.value}))}>{grupoOptions[grupo.tipo].map(v=><option key={v}>{v}</option>)}</select>}
      </div>}
      {selMode==="archivo"&&<div style={{margin:"12px 0"}}>
        <div style={{border:"1.5px dashed var(--border-strong)",borderRadius:12,padding:18,background:"var(--surface-2)",textAlign:"center"}}>
          <div style={{fontSize:26,opacity:.6}}>📄</div><p style={{margin:"6px 0 12px",color:"var(--text-dim)"}}>Carga un archivo <b>CSV</b> o <b>Excel</b> con los centros educativos.</p>
          <label className="btn btn-primary btn-sm" style={{display:"inline-flex",cursor:"pointer"}}>Seleccionar archivo<input type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}} onChange={e=>onFile(e.target.files[0])}/></label>
          <button className="btn btn-ghost btn-sm" style={{marginLeft:8}} onClick={downloadTemplate}>⬇ Descargar plantilla</button>
        </div>
        <small className="muted" style={{display:"block",marginTop:8}}>Columnas reconocidas: Código, Nombre, Departamento, Municipio, Distrito, Teléfono(s), Programa, Modernización, Fase, Centro Control.</small>
        {upInfo&&(upInfo.error?<div className="alert alert-err" style={{marginTop:10}}>No se pudo procesar «{upInfo.nombre}»: {upInfo.error}</div>:upInfo.cargando?<div className="alert alert-info" style={{marginTop:10}}>Procesando…</div>:<div className="alert alert-ok" style={{marginTop:10}}>«{upInfo.nombre}»: <b>{upInfo.cargados}</b> centros cargados{upInfo.omitidos>0&&<> · {upInfo.omitidos} omitidos</>}.</div>)}
      </div>}
      <div className="tag" style={{margin:"6px 0 10px",display:"inline-block"}}>{selectedSchools.length} centros seleccionados</div>
      <div className="tbl-wrap scroll-y"><table><thead><tr>{selMode==="manual"&&<th></th>}<th>Código</th><th>Centro</th><th>Depto.</th><th>Teléfonos</th></tr></thead>
        <tbody>{(selMode==="archivo"?uploaded:schools).map(s=>{const inG=selectedSchools.some(x=>x.codigo===s.codigo);if(selMode==="grupo"&&!inG)return null;return(<tr key={s.codigo}>
          {selMode==="manual"&&<td><input type="checkbox" checked={manual.includes(s.codigo)} onChange={()=>setManual(m=>m.includes(s.codigo)?m.filter(x=>x!==s.codigo):[...m,s.codigo])}/></td>}
          <td className="mono">{s.codigo}</td><td>{s.nombre}</td><td>{s.departamento}</td><td className="mono" style={{fontSize:12}}>{(s.telefonos||[]).join(" · ")}</td></tr>);})}
        </tbody></table>{selMode==="archivo"&&uploaded.length===0&&<div className="empty" style={{padding:24}}>Aún no has cargado un archivo.</div>}</div>
    </div>}

    {step===3 && <div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,flexWrap:"wrap"}}>
        <small className="muted">Solo agentes con skill <b>Outbound</b>, activos y disponibles. Filtrar por turno:</small>
        <div className="seg">{["Todos","AM","PM"].map(t=><button key={t} className={turno===t?"on":""} onClick={()=>setTurno(t)}>{t}</button>)}</div>
      </div>
      <small className="muted">Todos van seleccionados por defecto. Des-selecciona a quienes estén de día libre.</small>
      <div className="card" style={{marginTop:10}}>{agAvail.map(a=>{
        const otrasCamps=campaigns.filter(c=>c.estado==="En curso"&&c.agentIds.includes(a.id));
        return (
        <label key={a.id} className="checkline" style={{padding:"10px 14px"}}>
          <input type="checkbox" checked={agSel.includes(a.id)} onChange={()=>setAgSel(s=>s.includes(a.id)?s.filter(x=>x!==a.id):[...s,a.id])}/>
          <div className="avatar" style={{background:"var(--surface-3)",color:"var(--text)"}}>{a.nombre.split(" ").map(x=>x[0]).slice(0,2).join("")}</div>
          <div className="grow"><b>{a.nombre}</b> <span className="tag">Turno {a.turno}</span> <span className="badge badge-out">Outbound</span>
            {otrasCamps.length>0 && <span className="tag" style={{color:"var(--warn)"}} title={otrasCamps.map(c=>c.titulo).join(", ")}>📌 {otrasCamps.length===1?otrasCamps[0].titulo:`${otrasCamps.length} campañas activas`}</span>}
          </div>
          <Pill kind={opPill(a.opStatus)}>{a.opStatus}</Pill></label>);})}
        {agAvail.length===0&&<div className="empty" style={{padding:20}}>No hay agentes Outbound disponibles en este turno.</div>}</div>
    </div>}

    {step===4 && <div>
      <div className="row" style={{gap:14}}>
        <div className="card card-pad grow"><div className="stat"><span className="k">Centros</span><span className="v">{selectedSchools.length}</span></div></div>
        <div className="card card-pad grow"><div className="stat"><span className="k">Agentes</span><span className="v">{finalAgents.length}</span></div></div>
        <div className="card card-pad grow"><div className="stat"><span className="k">Preguntas</span><span className="v">{preguntas.filter(q=>q.texto).length}</span></div></div>
        <div className="card card-pad grow"><div className="stat"><span className="k">Fecha</span><span className="v" style={{fontSize:16}}>{rangeLabel(fDesde,fHasta)}</span></div></div>
      </div>
      <div className="card card-pad" style={{marginTop:14}}>
        <div className="section-title" style={{marginTop:0}}>Asignación equitativa</div>
        <p style={{margin:0,color:"var(--text-dim)"}}>Cada agente recibirá <b>{perAgent}</b> centros{resto>0&&<> y los primeros <b>{resto}</b> recibirán uno adicional</>}.</p>
        <div className="legend" style={{marginTop:12}}>{finalAgents.map((a,i)=><span key={a.id}><i style={{background:PALETTE[i%PALETTE.length]}}/>{a.nombre}: <b className="mono">{perAgent+(i<resto?1:0)}</b></span>)}</div>
      </div>
      <div className="alert alert-info" style={{marginTop:14}}>«{titulo||"Campaña sin título"}» quedará <b>En curso</b> junto a las demás campañas activas (puedes gestionar varias en paralelo). Se cerrará por no contacto automáticamente tras {maxIntentos} intentos.</div>
    </div>}
  </Modal>);
}

/* ============================ CONSULTA Y EDICIÓN (INBOUND) ============================ */
function Consulta({ctx}){
  const {schools,campaigns,filtro}=ctx;
  const [q,setQ]=useState("");
  const [sel,setSel]=useState(null);
  const [campSel,setCampSel]=useState("todas");
  const campanasOrdenadas=useMemo(()=>[...campaigns].sort((a,b)=>a.titulo.localeCompare(b.titulo,"es")),[campaigns]);
  const res=useMemo(()=>{
    let base=schools;
    if(campSel!=="todas"){
      const camp=campaigns.find(c=>c.id===campSel);
      base=camp?schools.filter(s=>camp.schoolCodes.includes(s.codigo)):[];
    }
    const t=_norm(q);
    if(!t)return base.slice(0,8);
    return base.filter(s=>_norm(s.nombre).includes(t)||_norm(s.codigo).includes(t)||_norm(s.departamento).includes(t)||_norm(s.municipio).includes(t)).slice(0,30);
  },[q,schools,campSel,campaigns]);
  return (<div className="grid" style={{gridTemplateColumns:"360px 1fr",alignItems:"start"}}>
    <div className="grid">
      <div className="field" style={{margin:0}}><label>Campaña</label>
        <select className="input" value={campSel} onChange={e=>setCampSel(e.target.value)}>
          <option value="todas">Todas las campañas</option>
          {campanasOrdenadas.map(c=><option key={c.id} value={c.id}>{c.titulo}</option>)}
        </select>
      </div>
      <div className="searchbar"><span>🔎</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Nombre, código, departamento o municipio"/></div>
      <div className="card"><div className="toggle-list">
        {res.map(s=>(<button key={s.codigo} className="row-item" style={{textAlign:"left",background:sel===s.codigo?"var(--surface-2)":"none"}} onClick={()=>setSel(s.codigo)}>
          <div className="grow"><b style={{fontSize:13.5}}>{s.nombre}</b><div className="mini mono">{s.codigo} · {s.municipio}, {s.departamento}</div></div><span style={{color:"var(--text-faint)"}}>›</span></button>))}
        {res.length===0&&<div className="empty" style={{padding:24}}>Sin coincidencias.</div>}
      </div></div>
    </div>
    {sel?<InboundCE ctx={ctx} codigo={sel} campaniaId={campSel!=="todas"?campSel:null}/>:<div className="card card-pad"><div className="empty" style={{padding:"40px 10px"}}><div className="big">🔎</div>Busca y selecciona un Centro Educativo para consultar o editar sus actividades de {rangeLabel(filtro.desde,filtro.hasta)}.</div></div>}
  </div>);
}
function InboundCE({ctx,codigo,campaniaId}){
  const {schools,campaigns,records,setRecords,filtro,session,notify}=ctx;
  const can=CAN[session.rol];
  const s=schools.find(x=>x.codigo===codigo);
  const campsRango=campaniaId?campaigns.filter(c=>c.id===campaniaId):campaigns.filter(c=>overlaps(c.fechaDesde,c.fechaHasta,filtro.desde,filtro.hasta));
  const recs=records.filter(r=>r.codigo===codigo && campsRango.some(c=>c.id===r.campaignId));
  // campaña destino para agregar (si no hay registro): la elegida en el filtro, o la primera del rango que incluya el CE
  const campDestino=campsRango.find(c=>c.schoolCodes.includes(codigo));
  const [edit,setEdit]=useState(null); // {recId, idx}
  const [editAns,setEditAns]=useState({});
  const [adding,setAdding]=useState(false);
  const [nuevaAns,setNuevaAns]=useState({});

  const bloqueadoPorSDP=session.skill==="SDP";
  const puedeEditar=r=>!bloqueadoPorSDP && (can.editarTodo || (can.editar && r.agentId===session.id));
  const puedeAgregar=can.editar && !bloqueadoPorSDP;
  const guardarAct=(recId,idx)=>{
    let campaignId=null,codigoCE=null,actividadesNuevas=null;
    setRecords(p=>p.map(r=>{
      if(r.id!==recId)return r;
      const arr=[...(r.actividades||[])];if(idx!=null)arr[idx]=editAns;else arr.push(editAns);
      campaignId=r.campaignId;codigoCE=r.codigo;actividadesNuevas=arr;
      return {...r,actividades:arr,estado:"Contactado",updatedMs:Date.now()};
    }));
    if(supabase&&campaignId) upsertRegistroDB(campaignId,codigoCE,{actividades:actividadesNuevas,estado:"Contactado"});
    setEdit(null);setEditAns({});notify(idx!=null?"Actividad actualizada.":"Actividad agregada.");
  };
  const eliminarAct=(recId,idx)=>{
    let campaignId=null,codigoCE=null,actividadesNuevas=null;
    setRecords(p=>p.map(r=>{
      if(r.id!==recId)return r;
      const arr=r.actividades.filter((_,i)=>i!==idx);
      campaignId=r.campaignId;codigoCE=r.codigo;actividadesNuevas=arr;
      return {...r,actividades:arr,updatedMs:Date.now()};
    }));
    if(supabase&&campaignId) upsertRegistroDB(campaignId,codigoCE,{actividades:actividadesNuevas});
    notify("Actividad eliminada.");
  };
  const crearRegistro=()=>{
    if(!campDestino)return notify("Este centro no pertenece a ninguna campaña del rango seleccionado.","err");
    const faltantes=preguntasObligatoriasFaltantes(campDestino.preguntas||[],nuevaAns);
    if(faltantes.length) return notify("Faltan preguntas obligatorias por responder: "+faltantes.join(", "),"err");
    const agentIdFinal=(getAssign(campDestino)[codigo])||session.id;
    const nr={id:uid("rec"),campaignId:campDestino.id,codigo,agentId:agentIdFinal,estado:"Contactado",intentos:0,actividades:[nuevaAns],wrong:[],dur:0,updatedMs:Date.now()};
    setRecords(p=>{ const existe=p.some(r=>r.campaignId===campDestino.id&&r.codigo===codigo); return existe?p.map(r=>(r.campaignId===campDestino.id&&r.codigo===codigo)?nr:r):[...p,nr]; });
    if(supabase) upsertRegistroDB(campDestino.id,codigo,{agentId:agentIdFinal,estado:"Contactado",actividades:[nuevaAns]});
    setAdding(false);setNuevaAns({});notify("Registro creado con la actividad.");
  };

  return (<div className="grid">
    <div className="card card-pad">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
        <div><h4 style={{margin:0}}>{s.nombre}</h4><div className="mini mono">{s.codigo} · {s.municipio}, {s.departamento} · Tel: {s.telefonos.join(" · ")}</div></div>
        <span className="tag">📅 {rangeLabel(filtro.desde,filtro.hasta)}</span>
      </div>
    </div>

    {recs.length===0 && <div className="card card-pad">
      <div className="empty" style={{padding:20}}>No hay actividades registradas para este rango de fechas.</div>
      {puedeAgregar && campDestino && (adding
        ? <div className="card card-pad" style={{background:"var(--surface-2)",marginTop:10}}>
            <PreguntasEditor preguntas={campDestino.preguntas||[]} ans={nuevaAns} setAns={setNuevaAns}/>
            {(()=>{const f=preguntasObligatoriasFaltantes(campDestino.preguntas||[],nuevaAns);return f.length>0 && <div className="alert alert-err" style={{marginBottom:8}}>Faltan preguntas obligatorias: {f.join(", ")}</div>;})()}
            <div style={{display:"flex",gap:8,marginTop:6}}>
              <button className="btn btn-primary btn-sm" disabled={preguntasObligatoriasFaltantes(campDestino.preguntas||[],nuevaAns).length>0} onClick={crearRegistro}>Guardar respuesta</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>{setAdding(false);setNuevaAns({});}}>Cancelar</button>
            </div>
          </div>
        : <div style={{textAlign:"center"}}><button className="btn btn-accent btn-sm" onClick={()=>setAdding(true)}>＋ Registrar actividad (inbound)</button></div>)}
      {can.editar && !campDestino && <div className="banner banner-warn">Este centro no pertenece a ninguna campaña del rango seleccionado, por lo que no puede registrarse aún.</div>}
      {bloqueadoPorSDP && <div className="banner banner-warn">Tu skill es SDP: no puedes registrar ni editar actividades en campañas.</div>}
    </div>}

    {recs.map(r=>{const camp=campaigns.find(c=>c.id===r.campaignId);const editable=puedeEditar(r);const preguntas=camp?camp.preguntas||[]:[];return(
      <div key={r.id} className="card card-pad">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
          <Pill kind={statePill(r.estado)}>{r.estado}</Pill>
          <span className="tag">{camp?camp.titulo:"—"}</span>
          <span className="mini">{r.actividades?r.actividades.length:0} actividad(es)</span>
          {!editable && <span className="tag" style={{marginLeft:"auto"}}>Solo lectura</span>}
        </div>
        {(r.actividades||[]).map((a,i)=>(edit&&edit.recId===r.id&&edit.idx===i
          ? <div key={i} className="card card-pad" style={{background:"var(--surface-2)",marginBottom:10}}>
              <PreguntasEditor preguntas={preguntas} ans={editAns} setAns={setEditAns}/>
              {(()=>{const f=preguntasObligatoriasFaltantes(preguntas,editAns);return f.length>0 && <div className="alert alert-err" style={{marginBottom:8}}>Faltan preguntas obligatorias: {f.join(", ")}</div>;})()}
              <div style={{display:"flex",gap:8,marginTop:6}}>
                <button className="btn btn-primary btn-sm" disabled={preguntasObligatoriasFaltantes(preguntas,editAns).length>0} onClick={()=>guardarAct(r.id,i)}>Guardar cambios</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>{setEdit(null);setEditAns({});}}>Cancelar</button>
              </div>
            </div>
          : <div key={i} className="act-card">
              <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                <div className="grow"><ActividadResumen preguntas={preguntas} act={a}/></div>
                {editable&&<span style={{display:"flex",gap:8,flex:"none"}}>
                  <button className="link" onClick={()=>{setEdit({recId:r.id,idx:i});setEditAns(a);}}>Editar</button>
                  {can.eliminar&&<button className="link" style={{color:"var(--danger)"}} onClick={()=>eliminarAct(r.id,i)}>Eliminar</button>}</span>}
              </div>
            </div>))}
        {editable && (adding===r.id
          ? <div className="card card-pad" style={{background:"var(--surface-2)"}}>
              <PreguntasEditor preguntas={preguntas} ans={editAns} setAns={setEditAns}/>
              <div style={{display:"flex",gap:8,marginTop:6}}>
                <button className="btn btn-primary btn-sm" onClick={()=>guardarAct(r.id,null)}>Guardar respuesta</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>{setAdding(false);setEditAns({});}}>Cancelar</button>
              </div>
            </div>
          : <button className="btn btn-ghost btn-sm" style={{marginTop:6}} onClick={()=>{setAdding(r.id);setEditAns({});setEdit(null);}}>＋ Agregar actividad</button>)}
      </div>);})}
  </div>);
}

/* ============================ EQUIPO DE AGENTES ============================ */
function Equipo({ctx}){
  const {users,patchUser,session,pausa,setPausa,dailyLog,limites,setLimites,auxHabilitados,auxUltimoCambio,toggleAuxiliar,campaigns,setCampaigns,notify}=ctx;
  const can=CAN[session.rol];
  const esAdmin=session.rol==="Administrador";
  const now=useNow();
  const agentes=users.filter(u=>u.rol==="Agente"&&u.estado==="activo");
  const upd=(id,patch)=>patchUser(id,patch);

  const totalActivos=agentes.length;
  const disponibles=agentes.filter(a=>(a.opStatus||"Activo")==="Activo" && a.disponible!==false).length;
  const enLlamada=0; // este prototipo no mantiene un estado "en llamada" persistente por agente
  const dursSemana=[];
  // duración promedio: registros con llamada gestionada en cualquier campaña (dur>0)
  ctx.records&&ctx.records.forEach(r=>{ if(r.dur>0) dursSemana.push(r.dur); });
  const avgDur=dursSemana.length?Math.round(dursSemana.reduce((a,b)=>a+b,0)/dursSemana.length):0;
  const byOp=k=>agentes.filter(a=>(a.opStatus||"Activo")===k).length;

  // columnas de auxiliares con su clave de campo diario, para aplicar color por límite en cada una
  const AUX_COLS=[["Baño","banoSec"],["Break","breakSec"],["Comida","comidaSec"],["Capacitación","capacitacionSec"],["Personal","personalSec"],["Retroalimentación","retroalimentacionSec"]];

  // campañas en curso, para el control de pausa individual
  const campEnCurso=campaigns.filter(c=>c.estado==="En curso");
  const [campPausaSel,setCampPausaSel]=useState(campEnCurso[0]?campEnCurso[0].id:"");
  useEffect(()=>{ if(!campEnCurso.some(c=>c.id===campPausaSel)) setCampPausaSel(campEnCurso[0]?campEnCurso[0].id:""); },[campaigns.length]);
  const campSel=campaigns.find(c=>c.id===campPausaSel);
  const toggleCampPausa=()=>{
    const nuevaPausada=!(campSel&&campSel.pausada);
    setCampaigns(p=>p.map(c=>c.id===campPausaSel?{...c,pausada:nuevaPausada}:c));
    if(supabase) actualizarCampanaDB(campPausaSel,{pausada:nuevaPausada});
    registrarAccion(session.id,nuevaPausada?"pausar_campana":"reanudar_campana",`${session.nombre} ${nuevaPausada?"pausó":"reanudó"} las llamadas de «${campSel?campSel.titulo:""}»`);
    notify(nuevaPausada?`Llamadas pausadas para «${campSel?campSel.titulo:""}»`:`Llamadas reanudadas para «${campSel?campSel.titulo:""}»`);
  };

  return (<div className="grid">
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))"}}>
      <Stat k="Agentes disponibles" v={disponibles} meta={`de ${totalActivos} activos`} c="var(--success)"/>
      <Stat k="En llamada" v={enLlamada} meta="en tiempo real" c="var(--info)"/>
      <Stat k="Duración promedio" v={fmt(avgDur)} meta="por llamada" c="var(--navy-2)"/>
      <Stat k="En baño" v={byOp("Baño")} c="var(--info)"/>
      <Stat k="En break" v={byOp("Break")} c="var(--warn)"/>
      <Stat k="En comida" v={byOp("Comida")} c="var(--violet)"/>
      <Stat k="En capacitación" v={byOp("Capacitación")} c="var(--accent-ink)"/>
      <Stat k="En personal" v={byOp("Personal")} c="var(--neutral)"/>
      <Stat k="En retroalimentación" v={byOp("Retroalimentación")} c="var(--teal)"/>
    </div>

    <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div className="grow"><div className="section-title" style={{margin:0}}>Auxiliares habilitados</div><small className="muted">Un auxiliar deshabilitado deja de poder seleccionarse para nuevas pausas. {can.auxiliares?"Puedes habilitarlos/deshabilitarlos.":"Solo Administrador, Team Leader o Supervisor pueden modificar esto."}</small></div>
      </div>
      <div className="row" style={{gap:20,marginTop:10,flexWrap:"wrap"}}>
        {AUXILIARES.map(k=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:8}}>
            <Switch on={auxHabilitados[k]!==false} disabled={!can.auxiliares} onClick={()=>toggleAuxiliar(k)}/>
            <span style={{fontSize:13}}>{k}</span>
          </div>
        ))}
      </div>
      {auxUltimoCambio && <small className="muted" style={{display:"block",marginTop:10}}>Último cambio por <b>{(users.find(u=>u.id===auxUltimoCambio.porId)||{}).nombre||"—"}</b> · {new Date(auxUltimoCambio.cuando).toLocaleString("es-SV")}</small>}
    </div>

    <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div className="grow"><div className="section-title" style={{margin:0}}>Límites de tiempo por auxiliar</div><small className="muted">Tiempo acumulado por día: en amarillo al 80%, en rojo al excederlo. {esAdmin?"Puedes editarlo (minutos).":"Solo el Administrador puede modificar estos valores."}</small></div>
      </div>
      <div className="row" style={{gap:16,marginTop:10,flexWrap:"wrap"}}>
        {AUXILIARES.map(k=>(
          <div key={k} className="field" style={{margin:0}}>
            <label>{k}</label>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <input className="input" type="number" min={1} max={480} style={{width:90}} disabled={!esAdmin}
                value={Math.round((limites[k]||0)/60)}
                onChange={e=>{
                  const nuevo={...limites,[k]:Math.max(1,Number(e.target.value)||1)*60};
                  setLimites(nuevo);
                  if(supabase) updateConfiguracion("limites_auxiliares",nuevo,session.id);
                }}
                onBlur={e=>registrarAccion(session.id,"cambiar_limite",`${session.nombre} cambió el límite de «${k}» a ${Math.round((limites[k]||0)/60)} min`)}/>
              <small className="muted">min</small>
            </div>
          </div>
        ))}
      </div>
    </div>

    <div className="card card-pad">
      <div className="section-title" style={{marginTop:0}}>Agentes en pausa · tiempo acumulado hoy</div>
      <div className="tbl-wrap scroll-y"><table>
        <thead><tr><th>Agente</th><th>Estado actual</th><th>En curso</th><th>Sesión (login)</th><th>Baño</th><th>Break</th><th>Comida</th><th>Capacitación</th><th>Personal</th><th>Retroalim.</th></tr></thead>
        <tbody>{[...agentes].sort((a,b)=>{
          const rank=u=>{
            const cur=u.opStatus||"Activo";
            if(cur==="Activo") return 0;
            const acumulado=liveTotal(dailyLog,u,STATUS_FIELD[cur],now);
            const nivel=nivelTiempo(acumulado,limites[cur]);
            return nivel==="danger"?2:nivel==="warn"?1:0;
          };
          return rank(b)-rank(a);
        }).map(a=>{
          const cur=a.opStatus||"Activo";
          const enPausaAhora=cur!=="Activo";
          const acumuladoCur=enPausaAhora?liveTotal(dailyLog,a,STATUS_FIELD[cur],now):0;
          const nivelCur=enPausaAhora?nivelTiempo(acumuladoCur,limites[cur]):null;
          return (
            <tr key={a.id} style={enPausaAhora?{background:"var(--surface-2)"}:null}>
              <td><b>{a.nombre}</b> <span className="tag">{a.turno}</span></td>
              <td><Pill kind={opPill(cur)}>{cur}</Pill></td>
              <td className="mono" style={estiloNivel(nivelCur)}>{enPausaAhora?fmtLong(acumuladoCur):"—"}</td>
              <td className="mono">{fmtLong(liveTotal(dailyLog,a,"loginSec",now))}</td>
              {AUX_COLS.map(([label,field])=>{
                const total=liveTotal(dailyLog,a,field,now);
                const nivel=nivelTiempo(total,limites[label]);
                return <td key={field} className="mono" style={estiloNivel(nivel)}>{fmtLong(total)}</td>;
              })}
            </tr>);
        })}
        </tbody></table></div>
      <small className="muted" style={{display:"block",marginTop:8}}>El tiempo de cada auxiliar es acumulativo durante el día: si el agente lo detiene y lo retoma más tarde, continúa donde quedó. El tiempo de sesión avanza mientras el agente está logeado y se detiene automáticamente al cerrar sesión. Los agentes en amarillo (80% del límite) o rojo (límite excedido) aparecen primero. Esta tabla muestra el acumulado de hoy; para otras fechas usa el reporte por período más abajo.</small>
    </div>

    <ReportePeriodo ctx={ctx} agentes={agentes}/>

    <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div className="grow"><div className="section-title" style={{margin:0}}>Control de llamadas · todas las campañas</div><small className="muted">Pausar impide iniciar nuevas llamadas en cualquier campaña; las que estén en curso pueden finalizarse.</small></div>
        <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontWeight:600,fontSize:13}}>{pausa?"Nuevas llamadas en pausa":"Nuevas llamadas activas"}</span><Switch on={pausa} disabled={!can.pausar} onClick={()=>{const nueva=!pausa;setPausa(nueva);registrarAccion(session.id,nueva?"pausar_global":"reanudar_global",`${session.nombre} ${nueva?"pausó":"reanudó"} las llamadas en todas las campañas`);notify(pausa?"Llamadas reanudadas para todas las campañas":"Nuevas llamadas en pausa para todas las campañas");}}/></div>
      </div>
    </div>
