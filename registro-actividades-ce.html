<style>
  :root{
    --bg:#eef1f6; --grid:#e2e7ef;
    --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eef2f8;
    --border:#dce2ec; --border-strong:#c6cedb;
    --text:#101b2e; --text-dim:#5a6678; --text-faint:#8c97a8;
    --navy:#13294b; --navy-2:#1c3a66; --navy-ink:#e9eefb;
    --accent:#f2a900; --accent-ink:#3a2a00;
    --success:#0f9d58; --success-bg:#e3f4ea;
    --danger:#d9342b; --danger-bg:#fbe6e4;
    --warn:#e08a00; --warn-bg:#fcefd6;
    --info:#2563eb; --info-bg:#e4ecfd;
    --neutral:#64748b; --neutral-bg:#eef1f5;
    --violet:#7c3aed; --violet-bg:#efe7fd;
    --teal:#0e8a86; --teal-bg:#dff3f2;
    --rose:#c0267a; --rose-bg:#fbe3ee;
    --shadow:0 1px 2px rgba(16,27,46,.06), 0 8px 24px rgba(16,27,46,.06);
    --shadow-lg:0 24px 60px rgba(16,27,46,.22);
    --r:12px; --r-sm:8px;
    --mono:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace;
  }
  [data-theme="dark"]{
    --bg:#0c1422; --grid:#16223a;
    --surface:#111d31; --surface-2:#15233c; --surface-3:#1a2c49;
    --border:#24344f; --border-strong:#32466a;
    --text:#e7edf8; --text-dim:#9aa8bf; --text-faint:#6f7e96;
    --navy:#0a1322; --navy-2:#12243f; --navy-ink:#e9eefb;
    --accent:#ffb71a; --accent-ink:#2a1d00;
    --success:#2fbd77; --success-bg:#10301f;
    --danger:#f0584e; --danger-bg:#3a1310;
    --warn:#f2a83b; --warn-bg:#34250a;
    --info:#5b8def; --info-bg:#101f3d;
    --neutral:#8595ab; --neutral-bg:#1a2740;
    --violet:#a578f0; --violet-bg:#221440;
    --teal:#34c3bd; --teal-bg:#0d2b2a;
    --rose:#e65ba8; --rose-bg:#33122a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 30px 70px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;
  }
  h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;border:2px solid var(--bg)}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100%;display:grid;grid-template-columns:1.05fr .95fr}
  @media(max-width:860px){.login-wrap{grid-template-columns:1fr}.login-hero{display:none}}
  .login-hero{
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(242,169,0,.18), transparent 60%),
      linear-gradient(160deg,var(--navy),var(--navy-2));
    color:var(--navy-ink);padding:54px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
  }
  .login-hero .crest{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.02em}
  .login-hero .crest .mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:18px}
  .login-hero h1{font-size:46px;line-height:1.02;margin:0 0 14px;font-weight:700}
  .login-hero .lead{color:#c7d2e8;max-width:30ch;font-size:15px}
  .pulse-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
  .pulse{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 12px;font-size:12.5px;color:#dbe4f3}
  .pulse i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .login-hero .foot{color:#8ca0c2;font-size:12px}
  .ticker{position:absolute;inset:auto -40px 120px -40px;opacity:.07;font-family:var(--mono);font-size:13px;white-space:nowrap;pointer-events:none}

  .login-panel{display:flex;align-items:center;justify-content:center;padding:40px 28px;background:var(--surface)}
  .login-card{width:100%;max-width:380px}
  .login-card h2{font-size:24px;margin-bottom:4px}
  .login-card .sub{color:var(--text-dim);margin-bottom:26px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px}
  .input{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--text);transition:.15s}
  .input:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--navy-2) 20%,transparent)}
  [data-theme="dark"] .input:focus{box-shadow:0 0 0 3px rgba(91,141,239,.25);border-color:var(--info)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--r-sm);font-weight:600;font-size:14px;transition:.15s;border:1px solid transparent}
  .btn-primary{background:var(--navy);color:#fff;width:100%}
  .btn-primary:hover{background:var(--navy-2)}
  .btn-accent{background:var(--accent);color:var(--accent-ink)}
  .btn-accent:hover{filter:brightness(1.05)}
  .btn-ghost{background:var(--surface-2);color:var(--text);border-color:var(--border)}
  .btn-ghost:hover{background:var(--surface-3)}
  .btn-sm{padding:7px 11px;font-size:13px}
  .btn-danger{background:var(--danger-bg);color:var(--danger)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .link{color:var(--info);font-weight:600;cursor:pointer;background:none}
  .alert{padding:10px 12px;border-radius:var(--r-sm);font-size:13px;margin-bottom:14px}
  .alert-err{background:var(--danger-bg);color:var(--danger)}
  .alert-ok{background:var(--success-bg);color:var(--success)}
  .alert-info{background:var(--info-bg);color:var(--info)}
  .hint{font-size:12px;color:var(--text-faint);margin-top:14px;line-height:1.5}

  /* ---------- Shell ---------- */
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
  @media(max-width:780px){.shell{grid-template-columns:1fr}.sidebar{display:none}}
  .sidebar{background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--navy-ink);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700}
  .brand b{font-family:"Space Grotesk";font-size:15px;display:block;line-height:1.1}
  .brand span{font-size:11px;color:#9fb1cf}
  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#7f93b5;padding:8px 10px 4px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:#c5d1e6;font-weight:500;font-size:14px;cursor:pointer;transition:.13s;width:100%;text-align:left}

  .nav-item.active{background:rgba(242,169,0,.14);color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
  .nav-item .ico{width:18px;text-align:center;opacity:.9}
  .sidebar .spacer{flex:1}
  .me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.05)}
  .avatar{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
  .me b{font-size:13px;display:block}.me span{font-size:11px;color:#9fb1cf}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
  .topbar h3{font-size:18px}
  .topbar .crumb{color:var(--text-faint);font-size:12.5px}
  .topbar .spacer{flex:1}
  .content{padding:22px 24px 60px;max-width:1280px;width:100%}

  .toggle{display:inline-flex;border:1px solid var(--border);border-radius:999px;background:var(--surface-2);padding:3px}
  .toggle button{padding:6px 10px;border-radius:999px;font-size:12.5px;color:var(--text-dim);font-weight:600}
  .toggle button.on{background:var(--navy);color:#fff}

  /* ---------- Generic ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .card-pad{padding:18px}
  .grid{display:grid;gap:16px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;gap:6px}
  .stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600}
  .stat .v{font-family:"Space Grotesk";font-size:28px;font-weight:700;line-height:1}
  .stat .meta{font-size:12px;color:var(--text-dim)}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:600;margin:6px 0 12px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:0}
  td{padding:11px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:var(--surface-2)}
  tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  tfoot td{border-top:2px solid var(--border-strong);border-bottom:none;background:var(--surface-2)}
  .tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .p-success{background:var(--success-bg);color:var(--success)}
  .p-danger{background:var(--danger-bg);color:var(--danger)}
  .p-warn{background:var(--warn-bg);color:var(--warn)}
  .p-info{background:var(--info-bg);color:var(--info)}
  .p-neutral{background:var(--neutral-bg);color:var(--neutral)}
  .p-violet{background:var(--violet-bg);color:var(--violet)}
  .p-teal{background:var(--teal-bg);color:var(--teal)}
  .p-rose{background:var(--rose-bg);color:var(--rose)}
  .p-accent{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-ink)}
  [data-theme="dark"] .p-accent{color:var(--accent)}

  .tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border)}

  .chip-btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;transition:.13s}
  .chip-btn:hover{border-color:var(--navy-2)}
  .chip-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}

  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .seg button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-dim)}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

  .timer{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.02em}
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);display:inline-block;animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}

  .modal-bg{position:fixed;inset:0;background:rgba(8,14,26,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;padding:20px}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:760px;max-height:88vh;overflow:auto}
  .modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
  .modal-head h3{font-size:17px}
  .modal-body{padding:20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}
  .x{margin-left:auto;width:32px;height:32px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:16px;color:var(--text-dim)}
  .x:hover{background:var(--surface-3)}

  .empty{text-align:center;color:var(--text-faint);padding:46px 20px}
  .empty .big{font-size:30px;margin-bottom:8px;opacity:.5}

  .bar-track{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .bar-fill{height:100%;border-radius:999px}
  .legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:6px}
  .legend span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-dim)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  .stepper{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border)}
  .step.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .step.done{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,var(--border))}
  .step b{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.2);font-size:11px}

  .switch{position:relative;width:40px;height:23px;border-radius:999px;background:var(--border-strong);transition:.15s;flex:none}
  .switch.on{background:var(--success)}
  .switch b{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch.on b{left:19px}

  .qcard{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--surface-2);margin-bottom:10px}
  .divider{height:1px;background:var(--border);margin:16px 0}
  .kbd{font-family:var(--mono);font-size:12px;background:var(--surface-3);padding:1px 6px;border-radius:5px;border:1px solid var(--border)}
  .scroll-y{max-height:300px;overflow:auto}
  .grow{flex:1;min-width:0}
  small.muted{color:var(--text-faint)}
  .checkline{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--grid)}
  .checkline input{width:16px;height:16px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
  .tabs button{padding:9px 14px;border-radius:9px 9px 0 0;font-weight:600;font-size:13.5px;color:var(--text-dim);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent);background:var(--surface-2)}
  .weekpill{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px}
  .weekpill button{width:24px;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-dim)}
  .weekpill button:hover{background:var(--surface-3)}
  .act-card{border:1px solid var(--border);border-left:3px solid var(--navy-2);border-radius:10px;padding:12px 14px;background:var(--surface);margin-bottom:10px}
  .act-card.susp-Total{border-left-color:var(--danger)} .act-card.susp-Parcial{border-left-color:var(--warn)} .act-card.susp-No{border-left-color:var(--success)}
  .fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.fieldrow{grid-template-columns:1fr}}
  .searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:4px 4px 4px 12px}
  .searchbar input{border:none;background:none;outline:none;flex:1;color:var(--text);padding:8px 0}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .badge-in{background:var(--violet-bg);color:var(--violet)} .badge-out{background:var(--info-bg);color:var(--info)}
  .toggle-list{display:flex;flex-direction:column}
  .toggle-list .row-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--grid)}
  .mini{font-size:11.5px;color:var(--text-faint)}
  .banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500}
  .banner-warn{background:var(--warn-bg);color:var(--warn)}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useMemo,useRef} = React;

/* Número de versión mostrado en la barra lateral. Súbelo con cada entrega. */
const APP_VERSION = "1.4";

/* ============================ SUPABASE (conexión real) ============================
   Project URL y Publishable key: son seguras de tener aquí, a la vista, en el
   navegador — a diferencia de la Secret key, están diseñadas para esto. */
const SUPABASE_URL = "https://lrjkphiprqbfvhdqjijh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_M_hi0lCBn84bw1YxViVWmg_6pQQ-rmT";
const EDGE_FUNCTION_CREAR_USUARIO = `${SUPABASE_URL}/functions/v1/crear-usuario`;
const supabase = (typeof window!=="undefined" && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* traduce errores comunes de Supabase Auth a mensajes claros en español */
function mapAuthError(error){
  const m=(error&&error.message)||"";
  if(/Invalid login credentials/i.test(m)) return "Correo o contraseña incorrectos.";
  if(/Email not confirmed/i.test(m)) return "Debes confirmar tu correo antes de iniciar sesión.";
  if(/already registered|already exists|User already registered/i.test(m)) return "Ya existe un usuario con ese correo.";
  if(/Password should be|weak_password|password/i.test(m)) return "La contraseña no cumple los requisitos mínimos del sistema.";
  if(/rate limit/i.test(m)) return "Demasiados intentos. Espera un momento y vuelve a intentar.";
  return m || "Ocurrió un error inesperado. Intenta de nuevo.";
}

/* ---- traducción entre el perfil de la base (snake_case) y el objeto de usuario que usa la app (camelCase) ---- */
function dbProfileToUser(p){
  return {
    id:p.id, nombre:p.nombre, email:p.email||"", rol:p.rol, estado:p.estado,
    skill:p.skill||undefined, turno:p.turno||undefined, disponible:p.disponible,
    habilitadoFueraTurno:p.habilitado_fuera_turno, habilitadoLlamadas:p.habilitado_llamadas,
    opStatus:p.op_status||"Activo",
    statusSince:p.status_since?new Date(p.status_since).getTime():null,
    loginSince:p.login_since?new Date(p.login_since).getTime():null,
    debeCambiarPassword:!!p.debe_cambiar_password,
  };
}
async function fetchProfiles(){
  const data=await fetchTodasLasFilas("profiles",{col:"nombre"});
  return data.map(dbProfileToUser);
}
/* aplica un patch (camelCase, como usa la app) como UPDATE real sobre profiles */
async function updateProfile(id,patch){
  const map={skill:"skill",turno:"turno",disponible:"disponible",habilitadoFueraTurno:"habilitado_fuera_turno",
    habilitadoLlamadas:"habilitado_llamadas",opStatus:"op_status",statusSince:"status_since",loginSince:"login_since",
    estado:"estado",rol:"rol",debeCambiarPassword:"debe_cambiar_password"};
  const dbPatch={};
  Object.keys(patch).forEach(k=>{
    if(!map[k]) return;
    let v=patch[k];
    if((k==="statusSince"||k==="loginSince") && typeof v==="number") v=new Date(v).toISOString();
    dbPatch[map[k]]=v;
  });
  if(Object.keys(dbPatch).length===0) return;
  const {error}=await supabase.from("profiles").update(dbPatch).eq("id",id);
  if(error) console.error("Error actualizando perfil:",error.message);
}
/* ---- tiempos diarios (login/auxiliares) ---- */
const DB_FIELD={loginSec:"login_seg",banoSec:"bano_seg",breakSec:"break_seg",comidaSec:"comida_seg",
  capacitacionSec:"capacitacion_seg",personalSec:"personal_seg",retroalimentacionSec:"retroalimentacion_seg"};
async function bumpTiempoDiario(agentId,fecha,field,deltaSec){
  if(!deltaSec||deltaSec<=0) return;
  const col=DB_FIELD[field]; if(!col) return;
  const {data}=await supabase.from("tiempos_diarios").select("id,"+col).eq("agente_id",agentId).eq("fecha",fecha).maybeSingle();
  if(data){
    await supabase.from("tiempos_diarios").update({[col]:(Number(data[col])||0)+deltaSec}).eq("id",data.id);
  } else {
    await supabase.from("tiempos_diarios").insert({agente_id:agentId,fecha,[col]:deltaSec});
  }
}
async function registrarPrimerLoginDB(agentId,fecha,ms){
  const {data}=await supabase.from("tiempos_diarios").select("id,primer_login").eq("agente_id",agentId).eq("fecha",fecha).maybeSingle();
  if(!data) await supabase.from("tiempos_diarios").insert({agente_id:agentId,fecha,primer_login:new Date(ms).toISOString()});
  else if(!data.primer_login) await supabase.from("tiempos_diarios").update({primer_login:new Date(ms).toISOString()}).eq("id",data.id);
}
async function registrarUltimoLogoutDB(agentId,fecha,ms){
  const {data}=await supabase.from("tiempos_diarios").select("id").eq("agente_id",agentId).eq("fecha",fecha).maybeSingle();
  if(!data) await supabase.from("tiempos_diarios").insert({agente_id:agentId,fecha,ultimo_logout:new Date(ms).toISOString()});
  else await supabase.from("tiempos_diarios").update({ultimo_logout:new Date(ms).toISOString()}).eq("id",data.id);
}

/* ---- configuración global: límites de tiempo por auxiliar, y cuáles están habilitados ---- */
async function fetchConfiguracion(){
  const filas=await fetchTodasLasFilas("configuracion");
  const limitesFila=filas.find(f=>f.clave==="limites_auxiliares");
  const auxFila=filas.find(f=>f.clave==="auxiliares_habilitados");
  return {
    limites: (limitesFila&&limitesFila.valor)||{},
    auxHabilitados: (auxFila&&auxFila.valor)||{},
    auxUltimoCambio: auxFila&&auxFila.actualizado_por ? {porId:auxFila.actualizado_por,cuando:new Date(auxFila.actualizado_en).getTime()} : null,
  };
}
async function updateConfiguracion(clave,valor,userId){
  const {error}=await supabase.from("configuracion").update({valor,actualizado_por:userId,actualizado_en:new Date().toISOString()}).eq("clave",clave);
  if(error) console.error(`Error actualizando configuración (${clave}):`,error.message);
}

/* ---- salud del sistema (Administración) ---- */
async function medirSaludSistema(){
  const t0=performance.now();
  let conexionOk=false, latenciaMs=null;
  try{
    const {error}=await supabase.from("configuracion").select("clave").limit(1);
    conexionOk=!error; latenciaMs=Math.round(performance.now()-t0);
  }catch(e){ conexionOk=false; }
  const [{data:ultimoCentro}] = await Promise.all([
    supabase.from("centros_escolares").select("sincronizado_en").order("sincronizado_en",{ascending:false}).limit(1),
  ]);
  return {
    conexionOk, latenciaMs,
    ultimaSincronizacionCentros: (ultimoCentro&&ultimoCentro[0]&&ultimoCentro[0].sincronizado_en) ? new Date(ultimoCentro[0].sincronizado_en).getTime() : null,
  };
}

async function fetchTodasLasFilas(tabla,ordenar){
  const LOTE=1000;
  let q=supabase.from(tabla).select("*",{count:"exact"});
  if(ordenar) q=q.order(ordenar.col,{ascending:ordenar.asc!==false});
  const {data:primera,error,count}=await q.range(0,LOTE-1);
  if(error){ console.error(`Error leyendo ${tabla}:`,error.message); return []; }
  let todas=primera||[];
  if(count && count>LOTE){
    const paginasRestantes=Math.ceil(count/LOTE)-1;
    const promesas=[];
    for(let i=1;i<=paginasRestantes;i++){
      let qi=supabase.from(tabla).select("*");
      if(ordenar) qi=qi.order(ordenar.col,{ascending:ordenar.asc!==false});
      promesas.push(qi.range(i*LOTE,(i+1)*LOTE-1));
    }
    const resultados=await Promise.all(promesas); // todas las páginas restantes a la vez, no una por una
    resultados.forEach(r=>{ if(!r.error) todas=todas.concat(r.data||[]); else console.error(`Error leyendo ${tabla} (página adicional):`,r.error.message); });
  }
  return todas;
}
async function fetchCentrosEscolares(){
  const todos=await fetchTodasLasFilas("centros_escolares",{col:"nombre"});
  return todos.map(c=>({
    codigo:c.codigo, nombre:c.nombre, departamento:c.departamento||"", municipio:c.municipio||"",
    distrito:c.distrito||"", telefonos:c.telefonos&&c.telefonos.length?c.telefonos:[""],
    programa:c.programa, modernizacion:!!c.modernizacion, fase:c.fase, control:!!c.control,
  }));
}

/* ---- campañas y registros: se reconstruye la misma forma que ya usa la app
   (campaigns con schoolCodes/agentIds/assign, records aparte) a partir de las
   tablas relacionales reales. Cada mutación local se refleja también en la base. ---- */
function dbRegistroToRecord(r){
  return {
    id:r.id, campaignId:r.campana_id, codigo:r.codigo_centro, agentId:r.agente_id,
    estado:r.estado, intentos:r.intentos||0, wrong:r.numeros_equivocados||[],
    actividades:r.actividades||[], dur:r.duracion_seg||0,
    updatedMs:r.actualizado_en?new Date(r.actualizado_en).getTime():Date.now(),
  };
}
async function fetchCampaignsAndRecords(){
  const [camps,agentesRows,regs]=await Promise.all([
    fetchTodasLasFilas("campanas",{col:"creado_en",asc:false}),
    fetchTodasLasFilas("campana_agentes"),
    fetchTodasLasFilas("registros"),
  ]);
  const campaigns=(camps||[]).map(c=>{
    const agentIds=(agentesRows||[]).filter(a=>a.campana_id===c.id).map(a=>a.agente_id);
    const misRegs=(regs||[]).filter(r=>r.campana_id===c.id);
    const schoolCodes=misRegs.map(r=>r.codigo_centro);
    const assign={}; misRegs.forEach(r=>{ if(r.agente_id) assign[r.codigo_centro]=r.agente_id; });
    return {
      id:c.id, titulo:c.titulo, objetivo:c.objetivo, fechaDesde:c.fecha_desde, fechaHasta:c.fecha_hasta,
      maxIntentos:c.max_intentos, preguntas:c.preguntas||[], estado:c.estado, pausada:!!c.pausada,
      agentIds, schoolCodes, assign,
      borradorEstado:c.borrador_estado||null, creadoPor:c.creado_por||null,
      actualizadoEn:c.actualizado_en?new Date(c.actualizado_en).getTime():null,
    };
  });
  const records=(regs||[]).map(dbRegistroToRecord);
  return {campaigns,records};
}
/* crea una campaña completa: fila en campanas + campana_agentes + un registro por cada centro asignado */
async function crearCampanaDB(camp,borradorId){
  let campanaId=borradorId||null;
  const datosBase={
    titulo:camp.titulo, objetivo:camp.objetivo, fecha_desde:camp.fechaDesde, fecha_hasta:camp.fechaHasta,
    max_intentos:camp.maxIntentos, preguntas:camp.preguntas, estado:camp.estado||"En curso", pausada:false, borrador_estado:null,
  };
  if(campanaId){
    const {error}=await supabase.from("campanas").update(datosBase).eq("id",campanaId);
    if(error){ console.error("Error convirtiendo borrador en campaña:",error.message); return null; }
  } else {
    const {data:campRow,error}=await supabase.from("campanas").insert(datosBase).select().single();
    if(error){ console.error("Error creando campaña:",error.message); return null; }
    campanaId=campRow.id;
  }
  const LOTE=500;
  const tareas=[];
  if(camp.agentIds.length) tareas.push(supabase.from("campana_agentes").insert(camp.agentIds.map(agente_id=>({campana_id:campanaId,agente_id}))));
  for(let i=0;i<camp.schoolCodes.length;i+=LOTE){
    const lote=camp.schoolCodes.slice(i,i+LOTE).map(codigo=>({
      campana_id:campanaId, codigo_centro:codigo, agente_id:camp.assign[codigo]||null, estado:"Pendiente",
    }));
    tareas.push(supabase.from("registros").insert(lote));
  }
  await Promise.all(tareas); // agentes y todos los lotes de centros, a la vez, no uno tras otro
  return campanaId;
}
/* guarda (crea o actualiza) un borrador de campaña — nunca crea campana_agentes
   ni registros todavía, solo la fila de "campanas" con estado="Borrador" */
async function guardarBorradorDB(borrador,borradorId){
  const payload={
    titulo:borrador.titulo||"", objetivo:borrador.objetivo||"", fecha_desde:borrador.fechaDesde, fecha_hasta:borrador.fechaHasta,
    max_intentos:borrador.maxIntentos, preguntas:borrador.preguntas, estado:"Borrador", pausada:false,
    borrador_estado:borrador.estadoAsistente, creado_por:borrador.creadoPor,
  };
  if(borradorId){
    const {error}=await supabase.from("campanas").update(payload).eq("id",borradorId);
    if(error){ console.error("Error guardando borrador:",error.message); return borradorId; }
    return borradorId;
  }
  const {data,error}=await supabase.from("campanas").insert(payload).select().single();
  if(error){ console.error("Error creando borrador:",error.message); return null; }
  return data.id;
}
async function eliminarBorradorDB(id){
  const {error}=await supabase.from("campanas").delete().eq("id",id);
  if(error) console.error("Error eliminando borrador:",error.message);
}
async function actualizarCampanaDB(id,patch){
  const map={titulo:"titulo",objetivo:"objetivo",fechaDesde:"fecha_desde",fechaHasta:"fecha_hasta",
    maxIntentos:"max_intentos",preguntas:"preguntas",estado:"estado",pausada:"pausada"};
  const dbPatch={}; Object.keys(patch).forEach(k=>{ if(map[k]) dbPatch[map[k]]=patch[k]; });
  if(Object.keys(dbPatch).length===0) return;
  const {error}=await supabase.from("campanas").update(dbPatch).eq("id",id);
  if(error) console.error("Error actualizando campaña:",error.message);
}
async function agregarAgentesACampanaDB(campanaId,agentIds){
  if(!agentIds.length) return;
  await supabase.from("campana_agentes").upsert(agentIds.map(agente_id=>({campana_id:campanaId,agente_id})),{onConflict:"campana_id,agente_id"});
}
/* actualiza (o crea, si aún no existía) el registro de un centro dentro de una campaña */
async function upsertRegistroDB(campanaId,codigo,patch){
  const map={agentId:"agente_id",estado:"estado",intentos:"intentos",wrong:"numeros_equivocados",
    actividades:"actividades",dur:"duracion_seg"};
  const dbPatch={}; Object.keys(patch).forEach(k=>{ if(map[k]) dbPatch[map[k]]=patch[k]; });
  const {data:existente}=await supabase.from("registros").select("id").eq("campana_id",campanaId).eq("codigo_centro",codigo).maybeSingle();
  if(existente){
    const {error}=await supabase.from("registros").update(dbPatch).eq("id",existente.id);
    if(error) console.error("Error actualizando registro:",error.message);
  } else {
    const {error}=await supabase.from("registros").insert({campana_id:campanaId,codigo_centro:codigo,estado:"Pendiente",...dbPatch});
    if(error) console.error("Error creando registro:",error.message);
  }
}
/* actualiza varios registros de una sola vez (un solo viaje de red, en vez de
   uno por cada centro) — usar siempre que se reasignen/actualicen varios
   centros a la vez, para que la operación sea rápida sin importar cuántos sean */
async function actualizarRegistrosMasivoDB(campanaId,filasPatch){
  const map={agentId:"agente_id",estado:"estado",intentos:"intentos",wrong:"numeros_equivocados"};
  const filas=filasPatch.map(({codigo,...patch})=>{
    const dbPatch={campana_id:campanaId,codigo_centro:codigo};
    Object.keys(patch).forEach(k=>{ if(map[k]) dbPatch[map[k]]=patch[k]; });
    return dbPatch;
  });
  if(!filas.length) return;
  const {error}=await supabase.from("registros").upsert(filas,{onConflict:"campana_id,codigo_centro"});
  if(error) console.error("Error actualizando registros en lote:",error.message);
}
/* actualiza varios registros de una campaña que compartan los mismos códigos (reasignación en lote) */
async function actualizarRegistrosPorCodigosDB(campanaId,codigos,patch){
  const map={agentId:"agente_id",estado:"estado",intentos:"intentos",wrong:"numeros_equivocados"};
  const dbPatch={}; Object.keys(patch).forEach(k=>{ if(map[k]) dbPatch[map[k]]=patch[k]; });
  if(!codigos.length) return;
  const {error}=await supabase.from("registros").update(dbPatch).eq("campana_id",campanaId).in("codigo_centro",codigos);
  if(error) console.error("Error actualizando registros:",error.message);
}

/* ---- reglas de contraseña (se usan en primer ingreso, cambio voluntario y recuperación) ----
   Nota: esta misma validación aplica del lado del cliente aquí, y también se puede exigir del
   lado de Supabase (Authentication → Policies → Password Requirements) cuando se conecte la app
   a la base real — ver README de la base de datos. */
const PASSWORD_RULES=[
  {k:"len",   label:"Al menos 8 caracteres",        test:s=>s.length>=8},
  {k:"upper", label:"Al menos 1 letra mayúscula",   test:s=>/[A-ZÁÉÍÓÚÑ]/.test(s)},
  {k:"lower", label:"Al menos 1 letra minúscula",   test:s=>/[a-záéíóúñ]/.test(s)},
  {k:"digit", label:"Al menos 1 número",            test:s=>/[0-9]/.test(s)},
  {k:"special",label:"Al menos 1 carácter especial",test:s=>/[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ]/.test(s)},
];
const passwordValida=pw=>PASSWORD_RULES.every(r=>r.test(pw||""));
function PasswordChecklist({value}){
  return (<div style={{display:"flex",flexDirection:"column",gap:4,margin:"8px 0"}}>
    {PASSWORD_RULES.map(r=>{const ok=r.test(value||"");return (
      <div key={r.k} style={{fontSize:12.5,color:ok?"var(--success)":"var(--text-faint)",display:"flex",alignItems:"center",gap:6}}>
        <span>{ok?"✓":"○"}</span>{r.label}
      </div>);})}
  </div>);
}

/* ---- campo de contraseña con botón de mostrar/ocultar (reutilizable en toda la app) ---- */
function PasswordInput({value,onChange,onKeyDown,placeholder,autoFocus}){
  const [mostrar,setMostrar]=useState(false);
  return (<div style={{position:"relative",width:"100%"}}>
    <input className="input" style={{paddingRight:38}} type={mostrar?"text":"password"}
      value={value} onChange={onChange} onKeyDown={onKeyDown} placeholder={placeholder} autoFocus={autoFocus}/>
    <button type="button" onClick={()=>setMostrar(m=>!m)} tabIndex={-1}
      title={mostrar?"Ocultar contraseña":"Mostrar contraseña"}
      style={{position:"absolute",right:4,top:0,bottom:0,background:"none",border:"none",cursor:"pointer",fontSize:16,color:"var(--text-faint)",padding:"0 8px",display:"flex",alignItems:"center"}}>
      {mostrar?"🙈":"👁️"}
    </button>
  </div>);
}

/* tipos de respuesta para las preguntas de campaña (totalmente parametrizables) */
const Q_TIPOS=[
  {k:"sino",t:"Sí / No"},
  {k:"multiple",t:"Selección múltiple"},
  {k:"lista",t:"Lista desplegable"},
  {k:"abierta",t:"Abierta"},
  {k:"fecha",t:"Fecha"},
  {k:"hora",t:"Hora"},
  {k:"combinacion",t:"Combinación de tipos"},
];
const Q_TIPOS_SIMPLES=Q_TIPOS.filter(t=>t.k!=="combinacion"); // para sub-partes
const qTipoLabel=k=>(Q_TIPOS.find(t=>t.k===k)||{t:k}).t;
// solo estas pueden condicionar otras preguntas (tienen opciones discretas de valor único)
const esCondicionable=q=>q&&(q.tipo==="sino"||q.tipo==="multiple"||q.tipo==="lista");
/* una opción puede ser un string simple o {texto, valorReporte} para normalizar el dato al reportar/exportar */
const optTexto=o=>typeof o==="string"?o:(o&&o.texto)||"";
const optReporte=o=>{ if(typeof o==="string") return o; const v=o&&o.valorReporte&&o.valorReporte.trim(); return v?v:optTexto(o); };
const opcionesDe=q=> q.tipo==="sino"?["Sí","No"]:(q.opciones||[]).map(optTexto).filter(Boolean);
function reportMap(q){ const m={}; (q.opciones||[]).forEach(o=>{const t=optTexto(o); if(t) m[t]=optReporte(o);}); return m; }
/* ¿la pregunta condicional se cumple? soporta "es igual a" y "es diferente de" */
function pasaCondicion(cond,ans){
  if(!cond||!cond.q) return true;
  const a=ans[cond.q];
  const match=Array.isArray(a)?a.includes(cond.op):a===cond.op;
  return cond.mode==="neq" ? !match : match;
}
/* ¿la respuesta actual a esta pregunta marca "finalizar formulario" (oculta las preguntas siguientes)? */
function terminaFormulario(q,ans){
  const raw=ans[q.id];
  if(q.tipo==="combinacion"){
    if(!raw) return false;
    return (q.partes||[]).some(p=>terminaParte(p,raw[p.id]));
  }
  if(raw==null||raw==="") return false;
  if(q.tipo==="sino") return !!(q.opcionesFinaliza && q.opcionesFinaliza[raw]);
  const arr=Array.isArray(raw)?raw:[raw];
  const opts=(q.opciones||[]).map(o=>typeof o==="string"?{texto:o,finaliza:false}:o);
  return arr.some(v=>opts.some(o=>o.texto===v && o.finaliza));
}
/* ¿la respuesta actual de una sub-pregunta (parte) marca "finalizar formulario"? */
function terminaParte(parte,value){
  if(value==null||value==="") return false;
  if(parte.tipo==="sino") return !!(parte.opcionesFinaliza && parte.opcionesFinaliza[value]);
  const arr=Array.isArray(value)?value:[value];
  const opts=(parte.opciones||[]).map(o=>typeof o==="string"?{texto:o,finaliza:false}:o);
  return arr.some(v=>opts.some(o=>o.texto===v && o.finaliza));
}
/* ¿la condición de una sub-pregunta (referencia a otra parte del mismo "combinación") se cumple? */
function pasaCondicionParte(cond,subAns){
  if(!cond||!cond.p) return true;
  const a=subAns[cond.p];
  const match=Array.isArray(a)?a.includes(cond.op):a===cond.op;
  return cond.mode==="neq" ? !match : match;
}
const respuestaVacia=v=>v==null||v===""||(Array.isArray(v)&&v.length===0);
/* devuelve los textos de las preguntas/sub-preguntas OBLIGATORIAS que aún no
   tienen respuesta, considerando solo las que están visibles en este momento
   (respeta condicionales y el corte por "finaliza el formulario") */
function preguntasObligatoriasFaltantes(preguntas,ans){
  const cutIdx=preguntas.findIndex(q=>terminaFormulario(q,ans));
  const enAlcance=cutIdx===-1?preguntas:preguntas.slice(0,cutIdx+1);
  const visibles=enAlcance.filter(q=>pasaCondicion(q.cond,ans));
  const faltan=[];
  visibles.forEach(q=>{
    if(q.tipo==="combinacion"){
      const subAns=ans[q.id]||{};
      const partes=q.partes||[];
      const cutSubIdx=partes.findIndex(p=>terminaParte(p,subAns[p.id]));
      const partesEnAlcance=cutSubIdx===-1?partes:partes.slice(0,cutSubIdx+1);
      partesEnAlcance.filter(p=>pasaCondicionParte(p.cond,subAns)).forEach(p=>{
        if(p.obligatoria && respuestaVacia(subAns[p.id])) faltan.push(`${q.texto} — ${p.label||p.id}`);
      });
    } else if(q.obligatoria && respuestaVacia(ans[q.id])){
      faltan.push(q.texto);
    }
  });
  return faltan;
}
/* valores de una actividad (respuestas) para una pregunta, ya normalizados por valorReporte. partId = id de la sub-pregunta (parte), o null para preguntas simples */
function valoresActividad(act,q,partId){
  const qDef = partId!=null ? (q.partes||[]).find(p=>p.id===partId) : q;
  let raw = partId!=null ? (act&&act[q.id]||{})[partId] : act&&act[q.id];
  if(raw==null||raw==="") return [];
  const map=qDef?reportMap(qDef):{};
  const arr=Array.isArray(raw)?raw.filter(x=>x!=null&&x!==""):[raw];
  return arr.map(v=>map[v]!=null?map[v]:v);
}
/* cuenta respuestas de una pregunta a través de varias actividades -> [{label,value,color}] */
function contarActividades(acts,q,partId){
  const counts={};
  acts.forEach(act=>valoresActividad(act,q,partId).forEach(v=>{counts[v]=(counts[v]||0)+1;}));
  return Object.entries(counts).map(([label,value],i)=>({label,value,color:PALETTE[i%PALETTE.length]}));
}
/* etiqueta legible del valor de una respuesta (para tarjetas de actividad) */
function labelDeValor(v){ return Array.isArray(v)?v.join(", "):(v==null||v===""?"—":String(v)); }
/* próximo id disponible con un prefijo dado (para preguntas y sub-preguntas), evita colisiones al duplicar */
function nextId(items,prefix){ let n=1; while((items||[]).some(it=>it.id===prefix+n)) n++; return prefix+n; }
const blankOpcion=()=>({texto:"",valorReporte:"",finaliza:false});
const blankParte=partes=>({id:nextId(partes||[],"p"),label:"",tipo:"multiple",opciones:[blankOpcion(),blankOpcion()],cond:null,opcionesFinaliza:{},obligatoria:false});
const blankPregunta=preguntas=>({id:nextId(preguntas||[],"q"),texto:"",tipo:"multiple",opciones:[blankOpcion(),blankOpcion()],partes:[],cond:null,opcionesFinaliza:{},obligatoria:false});
const limpiaOpciones=ops=>(ops||[]).filter(o=>o&&o.texto&&o.texto.trim()).map(o=>({texto:o.texto.trim(),valorReporte:(o.valorReporte||"").trim(),finaliza:!!o.finaliza}));
const limpiaParte=p=>{
  const base={id:p.id,label:p.label,tipo:p.tipo,cond:p.cond&&p.cond.p?p.cond:null,obligatoria:!!p.obligatoria};
  if(p.tipo==="multiple"||p.tipo==="lista") return {...base,opciones:limpiaOpciones(p.opciones)};
  if(p.tipo==="sino") return {...base,opciones:["Sí","No"],opcionesFinaliza:{Sí:!!(p.opcionesFinaliza&&p.opcionesFinaliza["Sí"]),No:!!(p.opcionesFinaliza&&p.opcionesFinaliza["No"])}};
  return {...base,opciones:[]};
};
const limpiaPregunta=q=>{
  const base={id:q.id,texto:q.texto,tipo:q.tipo,cond:q.cond&&q.cond.q?q.cond:null,obligatoria:!!q.obligatoria};
  if(q.tipo==="multiple"||q.tipo==="lista") return {...base,opciones:limpiaOpciones(q.opciones)};
  if(q.tipo==="sino") return {...base,opciones:["Sí","No"],opcionesFinaliza:{Sí:!!(q.opcionesFinaliza&&q.opcionesFinaliza["Sí"]),No:!!(q.opcionesFinaliza&&q.opcionesFinaliza["No"])}};
  if(q.tipo==="combinacion") return {...base,opciones:[],partes:(q.partes||[]).filter(p=>p.label||p.tipo).map(limpiaParte)};
  return {...base,opciones:[]};
};
/* al reordenar/eliminar preguntas o sub-preguntas, cualquier condición que apunte a algo que ya no está
   ANTES de su posición queda inválida y se limpia automáticamente */
function sanitizeConditions(preguntas){
  return preguntas.map((q,i)=>{
    const idsPrevias=preguntas.slice(0,i).map(p=>p.id);
    const cond = q.cond && idsPrevias.includes(q.cond.q) ? q.cond : null;
    if(q.tipo!=="combinacion") return {...q,cond};
    const partes=(q.partes||[]).map((p,pi)=>{
      const idsPreviasParte=(q.partes||[]).slice(0,pi).map(sp=>sp.id);
      const pcond = p.cond && idsPreviasParte.includes(p.cond.p) ? p.cond : null;
      return {...p,cond:pcond};
    });
    return {...q,cond,partes};
  });
}

/* ---- registro diario de tiempos (login + pausas), por agente y fecha ---- */
function dayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function addDays(dateStr,n){const [y,m,d]=dateStr.split("-").map(Number);const dt=new Date(y,m-1,d+n);return dayKey(dt);}
function datesBetween(from,to){const out=[];let cur=from;let guard=0;while(cur<=to&&guard<400){out.push(cur);cur=addDays(cur,1);guard++;}return out;}
const STATUS_FIELD={Baño:"banoSec",Break:"breakSec",Comida:"comidaSec",Capacitación:"capacitacionSec",Personal:"personalSec",Retroalimentación:"retroalimentacionSec"};
const FIELD_LABEL={loginSec:"Login",banoSec:"Baño",breakSec:"Break",comidaSec:"Comida",capacitacionSec:"Capacitación",personalSec:"Personal",retroalimentacionSec:"Retroalimentación"};
const DAILY_FIELDS=["loginSec","banoSec","breakSec","comidaSec","capacitacionSec","personalSec","retroalimentacionSec"];
const blankDailyEntry=(agentId,date)=>{const e={agentId,date,primerLoginMs:null,ultimoLogoutMs:null};DAILY_FIELDS.forEach(f=>e[f]=0);return e;};
function getDailyEntry(dailyLog,agentId,date){return dailyLog.find(e=>e.agentId===agentId&&e.date===date)||blankDailyEntry(agentId,date);}
function bumpDailyLog(setDailyLog,agentId,date,field,deltaSec){
  if(!deltaSec||deltaSec<=0) return;
  setDailyLog(prev=>{
    const idx=prev.findIndex(e=>e.agentId===agentId&&e.date===date);
    if(idx<0) return [...prev,{...blankDailyEntry(agentId,date),[field]:deltaSec}];
    return prev.map((e,i)=>i===idx?{...e,[field]:(e[field]||0)+deltaSec}:e);
  });
}
/* registra el PRIMER login del día (no se sobreescribe si ya existe uno para hoy) */
function registrarPrimerLogin(setDailyLog,userId,date,ms){
  setDailyLog(prev=>{
    const idx=prev.findIndex(e=>e.agentId===userId&&e.date===date);
    if(idx<0) return [...prev,{...blankDailyEntry(userId,date),primerLoginMs:ms}];
    if(prev[idx].primerLoginMs) return prev;
    return prev.map((e,i)=>i===idx?{...e,primerLoginMs:ms}:e);
  });
}
/* registra el ÚLTIMO logout del día (se sobreescribe cada vez, siempre queda el más reciente) */
function registrarUltimoLogout(setDailyLog,userId,date,ms){
  setDailyLog(prev=>{
    const idx=prev.findIndex(e=>e.agentId===userId&&e.date===date);
    if(idx<0) return [...prev,{...blankDailyEntry(userId,date),ultimoLogoutMs:ms}];
    return prev.map((e,i)=>i===idx?{...e,ultimoLogoutMs:ms}:e);
  });
}
/* total de un campo para un agente en una fecha, sumando el tramo en curso si aplica (solo si la fecha es hoy) */
function liveTotal(dailyLog,u,field,now){
  const today=dayKey();
  const stored=getDailyEntry(dailyLog,u.id,today)[field]||0;
  let live=0;
  if(field==="loginSec" && u.loginSince) live=Math.max(0,(now-u.loginSince)/1000);
  else if(STATUS_FIELD[u.opStatus]===field && u.statusSince) live=Math.max(0,(now-u.statusSince)/1000);
  return stored+live;
}
function seedDailyLog(agentIds){
  const rows=[];
  const base=[[7.5,15,25,40,0,5,10],[7.1,10,20,35,60,0,15],[6.8,20,30,50,0,10,0]]; // horas login, min baño, break, comida, capacitación, personal, retro (aprox)
  agentIds.forEach((id,ai)=>{
    for(let d=1;d<=3;d++){
      const date=addDays(dayKey(),-d);
      const [h,bn,br,co,ca,pe,re]=base[(ai+d)%base.length];
      rows.push({agentId:id,date,loginSec:Math.round(h*3600),banoSec:bn*60,breakSec:br*60,comidaSec:co*60,capacitacionSec:ca*60,personalSec:pe*60,retroalimentacionSec:re*60});
    }
  });
  return rows;
}

/* ---- filtro de fecha (día único o período) que reemplaza el filtro por semana ISO ---- */
function fmtDateHuman(dateStr){ if(!dateStr) return ""; const [y,m,d]=dateStr.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("es-SV",{day:"numeric",month:"short",year:"numeric"}); }
function rangeLabel(desde,hasta){ if(!desde) return ""; return desde===hasta ? fmtDateHuman(desde) : `${fmtDateHuman(desde)} – ${fmtDateHuman(hasta)}`; }
function overlaps(aDesde,aHasta,bDesde,bHasta){ return aDesde<=bHasta && aHasta>=bDesde; }
function defaultFiltro(){
  const t=dayKey();
  const dow=(new Date().getDay()+6)%7; // 0=lunes..6=domingo
  const mondayThis=addDays(t,-dow);
  const mondayNext=addDays(mondayThis,7);
  const sundayNext=addDays(mondayNext,6);
  return {desde:mondayNext,hasta:sundayNext};
}

/* ¿puede el agente iniciar/atender llamadas? */
function puedeLlamar(u,pausa,camp){
  if(u.rol==="Agente"){
    if(u.disponible===false) return {ok:false,motivo:"Estás marcado como no disponible. Un supervisor debe habilitarte."};
    if(u.habilitadoLlamadas===false) return {ok:false,motivo:"Un supervisor deshabilitó tus llamadas."};
    if(u.turno && u.turno!==shiftNow() && !u.habilitadoFueraTurno) return {ok:false,motivo:`Estás fuera de tu turno (${u.turno}). Pide habilitación para trabajar fuera de turno.`};
  }
  if((u.opStatus||"Activo")!=="Activo") return {ok:false,motivo:`Estás en ${u.opStatus}. Vuelve a Activo para llamar.`};
  if(pausa) return {ok:false,motivo:"Un responsable pausó las nuevas llamadas en todas las campañas. Puedes terminar la que tengas en curso."};
  if(camp&&camp.pausada) return {ok:false,motivo:`Un responsable pausó las nuevas llamadas de «${camp.titulo}». Puedes terminar la que tengas en curso.`};
  return {ok:true};
}

const _norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function rowToSchool(row){
  const m={};Object.keys(row).forEach(k=>{m[_norm(k)]=row[k];});
  const get=(...res)=>{for(const k of Object.keys(m)){if(res.some(rx=>rx.test(k)))return m[k];}return "";};
  const truthy=v=>/^(si|s[ií]|true|verdadero|1|x|yes)$/i.test(String(v).trim());
  const tels=[];Object.keys(m).forEach(k=>{if(/(telefono|tel\d|fono|movil|celular|contacto)/.test(k)){String(m[k]).split(/[\/,;|]+/).forEach(t=>{t=String(t).trim();if(t)tels.push(t);});}});
  const fase=String(get(/fase/)||"").trim();
  return {codigo:String(get(/^codigo/,/codigo/,/^code/)||"").trim(),nombre:String(get(/nombre/,/^centroeducativo/,/^centroescolar/,/^centro/,/escuela/)||"").trim(),
    departamento:String(get(/departamento/,/depto/)||"").trim(),municipio:String(get(/municipio/)||"").trim(),distrito:String(get(/distrito/)||"").trim(),
    telefonos:tels.length?tels:[""],programa:(String(get(/programa/)||"").trim())||null,modernizacion:truthy(get(/moderniz/)),fase:fase||null,control:truthy(get(/control/))};
}
function parseSchoolFile(file,cb){
  if(typeof XLSX==="undefined")return cb(new Error("No se cargó el lector de archivos."));
  const r=new FileReader();
  r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:""});const mapped=rows.map(rowToSchool);const validos=mapped.filter(s=>s.codigo&&s.nombre);cb(null,{validos,total:rows.length,omitidos:mapped.length-validos.length,hoja:wb.SheetNames[0]});}catch(err){cb(err);}};
  r.onerror=()=>cb(new Error("No se pudo leer el archivo."));
  r.readAsArrayBuffer(file);
}

function Bars({rows}){
  const max=Math.max(1,...rows.map(r=>r.value));
  return (<div style={{display:"flex",flexDirection:"column",gap:11}}>
    {rows.map((r,i)=>(<div key={i}>

      <div className="bar-track"><div className="bar-fill" style={{width:(r.value/max*100)+"%",background:r.color||"var(--navy-2)"}}/></div>
    </div>))}
    {rows.length===0&&<div className="empty">Sin datos</div>}
  </div>);
}
function Donut({segments,size=150}){
  const total=segments.reduce((a,b)=>a+b.value,0)||1;const R=size/2,r=R*0.62;let acc=0;
  const arcs=segments.map(s=>{const a0=acc/total*2*Math.PI,a1=(acc+s.value)/total*2*Math.PI;acc+=s.value;
    const x0=R+R*Math.sin(a0),y0=R-R*Math.cos(a0),x1=R+R*Math.sin(a1),y1=R-R*Math.cos(a1);
    const xi0=R+r*Math.sin(a0),yi0=R-r*Math.cos(a0),xi1=R+r*Math.sin(a1),yi1=R-r*Math.cos(a1);const large=(a1-a0)>Math.PI?1:0;
    return {d:`M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${xi1},${yi1} A${r},${r} 0 ${large} 0 ${xi0},${yi0} Z`,color:s.color};});
  return (<div style={{display:"flex",gap:18,alignItems:"center",flexWrap:"wrap"}}>
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {segments.length===0?<circle cx={R} cy={R} r={(R+r)/2} fill="none" stroke="var(--surface-3)" strokeWidth={R-r}/>:arcs.map((a,i)=><path key={i} d={a.d} fill={a.color}/>)}
      <text x={R} y={R-2} textAnchor="middle" fontFamily="Space Grotesk" fontWeight="700" fontSize="22" fill="var(--text)">{total}</text>
      <text x={R} y={R+14} textAnchor="middle" fontSize="10" fill="var(--text-faint)">total</text>
    </svg>
    <div className="legend" style={{flexDirection:"column",gap:8}}>{segments.map((s,i)=><span key={i}><i style={{background:s.color}}/>{s.label} · <b className="mono">{s.value}</b></span>)}</div>
  </div>);
}
function Stat({k,v,meta,c}){return <div className="card card-pad"><div className="stat"><span className="k">{k}</span><span className="v" style={{color:c}}>{v}</span>{meta&&<span className="meta">{meta}</span>}</div></div>;}
function Switch({on,onClick,disabled}){return <button className={"switch"+(on?" on":"")} disabled={disabled} onClick={onClick} style={disabled?{opacity:.5}:null}><b/></button>;}

/* control de respuesta según el tipo (Sí/No, múltiple, lista, abierta, fecha, hora) */
function AnswerField({tipo,opciones,value,onChange}){
  if(tipo==="sino"){
    return <div className="row" style={{gap:7}}>
      {["Sí","No"].map(op=><button key={op} className={"chip-btn"+(value===op?" on":"")} onClick={()=>onChange(op)}>{op}</button>)}
    </div>;
  }
  if(tipo==="multiple"){
    const arr=Array.isArray(value)?value:[];
    const opts=(opciones||[]).map(optTexto).filter(Boolean);
    const toggle=op=>onChange(arr.includes(op)?arr.filter(x=>x!==op):[...arr,op]);
    return <div className="row" style={{gap:7}}>
      {opts.map(op=>(
        <button key={op} className={"chip-btn"+(arr.includes(op)?" on":"")} onClick={()=>toggle(op)}>
          <span style={{fontSize:11}}>{arr.includes(op)?"☑":"☐"}</span>{op}</button>))}
    </div>;
  }
  if(tipo==="lista"){
    const opts=(opciones||[]).map(optTexto).filter(Boolean);
    return <select className="input" style={{width:"auto"}} value={value||""} onChange={e=>onChange(e.target.value)}>
      <option value="">Selecciona una opción</option>
      {opts.map(op=><option key={op} value={op}>{op}</option>)}
    </select>;
  }
  if(tipo==="abierta") return <textarea className="input" rows={2} value={value||""} onChange={e=>onChange(e.target.value)} placeholder="Respuesta…"/>;
  if(tipo==="fecha") return <input className="input" type="date" value={value||""} onChange={e=>onChange(e.target.value)}/>;
  if(tipo==="hora") return <input className="input" type="time" value={value||""} onChange={e=>onChange(e.target.value)} style={{width:"auto"}}/>;
  return null;
}

/* ---- editor de preguntas parametrizadas, reutilizado por CallPanel e InboundCE ---- */
function PreguntasEditor({preguntas,ans,setAns}){
  const cutIdx=preguntas.findIndex(q=>terminaFormulario(q,ans));
  const enAlcance=cutIdx===-1?preguntas:preguntas.slice(0,cutIdx+1);
  const visibles=enAlcance.filter(q=>pasaCondicion(q.cond,ans));
  if(preguntas.length===0) return <div className="empty" style={{padding:14}}>Esta campaña no tiene preguntas configuradas.</div>;
  return (<>{visibles.map(q=>{
    const subAns=ans[q.id]||{};
    const partes=q.partes||[];
    const cutSubIdx=q.tipo==="combinacion"?partes.findIndex(p=>terminaParte(p,subAns[p.id])):-1;
    const partesEnAlcance=cutSubIdx===-1?partes:partes.slice(0,cutSubIdx+1);
    const partesVisibles=partesEnAlcance.filter(p=>pasaCondicionParte(p.cond,subAns));
    return (
    <div className="qcard" key={q.id}>
      <div style={{fontWeight:600,marginBottom:8}}>{q.texto}{q.obligatoria&&<span style={{color:"var(--danger)"}}> *</span>} <span className="tag">{qTipoLabel(q.tipo)}</span></div>
      {q.tipo==="combinacion"
        ? partesVisibles.map(p=>(
            <div key={p.id} style={{marginBottom:10}}>
              <small className="muted" style={{display:"block",marginBottom:5}}>{p.label||p.id}{p.obligatoria&&<span style={{color:"var(--danger)"}}> *</span>} · {qTipoLabel(p.tipo)}</small>
              <AnswerField tipo={p.tipo} opciones={p.opciones} value={subAns[p.id]}
                onChange={v=>setAns(a=>({...a,[q.id]:{...(a[q.id]||{}),[p.id]:v}}))}/>
              {p.cond&&p.cond.p && <small className="muted" style={{display:"block",marginTop:4}}>↳ se muestra porque «{p.cond.p}» {p.cond.mode==="neq"?"≠":"="} {p.cond.op}</small>}
              {cutSubIdx!==-1 && p.id===partes[cutSubIdx].id && <small className="muted" style={{display:"block",marginTop:4,color:"var(--warn)"}}>⏹ Esta respuesta finaliza el formulario.</small>}
            </div>))
        : <AnswerField tipo={q.tipo} opciones={q.opciones} value={ans[q.id]}
            onChange={v=>setAns(a=>({...a,[q.id]:v}))}/>}
      {q.cond&&q.cond.q && <small className="muted" style={{display:"block",marginTop:6}}>↳ se muestra porque «{q.cond.q.toUpperCase()}» {q.cond.mode==="neq"?"≠":"="} {q.cond.op}</small>}
      {cutIdx!==-1 && q.id===preguntas[cutIdx].id && q.tipo!=="combinacion" && <small className="muted" style={{display:"block",marginTop:6,color:"var(--warn)"}}>⏹ Esta respuesta finaliza el formulario: no se mostrarán más preguntas.</small>}
    </div>
    );
  })}</>);
}

function ActividadResumen({preguntas,act}){

/* ============================ APP ============================ */
const App=()=>{
  const [theme,setTheme]=useState("light");
  const [users,setUsers]=useState([]);
  const [schools,setSchools]=useState([]);
  const [campaigns,setCampaigns]=useState([]);      // sin campaña pre-establecida (aún en memoria, ver README)
  const [records,setRecords]=useState([]);          // registros por CE/campaña (aún en memoria, ver README)
  const [session,setSession]=useState(null);
  const [cargandoSesion,setCargandoSesion]=useState(true); // evita el parpadeo de "Login" mientras se revisa si ya había sesión
  const [view,setView]=useState("bandeja");
  const [filtro,setFiltro]=useState(defaultFiltro); // {desde,hasta} — día único (desde===hasta) o período
  const [pausa,setPausa]=useState(false);           // pausar nuevas llamadas (global)
  const [toast,setToast]=useState(null);
  const [dailyLog,setDailyLog]=useState([]);
  const [limites,setLimites]=useState(()=>{const m={};AUXILIARES.forEach(k=>m[k]=LIMITES_DEFAULT[k]*60);return m;}); // segundos por auxiliar
  const [auxHabilitados,setAuxHabilitados]=useState(()=>{const m={};AUXILIARES.forEach(k=>m[k]=true);return m;});
  const [auxUltimoCambio,setAuxUltimoCambio]=useState(null); // {por, cuando}
  const [recoveryUserId,setRecoveryUserId]=useState(null); // id del usuario que está recuperando su contraseña (aún sin sesión)

  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);},[theme]);
  const notify=(m,kind="ok")=>{setToast({m,kind});setTimeout(()=>setToast(null),2800);};

  // cargar todo lo que depende de la sesión (perfiles, centros, tiempos) una vez que hay alguien autenticado
  const cargarDatosDeSesion=async(perfilPropio)=>{
    const [perfiles,centros,tiempos,campReg,config]=await Promise.all([fetchProfiles(),fetchCentrosEscolares(),fetchTiemposDiarios(),fetchCampaignsAndRecords(),fetchConfiguracion()]);
    setUsers(perfiles.length?perfiles:[perfilPropio]);
    setSchools(centros);
    setDailyLog(tiempos);
    setCampaigns(campReg.campaigns);
    setRecords(campReg.records);
    if(Object.keys(config.limites).length) setLimites(config.limites);
    if(Object.keys(config.auxHabilitados).length) setAuxHabilitados(config.auxHabilitados);
    if(config.auxUltimoCambio) setAuxUltimoCambio(config.auxUltimoCambio);
  };

  // al montar: ¿ya había una sesión activa (el navegador la recuerda)?
  useEffect(()=>{
    if(!supabase){ setCargandoSesion(false); return; }
    (async()=>{
      const {data:{session:sesionSupabase}}=await supabase.auth.getSession();
      if(sesionSupabase&&sesionSupabase.user){
        const {data:perfil}=await supabase.from("profiles").select("*").eq("id",sesionSupabase.user.id).single();
        if(perfil&&perfil.estado==="activo"){
          const u={...dbProfileToUser(perfil),email:sesionSupabase.user.email};
          setSession(u);
          await cargarDatosDeSesion(u);
        }
      }
      setCargandoSesion(false);
    })();
    const {data:sub}=supabase.auth.onAuthStateChange((event)=>{
      if(event==="PASSWORD_RECOVERY") setRecoveryUserId("recuperacion-supabase");
    });
    return ()=>sub&&sub.subscription&&sub.subscription.unsubscribe();
  },[]);

  // reflejar cambios de la sesión en la lista de usuarios (estatus, skill, etc.) — optimista en memoria + persistido en Supabase
  const patchUser=(id,patch)=>{
    setUsers(p=>p.map(u=>u.id===id?{...u,...patch}:u));
    if(session&&session.id===id) setSession(s=>({...s,...patch}));
    if(supabase) updateProfile(id,patch);
  };
  const bumpDaily=(agentId,date,field,deltaSec)=>{
    bumpDailyLog(setDailyLog,agentId,date,field,deltaSec);
    if(supabase) bumpTiempoDiario(agentId,date,field,deltaSec);
  };
  const toggleAuxiliar=k=>{
    const nuevo={...auxHabilitados,[k]:auxHabilitados[k]===false};
    setAuxHabilitados(nuevo);
    const cambio={porId:session?session.id:null,cuando:Date.now()};
    setAuxUltimoCambio(cambio);
    if(supabase) updateConfiguracion("auxiliares_habilitados",nuevo,session?session.id:null);
    if(session) registrarAccion(session.id,"toggle_auxiliar",`${session.nombre} ${nuevo[k]?"habilitó":"deshabilitó"} el auxiliar «${k}»`);
  };

  const ctx={theme,setTheme,users,setUsers,patchUser,schools,setSchools,campaigns,setCampaigns,records,setRecords,session,setSession,view,setView,filtro,setFiltro,pausa,setPausa,notify,dailyLog,setDailyLog,bumpDaily,limites,setLimites,auxHabilitados,setAuxHabilitados,auxUltimoCambio,toggleAuxiliar,recoveryUserId,setRecoveryUserId,cargarDatosDeSesion};
  if(cargandoSesion) return <div className="login-wrap"><div className="login-panel"><div className="login-card"><p className="sub">Cargando…</p></div></div></div>;
  if(recoveryUserId) return <CambiarPassword ctx={ctx} modo="recuperacion"/>;
  if(!session) return <Login ctx={ctx}/>;
  if(session.debeCambiarPassword) return <CambiarPassword ctx={ctx} modo="primerIngreso"/>;
  return <Shell ctx={ctx} toast={toast}/>;
};

/* ============================ LOGIN ============================ */
function Login({ctx}){
  const {setSession,setView,cargarDatosDeSesion,notify}=ctx;
  const [mode,setMode]=useState("login"); // login | reg | olvide
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [msg,setMsg]=useState(null);
  const [loading,setLoading]=useState(false);
  const [rn,setRn]=useState(""),[re,setRe]=useState(""),[rp,setRp]=useState(""),[rr,setRr]=useState("Agente");
  const [fpEmail,setFpEmail]=useState("");
  const firstView=u=>CAN[u.rol].bandeja?"bandeja":(CAN[u.rol].campanas?"campanas":"consulta");

  const login=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    setMsg(null);setLoading(true);
    const {data,error}=await supabase.auth.signInWithPassword({email:email.trim(),password:pass});
    if(error){ setLoading(false); return setMsg({k:"err",t:mapAuthError(error)}); }
    const {data:perfil,error:perr}=await supabase.from("profiles").select("*").eq("id",data.user.id).single();
    if(perr||!perfil){ setLoading(false); await supabase.auth.signOut(); return setMsg({k:"err",t:"No se encontró tu perfil. Contacta al Administrador."}); }
    if(perfil.estado==="pendiente"){ setLoading(false); await supabase.auth.signOut(); return setMsg({k:"info",t:"Tu cuenta está pendiente de aprobación por un Administrador o Supervisor."}); }
    if(perfil.estado==="inactivo"){ setLoading(false); await supabase.auth.signOut(); return setMsg({k:"err",t:"Tu cuenta fue dada de baja. Contacta al Administrador."}); }
    const u={...dbProfileToUser(perfil),email:data.user.email,loginSince:Date.now()};
    const ms=Date.now(),hoy=dayKey();
    registrarAccion(u.id,"login",`${u.nombre} (${u.rol}) inició sesión`); // no bloqueante
    await Promise.all([
      updateProfile(u.id,{loginSince:u.loginSince}),
      registrarPrimerLoginDB(u.id,hoy,ms),
      cargarDatosDeSesion(u),
    ]);
    setLoading(false);
    console.log(`[LOGIN] ${u.nombre} (${u.rol}) · ${hoy} ${new Date(ms).toLocaleTimeString("es-SV")} — primer login del día registrado si no existía uno previo.`);
    setSession(u);setView(firstView(u));
  };

  const register=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    if(!rn||!re||!rp)return setMsg({k:"err",t:"Completa todos los campos."});
    if(!passwordValida(rp))return setMsg({k:"err",t:"La contraseña no cumple los requisitos mínimos (ver la lista debajo del campo)."});
    setLoading(true);
    const {data,error}=await supabase.auth.signUp({email:re.trim(),password:rp,options:{data:{nombre:rn,rol:rr}}});
    setLoading(false);
    if(error) return setMsg({k:"err",t:mapAuthError(error)});
    if(data&&data.user) registrarAccion(data.user.id,"solicitar_acceso",`${rn} solicitó acceso como ${rr}`);
    setMsg({k:"ok",t:"Solicitud enviada. Un Administrador o Supervisor debe aprobar tu acceso."});setMode("login");setEmail(re.trim());setPass("");
  };

  const olvide=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    if(!fpEmail)return setMsg({k:"err",t:"Escribe tu correo institucional."});
    setLoading(true);
    const {error}=await supabase.auth.resetPasswordForEmail(fpEmail.trim(),{redirectTo:window.location.href.split("#")[0].split("?")[0]});
    setLoading(false);
    // Por seguridad no revelamos si el correo existe o no (Supabase ya se comporta así).
    if(error) return setMsg({k:"err",t:mapAuthError(error)});
    setMsg({k:"ok",t:"Si ese correo tiene una cuenta, te enviamos un enlace para crear una nueva contraseña. Revisa tu bandeja de entrada (y spam)."});
  };

  return (<div className="login-wrap">

        <h1>Actividades de Centros Educativos</h1>
        <p className="lead">Levantamiento semanal por teléfono: asigna centros, registra actividades y da seguimiento en tiempo real.</p>
        <div className="pulse-row">
          <span className="pulse"><i style={{background:"#2fbd77"}}/>Bandeja por agente</span>
          <span className="pulse"><i style={{background:"#ffb71a"}}/>Registro por día o período</span>
          <span className="pulse"><i style={{background:"#5b8def"}}/>Consulta y edición</span>
        </div>
      </div>
      <div className="foot">Acceso restringido a personal autorizado · GOES 2026</div>
      <div className="ticker mono">12345 · Contactado · 3 actividades — 12348 · Llamar nuevamente — 12350 · Contactado · 1 actividad — 12347 · No contestó —</div>
    </div>
    <div className="login-panel"><div className="login-card">
      {mode==="login"&&<>
        <h2>Iniciar sesión</h2><p className="sub">Ingresa con tu correo institucional.</p>
        {msg&&<div className={"alert alert-"+(msg.k==="err"?"err":msg.k==="ok"?"ok":"info")}>{msg.t}</div>}
        <div className="field"><label>Correo</label><input className="input" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="usuario@goes.gob.sv"/></div>
        <div className="field"><label>Contraseña</label><PasswordInput value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="••••••"/></div>
        <button className="btn btn-primary" disabled={loading} onClick={login}>{loading?"Entrando…":"Entrar"}</button>
        <p className="hint">
          <span className="link" onClick={()=>{setMode("olvide");setMsg(null);setFpEmail(email);}}>¿Olvidaste tu contraseña?</span><br/>
          ¿No tienes cuenta? <span className="link" onClick={()=>{setMode("reg");setMsg(null);}}>Crear usuario</span></p>
      </>}
      {mode==="reg"&&<>
        <h2>Crear usuario</h2><p className="sub">Tu acceso quedará pendiente hasta su aprobación.</p>
        {msg&&<div className={"alert alert-"+(msg.k==="err"?"err":"ok")}>{msg.t}</div>}
        <div className="field"><label>Nombre completo</label><input className="input" value={rn} onChange={e=>setRn(e.target.value)}/></div>
        <div className="field"><label>Correo institucional</label><input className="input" value={re} onChange={e=>setRe(e.target.value)} placeholder="usuario@goes.gob.sv"/></div>
        <div className="field"><label>Contraseña</label><PasswordInput value={rp} onChange={e=>setRp(e.target.value)}/>
          <PasswordChecklist value={rp}/>
        </div>
        <div className="field"><label>Rol solicitado</label><select className="input" value={rr} onChange={e=>setRr(e.target.value)}>{ROLES.map(r=><option key={r}>{r}</option>)}</select></div>

        {msg&&<div className={"alert alert-"+(msg.k==="err"?"err":"ok")}>{msg.t}</div>}
        <div className="field"><label>Correo institucional</label><input className="input" value={fpEmail} onChange={e=>setFpEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&olvide()} placeholder="usuario@goes.gob.sv"/></div>
        <button className="btn btn-primary" disabled={loading} onClick={olvide}>{loading?"Enviando…":"Enviar enlace de recuperación"}</button>
        <p className="hint"><span className="link" onClick={()=>{setMode("login");setMsg(null);}}>Volver a iniciar sesión</span></p>

/* ---- pantalla de cambio de contraseña (primer ingreso obligatorio, o tras "recuperar contraseña") ---- */
function CambiarPassword({ctx,modo}){
  const {session,setSession,recoveryUserId,setRecoveryUserId,notify}=ctx;
  const [p1,setP1]=useState("");
  const [p2,setP2]=useState("");
  const [msg,setMsg]=useState(null);
  const [loading,setLoading]=useState(false);

  const guardar=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    if(!passwordValida(p1)) return setMsg({k:"err",t:"La contraseña no cumple los requisitos mínimos."});
    if(p1!==p2) return setMsg({k:"err",t:"Las dos contraseñas no coinciden."});
    setLoading(true);
    const {data,error}=await supabase.auth.updateUser({password:p1});
    if(!error && data && data.user){
      await supabase.from("profiles").update({debe_cambiar_password:false}).eq("id",data.user.id);
    }
    setLoading(false);
    if(error) return setMsg({k:"err",t:mapAuthError(error)});
    notify("Contraseña actualizada correctamente.");
    if(modo==="recuperacion"){ registrarAccion(data.user.id,"recuperar_password","Contraseña restablecida vía enlace de recuperación"); setRecoveryUserId(null); await supabase.auth.signOut(); }
    else { registrarAccion(session.id,"cambiar_password","Contraseña cambiada en el primer ingreso"); setSession(s=>({...s,debeCambiarPassword:false})); }
  };

  return (<div className="login-wrap">
    <div className="login-hero">
      <div className="crest"><div className="mark">M</div>Ministerio de Educación · El Salvador</div>
      <div><h1>{modo==="primerIngreso"?"Configura tu nueva contraseña":"Restablece tu contraseña"}</h1>
        <p className="lead">{modo==="primerIngreso"?"Por seguridad, debes cambiar tu contraseña antes de continuar.":"Elige una nueva contraseña para tu cuenta."}</p></div>
      <div className="foot">Acceso restringido a personal autorizado · GOES 2026</div>
    </div>
    <div className="login-panel"><div className="login-card">
      <h2>Nueva contraseña</h2>
      {msg&&<div className={"alert alert-"+(msg.k==="err"?"err":"ok")}>{msg.t}</div>}
      <div className="field"><label>Nueva contraseña</label><PasswordInput value={p1} onChange={e=>setP1(e.target.value)}/>
        <PasswordChecklist value={p1}/>
      </div>
      <div className="field"><label>Confirmar nueva contraseña</label><PasswordInput value={p2} onChange={e=>setP2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&guardar()}/></div>
      <button className="btn btn-primary" disabled={loading} onClick={guardar}>{loading?"Guardando…":"Guardar contraseña"}</button>
      {modo==="recuperacion" && <p className="hint"><span className="link" onClick={async()=>{setRecoveryUserId(null);await supabase.auth.signOut();}}>Cancelar y volver a iniciar sesión</span></p>}
    </div></div>
  </div>);
}

/* ---- modal de cambio de contraseña voluntario (usuario ya con sesión iniciada) ---- */
function CambiarPasswordModal({ctx,onClose}){
  const {session,notify}=ctx;
  const [actual,setActual]=useState("");
  const [p1,setP1]=useState("");
  const [p2,setP2]=useState("");
  const [msg,setMsg]=useState(null);
  const [loading,setLoading]=useState(false);

  const guardar=async()=>{
    if(!supabase) return setMsg({k:"err",t:"Falta configurar la conexión a Supabase."});
    if(!actual) return setMsg({k:"err",t:"Escribe tu contraseña actual."});
    if(!passwordValida(p1)) return setMsg({k:"err",t:"La nueva contraseña no cumple los requisitos mínimos."});
    if(p1!==p2) return setMsg({k:"err",t:"Las dos contraseñas nuevas no coinciden."});
    setLoading(true);
    // confirmamos la contraseña actual re-autenticando antes de cambiarla
    const {error:errActual}=await supabase.auth.signInWithPassword({email:session.email,password:actual});
    if(errActual){ setLoading(false); return setMsg({k:"err",t:"La contraseña actual no es correcta."}); }
    const {error}=await supabase.auth.updateUser({password:p1});
    setLoading(false);
    if(error) return setMsg({k:"err",t:mapAuthError(error)});
    notify("Contraseña actualizada correctamente.");
    registrarAccion(session.id,"cambiar_password","Contraseña cambiada voluntariamente");
    onClose();
  };

  return (<Modal title="Cambiar contraseña" onClose={onClose} foot={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-accent" disabled={loading} onClick={guardar}>{loading?"Guardando…":"Guardar"}</button></>}>
    {msg&&<div className={"alert alert-"+(msg.k==="err"?"err":"ok")} style={{marginTop:0}}>{msg.t}</div>}
    <div className="field"><label>Contraseña actual</label><PasswordInput value={actual} onChange={e=>setActual(e.target.value)}/></div>
    <div className="field"><label>Nueva contraseña</label><PasswordInput value={p1} onChange={e=>setP1(e.target.value)}/>
      <PasswordChecklist value={p1}/>
    </div>
    <div className="field" style={{marginBottom:0}}><label>Confirmar nueva contraseña</label><PasswordInput value={p2} onChange={e=>setP2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&guardar()}/></div>
  </Modal>);
}

/* selector de semana */
function FiltroFecha({filtro,setFiltro}){
  const [open,setOpen]=useState(false);
  const modo=filtro.desde===filtro.hasta?"dia":"periodo";
  const setModo=m=>{ if(m==="dia") setFiltro({desde:filtro.desde,hasta:filtro.desde}); else setFiltro({desde:filtro.desde,hasta:addDays(filtro.desde,6)}); };
  return (<div style={{position:"relative"}}>
    <button className="weekpill" onClick={()=>setOpen(o=>!o)} title="Filtro de fecha">📅 {rangeLabel(filtro.desde,filtro.hasta)} <span style={{opacity:.6}}>▾</span></button>
    {open && <>
      <div style={{position:"fixed",inset:0,zIndex:39}} onClick={()=>setOpen(false)}/>
      <div className="card card-pad" style={{position:"absolute",top:"110%",right:0,zIndex:40,width:270,boxShadow:"var(--shadow-lg)"}}>
        <div className="seg" style={{marginBottom:10,width:"100%"}}>
          <button className={modo==="dia"?"on":""} style={{flex:1}} onClick={()=>setModo("dia")}>Un día</button>
          <button className={modo==="periodo"?"on":""} style={{flex:1}} onClick={()=>setModo("periodo")}>Período</button>
        </div>
        {modo==="dia" ? (
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setFiltro({desde:addDays(filtro.desde,-1),hasta:addDays(filtro.desde,-1)})}>‹</button>
            <input className="input" type="date" value={filtro.desde} onChange={e=>setFiltro({desde:e.target.value,hasta:e.target.value})}/>
            <button className="btn btn-ghost btn-sm" onClick={()=>setFiltro({desde:addDays(filtro.desde,1),hasta:addDays(filtro.desde,1)})}>›</button>
          </div>
        ) : (<>
          <div className="field" style={{margin:"0 0 8px"}}><label>Desde</label><input className="input" type="date" value={filtro.desde} max={filtro.hasta} onChange={e=>setFiltro(f=>({...f,desde:e.target.value}))}/></div>
          <div className="field" style={{margin:0}}><label>Hasta</label><input className="input" type="date" value={filtro.hasta} min={filtro.desde} onChange={e=>setFiltro(f=>({...f,hasta:e.target.value}))}/></div>
        </>)}
        <button className="btn btn-primary btn-sm" style={{marginTop:10,width:"100%"}} onClick={()=>setOpen(false)}>Aplicar</button>
      </div>
    </>}
  </div>);
}

/* control de estatus operativo del agente (Activo/Baño/Break/Comida) */
function AgentStatusControl({ctx}){
  const {session,patchUser,bumpDaily,dailyLog,limites,auxHabilitados,notify}=ctx;
  const cur=session.opStatus||"Activo";
  const now=useNow(cur!=="Activo");
  const elapsed=cur!=="Activo"?Math.max(0,liveTotal(dailyLog,session,STATUS_FIELD[cur],now)):0;
  const limite=limites[cur]; // segundos, undefined para "Activo"
  const nivel=cur!=="Activo"?nivelTiempo(elapsed,limite):null;
  const set=k=>{
    const s=session,t=Date.now(),old=s.opStatus||"Activo";
    if(old!=="Activo" && s.statusSince && STATUS_FIELD[old]) bumpDaily(s.id,dayKey(),STATUS_FIELD[old],(t-s.statusSince)/1000);
    patchUser(s.id,{opStatus:k,statusSince:k!=="Activo"?t:null});notify("Estatus: "+k);
  };
  const opciones=OP_STATUSES.filter(s=>s.k==="Activo"||auxHabilitados[s.k]!==false);
  return (<div className="seg" title="Tu estatus operativo">
    {opciones.map(s=><button key={s.k} className={cur===s.k?"on":""} onClick={()=>set(s.k)}>{s.k}</button>)}
    {cur!=="Activo"&&<span className={"pill "+opPill(cur)} style={{marginLeft:4}}><i/><span style={estiloNivel(nivel)}>{fmtLong(elapsed)}</span>{limite?" / "+fmtLong(limite):""}</span>}
  </div>);
}

/* ============================ BANDEJA DEL AGENTE ============================ */
function Bandeja({ctx}){
  const {session,schools,campaigns,records,filtro,pausa}=ctx;
  const isAgent=session.rol==="Agente";
  // campañas en curso cuyo rango de fechas se solapa con el filtro, donde el agente participa
  const misCamp=campaigns.filter(c=>overlaps(c.fechaDesde,c.fechaHasta,filtro.desde,filtro.hasta) && c.estado==="En curso" && (!isAgent || Object.values(getAssign(c)).includes(session.id)));
  const [campId,setCampId]=useState(null);
  useEffect(()=>{ if(!misCamp.some(c=>c.id===campId)) setCampId(misCamp[0]?.id||null); },[filtro.desde,filtro.hasta,campaigns.length]);
  const camp=misCamp.find(c=>c.id===campId)||misCamp[0];
  const [active,setActive]=useState(null);

  const gate=puedeLlamar(session,pausa,camp);

  if(misCamp.length===0) return <div className="card card-pad"><div className="empty"><div className="big">📭</div>No tienes centros asignados para {rangeLabel(filtro.desde,filtro.hasta)}.<br/>Cuando un supervisor cree y te asigne una campaña, aparecerán aquí.</div></div>;

  const assign=getAssign(camp);
  const myCodes=camp.schoolCodes.filter(code=> isAgent ? assign[code]===session.id : true);

  const enBandeja=rows.filter(x=>x.estado!=="Contactado" && x.estado!=="Cerrado por no contacto");
  const cerradas=rows.filter(x=>x.estado==="Contactado" || x.estado==="Cerrado por no contacto");
  const maxIntentos=camp.maxIntentos||DEFAULT_MAX_INTENTOS;
  const btnLabel=r=> (!r||r.estado==="Pendiente")?"Contactar":(["No contestó","Número equivocado","Llamar nuevamente"].includes(r.estado)?"Reintentar":"Continuar");

  return (<div className="grid">
    <div className="card card-pad">
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>

        <span className="tag">{cerradas.filter(x=>x.estado==="Contactado").length} contactados</span>

    </div>

    {!gate.ok && <div className="banner banner-warn">🔒 {gate.motivo}</div>}

    <div>
      <div className="section-title">Centros por contactar ({enBandeja.length})</div>
      <div className="tbl-wrap" style={{maxHeight:360}}>
        <table>
          <thead><tr><th>Código</th><th>Centro Educativo</th><th>Depto.</th><th>Municipio</th><th>Teléfonos</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            {enBandeja.map(({s,r,estado})=>(
              <tr key={s.codigo}>
                <td className="mono">{s.codigo}</td>
                <td><div style={{fontWeight:600}}>{s.nombre}</div>
                  <div style={{display:"flex",gap:4,marginTop:3}}>{s.programa&&<span className="tag">{s.programa}</span>}{s.control&&<span className="tag">Control</span>}</div></td>
                <td>{s.departamento}</td><td>{s.municipio}</td>
                <td className="mono" style={{fontSize:12}}>{s.telefonos.join(" · ")}</td>

                  {r&&r.wrong&&r.wrong.length>0&&<span className="tag" style={{color:"var(--danger)",marginLeft:4}}>📵 {r.wrong.length}</span>}
                  {r&&r.intentos>0&&estado!=="Pendiente"&&<div className="mini" style={{marginTop:3}}>{r.intentos}/{maxIntentos}</div>}
                </td>

            ))}
